<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="101個理由互動閱讀站｜每天一個理由，連結英語學習、信仰與終身學習。"><title>101 Reasons to Read the Bilingual Bible</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafbf7;color:#2f382c;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#6b5c48;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#6b5c48;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#edf0e8!important;color:#44503d!important}.card{background:#fff;border:1px solid #e1e6dc;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1ea;color:#4f5d46;font-size:13px;font-weight:800}.hidden{display:none}.output{white-space:pre-wrap;background:#f4f6f1;border-radius:10px;padding:14px}.story{font-size:21px}.verse{font-size:28px;font-weight:900;line-height:1.4}.zh{font-size:23px;font-weight:800}.quiz label{display:block;border:1px solid #dde5d8;border-radius:9px;padding:9px;margin:7px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #c8d2c2;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.muted{color:#667162;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}.verse{font-size:24px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=101%20Reasons%20to%20Read%20the%20Bilingual%20Bible%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>101 Reasons to Read the Bilingual Bible</h1><p>101個理由互動閱讀站｜每天一個理由，連結英語學習、信仰與終身學習。</p></div></header><main><section class="card"><div class="actions"><button id="prev" class="secondary">上一個</button><button id="random">隨機一個理由</button><button id="next" class="secondary">下一個</button></div></section>
<section class="card"><span class="tag" id="num"></span><h2 id="title"></h2><div id="reason" class="output"></div><p id="action"></p></section>
<section class="card"><h2>我的收藏</h2><button id="fav">加入收藏</button><div id="favorites"></div></section></main><script>const reasons=[
["同時學語言與信仰","同一段內容中英對照，能把熟悉的信仰內容變成英文學習支架。","今天讀一節熟悉經文，先看中文再看英文。"],
["降低英文閱讀焦慮","已知內容能降低陌生感，讓英文閱讀不必從零猜測。","找一節你熟悉的經文，只圈出3個英文關鍵字。"],
["累積高頻核心字彙","love, faith, hope, grace, peace 等字會反覆出現，適合長期累積。","今天只記一個反覆出現的字。"],
["建立每日微學習習慣","一天一節比一次讀很多更容易長期持續。","設定每天固定5分鐘。"],
["練習英文朗讀","經文句子短而有節奏，適合反覆朗讀與跟讀。","把同一節英文慢讀3次。"],
["幫助記憶","熟悉的意義能提供語意線索，讓英文單字更容易記住。","把新單字和經文情境綁在一起。"],
["訓練雙語切換","中英對照能練習從概念到語言的快速切換。","先遮中文，看英文能不能說出大意。"],
["建立價值觀語言","能學會 kindness, forgiveness, courage 等品格詞彙。","選一個品格字寫一句英文。"],
["適合親子共讀","大人和孩子可用同一節經文做不同深度的討論。","今天問孩子：這節經文最重要的是什麼？"],
["適合樂齡學習","熟悉主題＋短篇幅＋重複性，降低記憶負擔。","只讀一句，不求一次記很多。"],
["讓英文學習有目的","不是為考試而讀，而是為理解、反思與分享。","今天用一句英文分享你讀到的重點。"],
["強化聽力","搭配朗讀可反覆聽同一節，建立聲音與文字連結。","先聽，再看，再跟讀。"],
["建立終身學習素材庫","聖經文本量大、主題多，可長期作為閱讀素材。","建立自己的雙語經文收藏。"],
["練習摘要","每讀一節都可以用一句中文與一句英文摘要。","寫下 Today's Main Message。"],
["培養反思能力","經文閱讀不是只有理解內容，也能連結生活。","問自己：這節今天要我做什麼？"]
];while(reasons.length<101){const n=reasons.length+1;reasons.push(["理由 "+n,"持續閱讀雙語聖經，可以讓語言學習、反思與價值實踐形成長期習慣。","今天選一節經文，完成5分鐘雙語閱讀。"])}const $=x=>document.getElementById(x);let i=(new Date().getDate()-1)%reasons.length,favs=JSON.parse(localStorage.getItem("bilingual-bible-101-favs-v1")||"[]");function render(){const r=reasons[i];$("num").textContent="#"+(i+1)+" / 101";$("title").textContent=r[0];$("reason").textContent=r[1];$("action").innerHTML="<b>今天行動：</b>"+r[2];showFav()}$("prev").onclick=()=>{i=(i+100)%101;render()};$("next").onclick=()=>{i=(i+1)%101;render()};$("random").onclick=()=>{i=Math.floor(Math.random()*101);render()};$("fav").onclick=()=>{if(!favs.includes(i))favs.push(i);localStorage.setItem("bilingual-bible-101-favs-v1",JSON.stringify(favs));showFav()};function showFav(){$("favorites").innerHTML=favs.length?favs.map(x=>'<p><button class="secondary" onclick="i='+x+';render()">#'+(x+1)+' '+reasons[x][0]+'</button></p>').join(""):"尚未收藏。"}render();</script></body></html>
