<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多益資料已送出｜T-PASS TOEIC</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f3f8f5;color:#183126}
.wrap{max-width:720px;margin:0 auto;padding:56px 20px}
.card{background:white;border:1px solid #d9e7df;border-radius:22px;padding:28px;box-shadow:0 12px 30px rgba(0,0,0,.06)}
h1{margin-top:0;font-size:32px}
p{line-height:1.8}
.note{color:#5f6f66}
.btn{display:inline-block;margin-top:10px;padding:14px 18px;border-radius:12px;background:#173f2d;color:white;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<h1>資料已送出</h1>
<p>你已完成這一步的資料送出。請回到 TOEIC Command Center，依主線繼續下一個學習步驟。</p>
<div id="receipt" class="note" style="padding:14px;background:#f6faf7;border-radius:12px;margin:14px 0">正在讀取本次送出紀錄…</div>
<p class="note">注意：此頁代表表單已完成送出流程；Gary 端仍以 Gmail 實際收件作為最終驗收依據。</p>
<a class="btn" href="/tpass-toeic-command-center/">← 回到 TOEIC Command Center</a>
<a class="btn" id="sourceBack" href="#" style="display:none;background:#fff;color:#173f2d;border:2px solid #173f2d;margin-left:8px">回原測驗頁</a>
</section>
</main>
<script>
(function(){
  const box=document.getElementById("receipt");
  const back=document.getElementById("sourceBack");
  let d=null;
  try{d=JSON.parse(localStorage.getItem("tpass_last_completed_submission")||"null")}catch(e){}
  if(!d){box.textContent="沒有找到本機送出識別資料；仍可直接回 Command Center。";return}
  box.innerHTML="<b>本次送出：</b>"+(d.assessment_type||"多益資料")+
    "<br><b>Submission ID：</b>"+(d.submission_id||"未提供")+
    "<br><b>Delivery Token：</b>"+(d.delivery_token||"未提供")+
    "<br><b>送出時間：</b>"+new Date(d.submitted_at).toLocaleString("zh-TW");
  try{
    const u=new URL(d.source_page,location.origin);
    if(u.origin===location.origin){
      back.href=u.href;back.style.display="inline-block";
    }
  }catch(e){}
})();
</script>
</body>
</html>
