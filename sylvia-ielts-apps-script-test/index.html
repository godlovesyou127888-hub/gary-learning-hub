<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sylvia IELTS｜Apps Script 寄送測試</title>
<style>
body{margin:0;background:#f6f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px}
h1{margin-top:0}
label{display:block;margin:14px 0 6px;font-weight:700}
input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}
textarea{min-height:180px}
button{margin-top:16px;border:0;border-radius:10px;padding:12px 16px;background:#5b5bd6;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.note{margin-top:16px;padding:12px;border-radius:10px;background:#f5f3ff}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>Sylvia IELTS｜Apps Script 寄送測試</h1>
    <p>只測試：姓名 + Email + 作文 → Google Apps Script → Gary Gmail。</p>

    <form action="https://script.google.com/macros/s/AKfycbwenIqOvRJDaFiR6V0uert6-EPkcj9uVELDM5IWUga4_-3BPSVfF1VuLtyktgHDhDzx/exec" method="POST" target="_blank">
      <input type="hidden" name="submission_id" id="submission_id">
      <input type="hidden" name="task_type" value="Task 1 Test">
      <input type="hidden" name="question" value="Minimal Apps Script delivery test">

      <label for="student_name">姓名</label>
      <input id="student_name" name="student_name" value="Sylvia" required>

      <label for="student_email">Email</label>
      <input id="student_email" name="student_email" type="email" value="godlovesyou127888@gmail.com" required>

      <label for="essay">測試作文</label>
      <textarea id="essay" name="essay" required>This is a test IELTS Writing submission from the new Google Apps Script endpoint.</textarea>

      <button type="submit">送出 Apps Script 測試</button>
    </form>

    <div class="note" id="status">送出後會開啟 Apps Script 回應頁。看到「IELTS Writing 已成功送出」後，再回來告訴 Gary。</div>
  </section>
</main>

<script>
const id='IELTS-TEST-'+Date.now();
document.getElementById('submission_id').value=id;
document.querySelector('form').addEventListener('submit',()=>{
  document.getElementById('status').innerHTML='已送出測試。<br><b>Submission ID：</b>'+id+'<br>請查看 Apps Script 新分頁結果。';
});
</script>
</body>
</html>
