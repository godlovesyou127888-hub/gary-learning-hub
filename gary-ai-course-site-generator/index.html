<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把課程需求快速轉成可開發的網站規格。"><title>Gary AI 課程網站生成器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#3f6b6b;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#3f6b6b;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20AI%20%E8%AA%B2%E7%A8%8B%E7%B6%B2%E7%AB%99%E7%94%9F%E6%88%90%E5%99%A8%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary AI 課程網站生成器</h1><p>把課程需求快速轉成可開發的網站規格。</p></div></header><main><section class="card"><h2>課程需求</h2><div class="grid"><label>課程名稱<input id="name" value="Travel English Lab"></label><label>學員<input id="audience" value="樂齡初學者"></label></div><label>核心任務<input id="task" value="學會10句旅遊英文並完成小測"></label><label>必要功能<input id="features" value="大字,中英對照,語音,小測,學習紀錄,JSON"></label><button id="generate">產生網站規格</button></section><section class="card"><h2>建站規格</h2><div id="out" class="output"></div><button id="copy">複製規格</button></section></main><script>const $=x=>document.getElementById(x);function gen(){const fs=$("features").value;$("out").textContent="【網站名稱】"+$("name").value+"\n【目標學員】"+$("audience").value+"\n【核心任務】"+$("task").value+"\n\n【頁面流程】\n1. 首頁：一句話說清楚價值\n2. 學習區：一次只做一個任務\n3. 練習區：立即作答與回饋\n4. 結果區：分數＋弱點＋下一步\n5. 保存區：下載／列印／交付\n\n【必要功能】\n"+fs.split(",").map(x=>"• "+x.trim()).join("\n")+"\n\n【QA完成線】\n手機可用、所有按鈕可點、無空白路由、可完成一次完整學習流程。"}$("generate").onclick=gen;$("copy").onclick=()=>navigator.clipboard.writeText($("out").textContent);gen();</script></body></html>
