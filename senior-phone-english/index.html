<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="電話溝通英文：接電話、找人、留言、確認資訊、聽不清楚。"><title>樂齡電話英文</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#5f596f;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#786f8e;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E9%9B%BB%E8%A9%B1%E8%8B%B1%E6%96%87%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡電話英文</h1><p>電話溝通英文｜看不到對方時，更需要簡單、清楚、可重複。</p></div></header><main>
<section class="card"><h2>五大電話情境</h2><div id="tabs" class="actions"></div></section><section class="card"><h2 id="title"></h2><div id="items"></div></section><section class="card"><h2>4 題小測</h2><div id="quiz" class="quiz"></div><button id="submit">完成小測</button></section><section id="result" class="card hidden"><div class="metric"><div><b id="score"></b>答對</div><div><b id="accuracy"></b>正確率</div><div><b id="count"></b>累積完成</div></div></section>
<script>
const data=[
["接電話 Answering",[["Hello, this is Gary speaking.","你好，我是 Gary。"],["May I ask who's calling?","請問您是哪位？"],["One moment, please.","請稍等一下。"],["Thank you for calling.","謝謝你打來。"]]],
["找人 Asking for someone",[["May I speak to Mr. Lee?","我可以找李先生嗎？"],["Is Mary available?","Mary 現在方便接電話嗎？"],["Could you put me through?","可以幫我轉接嗎？"],["When will he be back?","他什麼時候回來？"]]],
["留言 Message",[["Can I leave a message?","我可以留言嗎？"],["Please ask her to call me back.","請她回電給我。"],["My number is 0912-345-678.","我的電話是 0912-345-678。"],["Could you repeat the number?","可以再說一次電話號碼嗎？"]]],
["確認資訊 Confirming",[["Let me confirm the time.","讓我確認一下時間。"],["Did you say Tuesday?","你剛才是說星期二嗎？"],["Could you spell your name?","可以拼一下你的名字嗎？"],["Let me write that down.","讓我把它寫下來。"]]],
["聽不清楚 Clarifying",[["Please speak slowly.","請說慢一點。"],["Could you say that again?","可以再說一次嗎？"],["The line is not clear.","電話聲音不清楚。"],["I cannot hear you well.","我聽不太清楚。"]]]
];let idx=0,res=[];const $=x=>document.getElementById(x);function speak(t){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.58;speechSynthesis.cancel();speechSynthesis.speak(u)}
function render(){const [n,it]=data[idx];$("tabs").innerHTML=data.map((d,i)=>'<button class="'+(i===idx?'':'secondary')+'" onclick="idx='+i+';render()">'+d[0]+'</button>').join("");$("title").textContent=n;$("items").innerHTML=it.map(x=>'<div class="phrase"><div class="sentence">'+x[0]+'</div><div class="zh">'+x[1]+'</div><button onclick="speak(\''+x[0].replace(/'/g,"\\'")+'\')">慢速聽</button></div>').join("");$("quiz").innerHTML=it.map((x,i)=>{const o=[...it.map(y=>y[1])].sort(()=>Math.random()-.5);return '<p><b>'+x[0]+'</b></p>'+o.map(v=>'<label><input type=radio name=q'+i+' value="'+encodeURIComponent(v)+'"> '+v+'</label>').join("")}).join("");$("result").classList.add("hidden")}
$("submit").onclick=()=>{const it=data[idx][1];if(it.some((x,i)=>!document.querySelector('[name=q'+i+']:checked')))return;res=it.map((x,i)=>decodeURIComponent(document.querySelector('[name=q'+i+']:checked').value)===x[1]);const s=res.filter(Boolean).length;let h=JSON.parse(localStorage.getItem("senior-phone-history-v1")||"[]");h.unshift({date:new Date().toISOString(),scene:data[idx][0],score:s});localStorage.setItem("senior-phone-history-v1",JSON.stringify(h.slice(0,20)));$("score").textContent=s+"/4";$("accuracy").textContent=s*25+"%";$("count").textContent=h.length;$("result").classList.remove("hidden")};render();
</script></main></body></html>
