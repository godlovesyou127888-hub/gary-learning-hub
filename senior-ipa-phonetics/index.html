<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gary 樂齡IPA 國際音標入門站｜免費</title><style>body{font:20px/1.7 system-ui,"Noto Sans TC",sans-serif;background:#f5faf7;color:#173e32;margin:0}header{background:#205e4b;color:white;padding:26px}main{max-width:960px;margin:auto;padding:18px}a{color:#12604b}.panel{background:white;border:1px solid #d4e7dc;border-radius:18px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{border:1px solid #d4e7dc;padding:15px;border-radius:14px}button,.btn{font:inherit;background:#216a52;color:white;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-block;text-decoration:none;margin:4px}button:focus-visible,a:focus-visible{outline:3px solid orange}label{display:block;padding:7px}small{color:#47675a}h1{line-height:1.3}</style></head><body><header><a class="btn" href="/senior-learning-center/">返回樂齡總站</a><a class="btn" href="/senior-abc-phonics/">返回 Phonics</a><h1>Gary 樂齡IPA 國際音標入門站</h1><p>免費入門：12 組常見發音範例、中文解說、單字播放、5 題小測驗。</p></header><main><section class="panel"><h2>發音練習</h2><p><small>音標記號為學習提示，語音由瀏覽器朗讀英語單字，並非專業音標錄音。本頁以常見英式 IPA 字典記號為示例，播放聲音依裝置語音而異。</small></p><div id="cards" class="grid"></div></section><section class="panel"><h2>5 題小測驗</h2><p>選出符合音標的代表單字。</p><button id="start">重新出題</button><div id="quiz"></div><div id="result" role="status" aria-live="polite"></div></section><section class="panel"><h2>學完之後</h2><a class="btn" href="/senior-learning-center/">回樂齡學習總站</a><a class="btn" href="/senior-kk-phonetics/">前往KK獨立站</a></section></main><script>const rows=[["/iː/","see","看見"],["/ɪ/","sit","坐"],["/e/","bed","床"],["/æ/","cat","貓"],["/ɑː/","father","父親"],["/ɔː/","thought","想法"],["/ʊ/","book","書"],["/uː/","food","食物"],["/ʌ/","cup","杯子"],["/ə/","about","關於"],["/ʃ/","she","她"],["/θ/","think","思考"]];const cards=document.getElementById("cards");for(const [symbol,word,zh] of rows){const el=document.createElement("article");el.className="item";const h=document.createElement("h3");h.textContent=symbol;const p=document.createElement("p");p.textContent=word+"｜"+zh;const b=document.createElement("button");b.textContent="播放 "+word;b.onclick=()=>{if(!("speechSynthesis" in window)){alert("此瀏覽器不支援語音播放");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang="en-GB";u.rate=.7;speechSynthesis.speak(u)};el.append(h,p,b);cards.append(el)}const shuffle=a=>[...a].sort(()=>Math.random()-.5);document.getElementById("start").onclick=()=>{const picked=shuffle(rows).slice(0,5),quiz=document.getElementById("quiz");quiz.replaceChildren();document.getElementById("result").textContent="";picked.forEach((r,i)=>{const field=document.createElement("fieldset");const legend=document.createElement("legend");legend.textContent=(i+1)+". "+r[0]+" 對應哪個單字？";field.append(legend);const choices=shuffle([r,...shuffle(rows.filter(x=>x!==r)).slice(0,3)]);for(const o of choices){const lab=document.createElement("label");const radio=document.createElement("input");radio.type="radio";radio.name="q"+i;radio.value=o[1];lab.append(radio," "+o[1]+"｜"+o[2]);field.append(lab)}quiz.append(field)});const submit=document.createElement("button");submit.textContent="交卷並查看解析";submit.onclick=()=>{let score=0;const detail=[];picked.forEach((r,i)=>{const checked=quiz.querySelector('input[name="q'+i+'"]:checked');if(checked?.value===r[1])score++;detail.push((i+1)+". "+r[0]+" → "+r[1]+"（"+r[2]+"）"+(checked?"":"｜未作答"))});const result=document.getElementById("result");result.replaceChildren();const h=document.createElement("h3");h.textContent="得分："+score+"/5";const p=document.createElement("p");p.textContent=detail.join("；");result.append(h,p);try{localStorage.setItem("gary_ipa_quiz",JSON.stringify({score,date:new Date().toISOString()}))}catch{}};quiz.append(submit)};document.getElementById("start").click();</script></body></html>
