<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="依課次觀看 GARY 老師 2016 公益字彙課程，記錄進度並整理問題。">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>GARY 老師｜2016 公益字彙課程</title>
<link rel="stylesheet" href="style.css">
<script src="lessons.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
 <div class="wrap top-inner"><a class="brand" href="./"><span class="monogram" aria-hidden="true">G</span><span>GARY 老師</span></a>
 <nav aria-label="主要導覽"><a href="./#catalog">公益課程</a><a href="?view=extended" id="extended-nav">延伸學習</a><a href="#questions">Gmail 提問</a></nav></div>
</header>
<main class="wrap">
 <section class="hero" aria-labelledby="main-title">
  <div><p class="eyebrow">GARY'S VOCABULARY CLASS</p><h1 id="main-title">2016 公益字彙課程</h1><p class="intro" id="intro">跟著 GARY 老師學英文字根，邊看影片邊記下問題。</p></div>
  <div class="stats" id="stats"><div><strong id="lesson-count">24</strong><span>堂課</span></div><div><strong id="video-count">46</strong><span>部影片</span></div></div>
 </section>
 <div class="workspace">
  <section class="watch" aria-labelledby="lesson-title">
   <div class="watch-head"><div><p class="eyebrow">目前選擇</p><h2 id="lesson-title"></h2></div><span class="badge" id="word-range"></span></div>
   <div id="parts" class="parts" aria-label="影片段落"></div>
   <p id="practice" class="practice" hidden></p>
   <div id="player" class="player"></div>
   <div class="watch-actions">
    <button type="button" id="mark">標記已看完</button>
    <a id="external" target="_blank" rel="noopener noreferrer">在 YouTube 觀看 ↗</a>
   </div>
  </section>
  <aside id="catalog" class="catalog" aria-labelledby="catalog-title">
   <div class="catalog-head"><h2 id="catalog-title">課程目錄</h2><span id="progress-label"></span></div>
   <progress id="progress" aria-label="影片觀看進度"></progress>
   <label class="sr-only" for="search">搜尋課次或字彙編號</label>
   <input id="search" type="search" placeholder="搜尋課次或字彙編號">
   <div id="lessons" class="lessons"></div>
  </aside>
  <section id="questions" class="questions" aria-labelledby="question-title">
   <div class="question-head"><h2 id="question-title">這一段有問題？</h2><span id="question-context" class="badge"></span></div>
   <p class="hint">草稿會保存在這個瀏覽器。開啟 Gmail 後，請確認內容並自行寄出。</p>
   <form id="question-form" action="https://mail.google.com/mail/" method="get" target="_blank" rel="noopener noreferrer">
    <input type="hidden" name="view" value="cm">
    <input type="hidden" name="fs" value="1">
    <input type="hidden" name="to" value="godlovesyou127888@gmail.com">
    <input type="hidden" name="su" id="gmail-subject">
    <input type="hidden" name="body" id="gmail-body">
    <div class="fields">
     <label>單字或字根 <span>（選填）</span><input id="word" maxlength="100" placeholder="例如 spect"></label>
     <label>影片時間 <span>（選填）</span><input id="timestamp" maxlength="10" placeholder="例如 12:35" inputmode="text"></label>
    </div>
    <label>想問什麼？<textarea id="question" rows="3" maxlength="1600" required placeholder="例如：這個字根的意思是什麼？可以給我兩個例句嗎？"></textarea></label>
    <div class="form-actions">
     <button type="submit" class="primary">用 Gmail 向 GARY 老師提問 ↗</button>
    </div>
    <p id="feedback" role="status"></p>
   </form>
  </section>
 </div>
 <footer><a href="/">← 返回 Gary Learning Hub</a><a href="https://www.youtube.com/playlist?list=PLbNamdPNOwDf0mb9vhTwtZzwhzI_wF1m2" target="_blank" rel="noopener noreferrer">YouTube 課程清單 ↗</a></footer>
</main>
</body>
</html>
