<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>東東壁球戰術英文｜Gary Coach</title><style>body{margin:0;background:#edf4f8;color:#17344c;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:#123d56;color:white;padding:28px 18px}main{max-width:750px;margin:auto;padding:18px}h1{margin:0;font-size:1.7rem}p{line-height:1.7}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #16374a12}button,select,input{font:inherit;padding:12px;border-radius:12px;border:1px solid #b4c9d4}button{cursor:pointer;background:#126c88;color:white;border:0;margin:5px 5px 5px 0}button:disabled{opacity:.55}.choice{display:block;width:100%;text-align:left;background:#edf4f8;color:#153c53;border:1px solid #b7cbd7;margin:9px 0}.choice:focus{outline:3px solid #efb954}.muted{color:#567082}.correct{background:#d7f5e3}.wrong{background:#ffe0dd}.hide{display:none}#question{font-size:1.3rem;font-weight:700}small{display:block;color:#607987}a{color:#126c88}.study-list{display:grid;gap:10px}.study-item{border:1px solid #d6e3ea;border-radius:14px;padding:14px;background:#fbfdff}.study-en{font-size:1.15rem;font-weight:700;color:#123d56}.study-zh{font-size:1rem;margin-top:5px}.study-meta{font-size:.8rem;color:#68808e;margin-bottom:6px}.study-item button{margin-top:8px}.study-tools{display:flex;gap:8px;flex-wrap:wrap}.study-tools select,.study-tools input{flex:1;min-width:150px}</style><header><main><h1>東東壁球戰術英文</h1><p>Gary Coach · Squash Tactical English · 聽懂教練，打出戰術</p></main></header><main><section class="card"><label>學員名稱 <input id="student" value="東東" maxlength="40"></label><p><label>練習主題 <select id="topic"><option value="-1">全部主題混合</option></select></label></p><p><label>題型 <select id="mode"><option value="mixed">中英混合</option><option value="listen">英文聽力辨識</option><option value="zh">中文選英文</option></select></label></p><button id="start">開始隨機10題</button><button id="review">複習錯題</button><p class="muted">聽力使用裝置內建語音；英式英語語音是否可用依瀏覽器而定，不代表巴基斯坦教練真人口音。</p></section><section class="card" id="study"><h2>📚 分類學習｜英文＋中文＋聽發音</h2><p class="muted">先選主題，再逐條閱讀英文、中文意思與戰術說明。按「聽發音」可播放英文；可重複聆聽。</p><div class="study-tools"><select id="studyTopic"><option value="-1">全部主題</option></select><input id="studySearch" type="search" placeholder="搜尋英文或中文"></div><p id="studyCount" class="muted"></p><div id="studyList" class="study-list"></div></section><section class="card hide" id="quiz"><p id="progress"></p><p id="question"></p><button id="speak">▶ 播放英文</button><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" class="hide">下一題</button></section><section class="card hide" id="result"><h2>本次成績</h2><p id="score"></p><div id="details"></div><button id="email">寄給 Gary 教練（開啟郵件草稿）</button><button id="csv">匯出 CSV</button></section><section class="card"><h2>學習紀錄</h2><div id="history"></div><button id="clear">清除本機紀錄</button><small>紀錄只保存在目前瀏覽器，不會自動跨裝置同步或上傳伺服器。</small></section></main><script>const groups=[{"name":"基本戰術","items":[["Control the T","控制T點"],["Recover to the T","回到T點"],["Change the Pace","改變節奏"],["Apply Pressure","施加壓力"],["Maintain Pressure","保持壓力"],["Create Opportunities","創造機會"],["Turn Defence into Attack","防守轉進攻"],["Be Patient","保持耐心"],["Minimise Errors","減少失誤"],["Hit Quality Shots","打高品質的球"]]},{"name":"擊球技術","items":[["Straight Drive","直線長球"],["Cross-court Drive","斜線長球"],["Tight Shot","貼牆球"],["Deep Shot","深球"],["Drop Shot","吊球"],["Volley","截擊"],["Volley Drop","截擊吊球"],["Lob","高吊球"],["Defensive Lob","防守高吊球"],["Boast","反彈球"],["Kill Shot","殺球"],["Low Drive","低平球"]]},{"name":"進攻戰術","items":[["Attack the Front","攻擊前場"],["Attack the Back","攻擊後場"],["Move Your Opponent Front and Back","前後調動"],["Move Your Opponent Side to Side","左右調動"],["Hit into Open Space","打向空檔"],["Attack the Weaker Side","攻擊弱側"],["Take the Ball Early","搶先截擊"],["Increase the Pace","提高擊球速度"],["Change Direction","突然變線"],["Deep Then Drop","深球後接吊球"],["Force a Weak Return","逼出弱球"],["Finish the Rally","結束回合"]]},{"name":"防守戰術","items":[["Keep the Ball in Play","保持球在回合中"],["Defensive Lob","防守高球"],["Hit Deeper","打深一點"],["Recover to the T","回到T點"],["Buy Time","爭取時間"],["Relieve Pressure","擺脫壓力"],["Stay Consistent","保持穩定"],["Don't Take Risks","不要冒險"],["Reset the Rally","重建回合"],["Cover the Front","保護前場"],["Anticipate Your Opponent","預判對手"]]},{"name":"步伐與站位","items":[["T Position","T點"],["Footwork","步伐"],["Split Step","啟動步"],["Lunge","弓步"],["Prepare Early","提前準備"],["Move Early","提前移動"],["Recover Quickly","快速恢復"],["Stay Balanced","保持平衡"],["Keep Your Distance","保持距離"],["Clear the Ball","讓出擊球空間"],["Dominate the Middle","控制中心區域"],["Move Efficiently","高效移動"]]},{"name":"比賽心理","items":[["Stay Focused","保持專注"],["One Point at a Time","一分一分打"],["Stay Calm","保持冷靜"],["Don't Rush","不要著急"],["Stay Patient","保持耐心"],["Trust Your Game","相信自己的打法"],["Make the Right Decision","做出正確選擇"],["Read the Game","閱讀比賽"],["Adjust Your Tactics","調整戰術"],["Stay Confident","保持自信"],["Stay Disciplined","保持紀律性"],["Match Point","比賽分"]]},{"name":"教練常用指令","items":[["Hit it deep!","把球打深！"],["Keep it tight!","貼緊側牆！"],["Get back to the T!","回到T點！"],["Control the T!","控制T點！"],["Don't rush your attack!","不要著急進攻！"],["Be patient!","保持耐心！"],["Play more straight shots!","多打直線！"],["Cut down on cross-courts!","少打斜線！"],["Keep your opponent at the back!","把對手壓到後場！"],["Bring your opponent to the front!","把對手拉到前場！"],["Change the pace!","改變節奏！"],["Take it early!","提前截擊！"],["Take your chance!","抓住機會！"],["Don't give away easy points!","不要送分！"],["Establish your length first!","先打好長球！"],["Wait for the short ball!","等待短球機會！"],["Don't force a winner!","不要強行打致勝球！"],["Make your opponent work!","讓對手多跑動！"],["Watch your opponent!","觀察對手！"],["Stay in the rally!","不要放棄這一分！"]]},{"name":"十大核心戰術","items":[["Control the T","控制T點"],["Establish Good Length","建立長球優勢"],["Keep the Ball Tight","保持球貼牆"],["Create Space","創造空間"],["Take the Ball Early","提前截擊"],["Vary the Pace","改變節奏"],["Recognise Attacking Opportunities","識別進攻機會"],["Turn Defence into Attack","防守轉進攻"],["Reduce Unforced Errors","減少無謂失誤"],["Adapt to Your Opponent","根據對手調整"]]}];const $=id=>document.getElementById(id);groups.forEach((g,i)=>{let o=document.createElement('option');o.value=i;o.textContent=g.name;$('topic').append(o)});let all=groups.flatMap((g,i)=>g.items.map((a,j)=>({en:a[0],zh:a[1],cat:g.name,id:i+'-'+j}))),questions=[],index=0,results=[],wrongIds=[];const shuffle=a=>a.slice().sort(()=>Math.random()-.5);function speak(s){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.83;let v=speechSynthesis.getVoices().find(v=>v.lang==='en-GB');if(v)u.voice=v;speechSynthesis.speak(u)}function begin(wrong=false){let pool=wrong?all.filter(x=>wrongIds.includes(x.id)):all.filter(x=>$('topic').value==='-1'||groups[+$('topic').value].name===x.cat);pool=pool.filter((x,i,a)=>a.findIndex(y=>y.en===x.en&&y.zh===x.zh)===i);if(pool.length<10){alert('此範圍不足10題，請選擇其他主題或累積更多錯題');return}questions=shuffle(pool).slice(0,10);index=0;results=[];$('result').classList.add('hide');$('quiz').classList.remove('hide');render()}function render(){let q=questions[index],mode=$('mode').value;let isListening=mode==='listen'||mode==='mixed'&&index%2===0;$('progress').textContent='第 '+(index+1)+' / 10 題 · '+q.cat;$('question').textContent=isListening?'請聽英文，選出正確中文意思：':'「'+q.zh+'」的英文是？';$('speak').classList.toggle('hide',!isListening);$('speak').onclick=()=>speak(q.en);$('feedback').textContent='';$('next').classList.add('hide');let distract=shuffle(all.filter(x=>x.id!==q.id&&(isListening?x.zh!==q.zh:x.en!==q.en))).slice(0,3);let opts=shuffle([q,...distract]);$('answers').replaceChildren();opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=isListening?o.zh:o.en;b.onclick=()=>{let ok=o.id===q.id;results.push({question:q,correct:ok,selected:isListening?o.zh:o.en});if(!ok&&!wrongIds.includes(q.id))wrongIds.push(q.id);if(ok)wrongIds=wrongIds.filter(id=>id!==q.id);document.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');$('feedback').textContent=(ok?'答對！':'答錯。')+' 正解：'+q.en+' — '+q.zh;$('next').classList.remove('hide')};$('answers').append(b)})}function finish(){let n=results.filter(x=>x.correct).length,record={date:new Date().toLocaleString('zh-TW'),student:$('student').value||'學員',topic:$('topic').selectedOptions[0].textContent,score:n,items:results};let history=JSON.parse(localStorage.getItem('squash_history_v1')||'[]');history.unshift(record);localStorage.setItem('squash_history_v1',JSON.stringify(history.slice(0,100)));localStorage.setItem('squash_wrong_v1',JSON.stringify(wrongIds));window.lastRecord=record;$('quiz').classList.add('hide');$('result').classList.remove('hide');$('score').textContent=n+'/10 · '+n*10+' 分';$('details').replaceChildren();results.forEach((r,i)=>{let p=document.createElement('p');p.textContent=(i+1)+'. '+(r.correct?'✓':'✗')+' '+r.question.en+' — '+r.question.zh;$('details').append(p)});showHistory()}function showHistory(){let h=JSON.parse(localStorage.getItem('squash_history_v1')||'[]');$('history').replaceChildren();if(!h.length)$('history').textContent='尚無紀錄';h.forEach(r=>{let p=document.createElement('p');p.textContent=r.date+'｜'+r.student+'｜'+r.topic+'｜'+r.score+'/10';$('history').append(p)})}$('start').onclick=()=>begin();$('review').onclick=()=>begin(true);$('next').onclick=()=>{index++;index<10?render():finish()};$('email').onclick=()=>{let r=window.lastRecord;if(!r)return;let body='學員：'+r.student+'\n日期：'+r.date+'\n主題：'+r.topic+'\n成績：'+r.score+'/10\n\n'+r.items.map((x,i)=>(i+1)+'. '+(x.correct?'正確':'錯誤')+' '+x.question.en+' / '+x.question.zh+'（作答：'+x.selected+'）').join('\n');location.href='mailto:?subject='+encodeURIComponent('東東壁球英文學習報告｜'+r.student)+'&body='+encodeURIComponent(body)};$('csv').onclick=()=>{let r=window.lastRecord;if(!r)return;let rows=[['date','student','topic','score','english','chinese','correct','selected'],...r.items.map(x=>[r.date,r.student,r.topic,r.score,x.question.en,x.question.zh,x.correct,x.selected])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='squash-result.csv';a.click();URL.revokeObjectURL(a.href)};$('clear').onclick=()=>{if(confirm('確定刪除本機所有成績與錯題紀錄？')){localStorage.removeItem('squash_history_v1');localStorage.removeItem('squash_wrong_v1');wrongIds=[];showHistory()}};try{wrongIds=JSON.parse(localStorage.getItem('squash_wrong_v1')||'[]')}catch{}showHistory();
// 分類學習：逐項顯示英文、中文並可播放發音
groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g.name;$('studyTopic').append(o)});
function renderStudy(){
 const chosen=$('studyTopic').value,term=$('studySearch').value.trim().toLowerCase();
 const items=all.filter(x=>(chosen==='-1'||groups[+chosen].name===x.cat)&&(!term||(x.en+' '+x.zh+' '+x.cat).toLowerCase().includes(term)));
 $('studyCount').textContent='共 '+items.length+' 個詞條｜每個詞條均提供中英對照與語音播放';
 $('studyList').replaceChildren();
 items.forEach(x=>{
  const card=document.createElement('article');card.className='study-item';
  const meta=document.createElement('div');meta.className='study-meta';meta.textContent=x.cat;
  const en=document.createElement('div');en.className='study-en';en.textContent=x.en;
  const zh=document.createElement('div');zh.className='study-zh';zh.textContent=x.zh;
  const btn=document.createElement('button');btn.type='button';btn.textContent='🔊 聽英文發音';btn.onclick=()=>speak(x.en);
  card.append(meta,en,zh,btn);$('studyList').append(card);
 });
