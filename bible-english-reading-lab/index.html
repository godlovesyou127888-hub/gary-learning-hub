<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="雙語聖經閱讀｜短經文、關鍵字、理解題與中英對照。"><title>Bible English Reading Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafbf7;color:#2f382c;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#516475;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#516475;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#edf0e8!important;color:#44503d!important}.card{background:#fff;border:1px solid #e1e6dc;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1ea;color:#4f5d46;font-size:13px;font-weight:800}.hidden{display:none}.output{white-space:pre-wrap;background:#f4f6f1;border-radius:10px;padding:14px}.story{font-size:21px}.verse{font-size:28px;font-weight:900;line-height:1.4}.zh{font-size:23px;font-weight:800}.quiz label{display:block;border:1px solid #dde5d8;border-radius:9px;padding:9px;margin:7px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #c8d2c2;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.muted{color:#667162;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}.verse{font-size:24px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Bible%20English%20Reading%20Lab%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Bible English Reading Lab</h1><p>雙語聖經閱讀｜短經文、關鍵字、理解題與中英對照。</p></div></header><main><section class="card"><h2>選擇閱讀</h2><select id="passage"></select></section>
<section class="card"><span class="tag" id="ref"></span><div id="en" class="verse"></div><div id="zh" class="zh"></div><div class="actions"><button id="speak">慢速聽英文</button></div></section>
<section class="card"><h2>Reading Check</h2><div id="quiz" class="quiz"></div><button id="submit">交卷</button></section>
<section id="result" class="card hidden"><h2>結果</h2><div id="score" class="output"></div><div id="review"></div></section></main><script>const passages=[
{ref:"Psalm 23:1",en:"The LORD is my shepherd; I shall not want.",zh:"耶和華是我的牧者，我必不致缺乏。",qs:[["Who is described as the shepherd?",["The LORD","David","A king","A traveler"],0],["What is the main idea?",["Trust in God's care","Travel quickly","Become rich","Avoid people"],0],["What does shepherd mean here?",["One who cares and guides","A soldier","A merchant","A judge"],0]]},
{ref:"Matthew 5:9",en:"Blessed are the peacemakers: for they shall be called the children of God.",zh:"使人和睦的人有福了！因為他們必稱為神的兒子。",qs:[["Who are called blessed?",["Peacemakers","Fighters","Travelers","Teachers"],0],["What is a peacemaker?",["Someone who helps build peace","Someone who wins arguments","Someone who stays silent always","Someone who avoids everyone"],0],["What value is emphasized?",["Peace","Speed","Money","Competition"],0]]},
{ref:"1 Thessalonians 5:18",en:"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.",zh:"凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。",qs:[["What action is emphasized?",["Give thanks","Give money","Travel","Study"],0],["When should thanks be practiced?",["In every thing","Only on holidays","Only when happy","Only at church"],0],["What value is central?",["Gratitude","Fear","Competition","Silence"],0]]}
];const $=x=>document.getElementById(x);let i=0;function render(){const p=passages[i];$("passage").innerHTML=passages.map((x,j)=>'<option value='+j+' '+(i===j?'selected':'')+'>'+x.ref+'</option>').join("");$("ref").textContent=p.ref;$("en").textContent=p.en;$("zh").textContent=p.zh;$("quiz").innerHTML=p.qs.map((q,k)=>'<p><b>Q'+(k+1)+'. '+q[0]+'</b></p>'+q[1].map((o,j)=>'<label><input type=radio name=q'+k+' value='+j+'> '+o+'</label>').join("")).join("");$("result").classList.add("hidden")}$("passage").onchange=()=>{i=+$("passage").value;render()};$("speak").onclick=()=>{const u=new SpeechSynthesisUtterance(passages[i].en);u.lang="en-US";u.rate=.68;speechSynthesis.cancel();speechSynthesis.speak(u)};$("submit").onclick=()=>{const p=passages[i];let s=0,rows=[];p.qs.forEach((q,k)=>{const el=document.querySelector('[name=q'+k+']:checked'),v=el?+el.value:-1,ok=v===q[2];if(ok)s++;rows.push({q:q[0],ok,answer:q[1][q[2]]})});$("score").textContent="分數："+s+"/"+p.qs.length;$("review").innerHTML=rows.map(x=>'<p class="'+(x.ok?'good':'bad')+'">'+(x.ok?'✓ ':'✗ ')+x.q+'｜正解：'+x.answer+'</p>').join("");$("result").classList.remove("hidden")};render();</script></body></html>
