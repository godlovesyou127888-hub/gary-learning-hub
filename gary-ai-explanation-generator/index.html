<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把答案轉成可教、可懂、可訂正的中英詳解。"><title>Gary AI 詳解生成器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#496b7d;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#496b7d;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20AI%20%E8%A9%B3%E8%A7%A3%E7%94%9F%E6%88%90%E5%99%A8%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary AI 詳解生成器</h1><p>把答案轉成可教、可懂、可訂正的中英詳解。</p></div></header><main><section class="card"><h2>輸入題目</h2><div class="grid"><label>題目<textarea id="q">She ___ to school every day.</textarea></label><label>正確答案<input id="a" value="goes"></label></div><label>學生答案<input id="student" value="go"></label><label>知識點<select id="type"><option>文法 Grammar</option><option>單字 Vocabulary</option><option>閱讀 Reading</option><option>數學英文 Math English</option></select></label><button id="generate">生成中英詳解</button><p class="muted">MVP 使用本機規則模板生成，不宣稱已接外部 AI。</p></section><section class="card"><h2>詳解草稿</h2><div id="out" class="output"></div><div class="actions"><button id="copy">複製</button><button id="download" class="secondary">下載 TXT</button></div></section></main><script>const $=x=>document.getElementById(x);function gen(){const q=$("q").value,a=$("a").value,s=$("student").value,t=$("type").value;let rule=t.includes("文法")?"先找主詞、時間線索與句型規則，再決定正確形式。":t.includes("單字")?"先確認字義、詞性與上下文搭配，不只背中文意思。":t.includes("閱讀")?"先回原文定位證據，再排除不符合文本的選項。":"先把英文數學詞彙轉成數學概念，再處理計算。";$("out").textContent="【題目 Question】\n"+q+"\n\n【學生答案 Student Answer】\n"+s+"\n\n【正確答案 Correct Answer】\n"+a+"\n\n【English Explanation】\nThe correct answer is “"+a+"”. Identify the key rule or clue in the question, then apply it consistently.\n\n【中文詳解】\n正確答案是「"+a+"」。"+rule+"\n\n【訂正策略】\n1. 說出判斷線索。\n2. 解釋為什麼正解成立。\n3. 說出學生答案為什麼不成立。\n4. 24–48 小時後重做同類題。"}$("generate").onclick=gen;$("copy").onclick=()=>navigator.clipboard.writeText($("out").textContent);$("download").onclick=()=>{const b=new Blob([$(
"out").textContent],{type:"text/plain"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="gary-ai-explanation.txt";a.click();URL.revokeObjectURL(u)};gen();</script></body></html>
