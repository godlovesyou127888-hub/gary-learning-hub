<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="12週進度與成果紀錄：每週任務、完成勾選、反思與成果追蹤。"><title>樂齡英文12週學習護照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#4f6d5a;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#668b72;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><nav aria-label="樂齡學習網站導覽" style="background:#e8f5ec;color:#163e30;border-bottom:2px solid #b7d7c2;padding:12px 16px;font:700 19px/1.6 system-ui,'Noto Sans TC',sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a href="/senior-learning-center/" style="display:inline-block;background:#246b4f;color:#fff;padding:10px 16px;min-height:50px;border-radius:10px;text-decoration:none">← 返回樂齡學習總站</a><a href="/" style="display:inline-block;background:#fff;color:#245c46;border:2px solid #9fcbb1;padding:8px 14px;min-height:50px;border-radius:10px;text-decoration:none">Gary Learning Hub</a></nav><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E8%8B%B1%E6%96%8712%E9%80%B1%E5%AD%B8%E7%BF%92%E8%AD%B7%E7%85%A7%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡英文12週學習護照</h1><p>12 週學習護照｜看得到自己每週完成了什麼。</p></div></header><main>
<section class="card"><h2>12 週進度</h2><div id="weeks"></div></section>
<section class="card"><h2>本週反思</h2><label>這週我最會的一句英文<textarea id="best"></textarea></label><label>下週我要加強<textarea id="next"></textarea></label><button id="save">保存反思</button><div class="actions" style="margin-top:12px"><button id="download">下載護照 JSON</button><button onclick="print()" class="secondary">列印／PDF</button></div></section>
<script>
const goals=["打招呼與自我介紹","每日5字","每日一句","旅遊生存英文","機場英文","飯店英文","餐廳英文","購物英文","醫療英文","交通英文","電話英文","成果發表"];const $=x=>document.getElementById(x);let state=JSON.parse(localStorage.getItem("senior-passport-v1")||'{"done":[],"notes":{}}');
function render(){ $("weeks").innerHTML=goals.map((g,i)=>'<div class="phrase"><label><input type=checkbox '+(state.done.includes(i)?'checked':'')+' onchange="toggle('+i+',this.checked)"> <b>Week '+(i+1)+'</b>｜'+g+'</label></div>').join("")}
window.toggle=(i,v)=>{state.done=state.done.filter(x=>x!==i);if(v)state.done.push(i);localStorage.setItem("senior-passport-v1",JSON.stringify(state))};
$("save").onclick=()=>{state.notes[new Date().toISOString().slice(0,10)]={best:$("best").value,next:$("next").value};localStorage.setItem("senior-passport-v1",JSON.stringify(state));alert("已保存本週反思。")};$("download").onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="senior-english-12-week-passport.json";a.click();URL.revokeObjectURL(u)};render();
</script></main></body></html>
