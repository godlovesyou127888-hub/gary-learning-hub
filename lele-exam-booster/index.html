<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="樂樂 Exam Booster：考前衝刺複習，混合單字、文法、閱讀與句型，快速找出最後20%弱點並完成錯題回補。">
<title>樂樂 Exam Booster</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7f3;color:#3b302c;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#8f4e3c;color:white;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#b05f46;color:white;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#f4e5df!important;color:#7a4032!important}.card{background:#fff;border:1px solid #edd9d0;border-radius:16px;padding:20px;margin:16px 0}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.08em;color:#9a7264}.hidden{display:none}.q{padding:16px 0;border-top:1px solid #f0dfd8}.q:first-child{border-top:0}.q label{display:block;padding:8px 10px;border:1px solid #ead8d1;border-radius:9px;margin:7px 0;font-weight:400}.q input{width:auto;margin-right:8px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f4e7e2;color:#7c4739;font-size:13px;font-weight:800;margin:2px}.feedback{white-space:pre-line;background:#fbefea;padding:12px;border-radius:9px;margin-top:10px}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric div{background:#fff9f6;border:1px solid #efddd5;border-radius:12px;padding:14px;text-align:center}.metric b{display:block;font-size:25px}.good{color:#047857}.bad{color:#b42318}.priority{padding:12px;border-left:5px solid #b05f46;background:#fff1eb;border-radius:10px}.passage{background:#fff9f6;border-left:5px solid #cf8a75;padding:12px;border-radius:10px;margin:10px 0}input[type=text],input[type=email],input[type=date]{width:100%;padding:10px;border:1px solid #d1b9b0;border-radius:9px;font:inherit}.muted{color:#776761;font-size:14px}@media(max-width:700px){.metric{grid-template-columns:1fr 1fr}.card{padding:14px}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}
</style>
</head>
<body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E6%A8%82%20Exam%20Booster%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank" rel="noopener">聯絡站長</a></div><h1>樂樂 Exam Booster</h1><p>考前衝刺｜不再平均複習全部內容，而是快速找出最後最值得補的 20%。</p></div></header>
<main>
<section class="card"><p class="eyebrow">01 · SETUP</p><h2>設定這次考試</h2><label>考試名稱<input id="examName" type="text" placeholder="例如：第三、四單元月考"></label><label>考試日期<input id="examDate" type="date"></label><div class="actions" style="margin-top:14px"><button id="start">開始 20 題考前診斷</button><button id="retry" class="secondary">只重練錯題</button></div><p id="startStatus">先設定考試，再開始衝刺。</p></section>

<section id="quizCard" class="card hidden"><p class="eyebrow">02 · BOOST</p><h2>20 題考前混合題</h2><div id="quiz"></div><button id="submit">交卷並產生最後衝刺重點</button><p id="submitStatus"></p></section>

<section id="resultCard" class="card hidden"><p class="eyebrow">03 · FINAL 20%</p><h2>最後衝刺診斷</h2><div class="metric"><div><b id="score">0/20</b>分數</div><div><b id="accuracy">0%</b>正確率</div><div><b id="weakArea">—</b>最弱項目</div><div><b id="wrongN">0</b>錯題</div></div><div id="priorityPlan" class="priority"></div><div id="areaSummary"></div><div id="review"></div></section>

<section id="deliveryCard" class="card hidden"><p class="eyebrow">04 · SAVE & COACH</p><h2>保存／交付</h2><label>姓名<input id="student" type="text" value="樂樂"></label><label>Email（選填）<input id="email" type="email"></label><div class="actions" style="margin-top:14px"><button id="download">下載 JSON</button><button id="print" class="secondary">列印／另存 PDF</button><button id="coach">寄給 Gary 教練（Gmail 草稿）</button></div><p class="muted">建議先完成錯題重練，再做一次新的 20 題診斷確認是否穩定。</p><p id="deliveryStatus"></p></section>

<section class="card"><p class="eyebrow">05 · HISTORY</p><h2>最近考前紀錄</h2><div id="history">尚無紀錄。</div></section>
</main>
<script>
const bank=[
{a:"Vocabulary",q:"Choose the best word: Please ___ for tomorrow's test.",o:["prepare","borrow","invite","arrive"],c:0,en:"Prepare means to get ready.",zh:"prepare 表示「準備」。"},
{a:"Vocabulary",q:"Which word means '重要的'?",o:["important","different","special","future"],c:0,en:"Important means having great value or meaning.",zh:"important 就是「重要的」。"},
{a:"Vocabulary",q:"What does 'remember' mean?",o:["忘記","記得","比較","改善"],c:1,en:"Remember means to keep something in your mind.",zh:"remember 表示「記得」。"},
{a:"Vocabulary",q:"Choose the best word: This is a useful learning ___.",o:["resource","mistake","answer","problem"],c:0,en:"Resource means something useful for learning or work.",zh:"resource 表示可利用的「資源」。"},
{a:"Vocabulary",q:"Which word is closest to 'fast'?",o:["quick","quiet","heavy","late"],c:0,en:"Quick and fast are close in meaning.",zh:"quick 與 fast 意思接近。"},
{a:"Vocabulary",q:"What does 'improve' mean?",o:["改善","停止","忘記","完成"],c:0,en:"Improve means to make something better.",zh:"improve 表示改善、進步。"},

{a:"Grammar",q:"She ___ to school every day.",o:["go","goes","went","going"],c:1,en:"Third-person singular takes verb + s.",zh:"She 是第三人稱單數，現在式動詞加 s。"},
{a:"Grammar",q:"They ___ playing basketball now.",o:["is","are","am","be"],c:1,en:"Plural subject They takes are.",zh:"They 是複數主詞，搭配 are。"},
{a:"Grammar",q:"We ___ TV last night.",o:["watch","watched","watches","watching"],c:1,en:"Last night signals the simple past.",zh:"last night 表示過去式，所以用 watched。"},
{a:"Grammar",q:"___ he like music?",o:["Do","Does","Is","Are"],c:1,en:"Use Does for third-person singular questions.",zh:"第三人稱單數 he 的問句使用 Does。"},
{a:"Grammar",q:"There ___ three books on the desk.",o:["is","are","am","be"],c:1,en:"Plural noun phrase takes There are.",zh:"three books 是複數，所以用 There are。"},
{a:"Grammar",q:"樂樂 can ___ English well.",o:["speaks","speak","spoke","speaking"],c:1,en:"After can, use the base verb.",zh:"can 後面接原形動詞 speak。"},

{a:"Sentence",q:"Choose the correct sentence.",o:["He don't like math.","He doesn't like math.","He doesn't likes math.","He not likes math."],c:1,en:"After doesn't, use the base verb.",zh:"doesn't 後面接原形動詞 like。"},
{a:"Sentence",q:"Choose the correct sentence.",o:["I am thirteen years old.","I have thirteen years old.","I is thirteen years old.","I thirteen years old."],c:0,en:"Age is expressed with be + years old.",zh:"英文表達年齡使用 be 動詞 + years old。"},
{a:"Sentence",q:"Choose the best question for 'I go to school by bus.'",o:["How do you go to school?","Where do you live?","When is lunch?","Why are you late?"],c:0,en:"Ask How for a method of transportation.",zh:"交通方式用 How 提問。"},
{a:"Sentence",q:"Choose the correct sentence.",o:["She is good at drawing.","She good at drawing.","She is good in draw.","She good drawing."],c:0,en:"The fixed pattern is be good at + V-ing.",zh:"固定句型是 be good at + V-ing。"},
{a:"Sentence",q:"Choose the best word order.",o:["I usually do homework after dinner.","I do usually homework after dinner.","Usually I homework do after dinner.","I homework usually after dinner do."],c:0,en:"Frequency adverbs usually come before the main verb.",zh:"頻率副詞 usually 通常放在一般動詞前。"},
{a:"Sentence",q:"Choose the correct sentence.",o:["My brother has a bike.","My brother have a bike.","My brother is have a bike.","My brother having a bike."],c:0,en:"Third-person singular brother takes has.",zh:"My brother 是第三人稱單數，所以用 has。"},

{a:"Reading",p:"樂樂 wanted to get better at English, so he made a simple plan. On Monday and Wednesday, he reviewed vocabulary for fifteen minutes. On Tuesday and Thursday, he practiced grammar. On Friday, he read a short English story. After three weeks, he noticed that he could answer questions faster and remembered more words.",q:"Why did 樂樂 make a plan?",o:["To improve his English","To stop studying","To join a sports team","To buy a new book"],c:0,en:"He made the plan because he wanted to get better at English.",zh:"他想提升英文，所以做了學習計畫。"},
{a:"Reading",p:"樂樂 wanted to get better at English, so he made a simple plan. On Monday and Wednesday, he reviewed vocabulary for fifteen minutes. On Tuesday and Thursday, he practiced grammar. On Friday, he read a short English story. After three weeks, he noticed that he could answer questions faster and remembered more words.",q:"What did he do on Friday?",o:["Reviewed vocabulary","Practiced grammar","Read a short English story","Took a test"],c:2,en:"The passage says he read a short English story on Friday.",zh:"原文明確指出星期五閱讀一篇短英文故事。"},
{a:"Reading",p:"樂樂 wanted to get better at English, so he made a simple plan. On Monday and Wednesday, he reviewed vocabulary for fifteen minutes. On Tuesday and Thursday, he practiced grammar. On Friday, he read a short English story. After three weeks, he noticed that he could answer questions faster and remembered more words.",q:"What changed after three weeks?",o:["He answered faster and remembered more words.","He stopped studying.","He forgot all the words.","He studied only once a week."],c:0,en:"The final sentence reports faster answering and better vocabulary recall.",zh:"三週後，他答題更快，也記得更多單字。"},
{a:"Reading",p:"Before a school test, 樂樂 used to study everything the night before. This time, he started five days earlier. Each day, he reviewed one small part and marked the questions he got wrong. On the final day, he studied only those mistakes. He felt less nervous and finished the test with more confidence.",q:"What did 樂樂 do differently this time?",o:["Started studying five days earlier","Studied only at night","Skipped the test","Reviewed nothing"],c:0,en:"He began preparing five days earlier instead of the night before.",zh:"這次他提前五天開始準備。"},
{a:"Reading",p:"Before a school test, 樂樂 used to study everything the night before. This time, he started five days earlier. Each day, he reviewed one small part and marked the questions he got wrong. On the final day, he studied only those mistakes. He felt less nervous and finished the test with more confidence.",q:"What did he study on the final day?",o:["Only his mistakes","Every chapter again","Only vocabulary","Nothing"],c:0,en:"He focused only on the questions he had gotten wrong.",zh:"最後一天只複習先前的錯題。"},
{a:"Reading",p:"Before a school test, 樂樂 used to study everything the night before. This time, he started five days earlier. Each day, he reviewed one small part and marked the questions he got wrong. On the final day, he studied only those mistakes. He felt less nervous and finished the test with more confidence.",q:"What is the main lesson?",o:["Spaced review and mistake focus can reduce stress.","Studying later is always better.","Mistakes should be ignored.","One-night study is enough."],c:0,en:"The passage shows that earlier, focused review improved confidence.",zh:"文章重點是提早分散複習並聚焦錯題能降低壓力、提升信心。"}
];
const $=id=>document.getElementById(id);let current=[],results=[],wrong=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){return shuffle(bank).slice(0,20)}
function render(items){current=items;results=[];$("quiz").replaceChildren();let lastPassage="";items.forEach((q,i)=>{const d=document.createElement("div");d.className="q";let h='<span class="tag">'+q.a+'</span>';if(q.p&&q.p!==lastPassage){h+='<div class="passage">'+q.p+'</div>';lastPassage=q.p}h+='<p><b>Q'+(i+1)+'. '+q.q+'</b></p>';q.o.forEach((x,j)=>h+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+x+'</label>');d.innerHTML=h;$("quiz").append(d)});$("quizCard").classList.remove("hidden");$("resultCard").classList.add("hidden");$("deliveryCard").classList.add("hidden");$("submitStatus").textContent=""}
$("start").onclick=()=>{render(build());$("startStatus").textContent="已建立 20 題考前診斷。"};
$("retry").onclick=()=>{if(!wrong.length){$("startStatus").textContent="目前沒有上一回錯題可重練。";return}render(wrong.map(x=>x.q));$("startStatus").textContent="已載入上一回錯題。"};
$("submit").onclick=()=>{const missing=current.filter((q,i)=>!document.querySelector('input[name="q'+i+'"]:checked')).length;if(missing){$("submitStatus").textContent="還有 "+missing+" 題未作答。";return}let score=0;const by={};results=current.map((q,i)=>{if(!by[q.a])by[q.a]={c:0,t:0};by[q.a].t++;const selected=Number(document.querySelector('input[name="q'+i+'"]:checked').value),ok=selected===q.c;if(ok){score++;by[q.a].c++}return{q,selected,ok}});wrong=results.filter(x=>!x.ok);const weak=Object.keys(by).sort((a,b)=>(by[a].c/by[a].t)-(by[b].c/by[b].t))[0]||"無明顯弱點";$("score").textContent=score+"/"+current.length;$("accuracy").textContent=Math.round(score/current.length*100)+"%";$("weakArea").textContent=weak;$("wrongN").textContent=wrong.length;const plan=score/current.length>=.9?"最後20%策略：只重做錯題與最弱類型，不再全面重讀。":score/current.length>=.75?"最後20%策略：先重練所有錯題，再集中補 "+weak+"，最後做一回新的 20 題。":"最後20%策略：先穩定 "+weak+"，再重做錯題；暫時不要增加新題型。";$("priorityPlan").innerHTML="<b>"+plan+"</b>";$("areaSummary").innerHTML='<h3>四類表現</h3>'+Object.entries(by).map(([a,x])=>'<span class="tag">'+a+' '+x.c+'/'+x.t+'</span>').join("");$("review").replaceChildren();results.forEach((r,i)=>{const q=r.q,d=document.createElement("div");d.className="q";d.innerHTML='<h3 class="'+(r.ok?'good':'bad')+'">Q'+(i+1)+' '+(r.ok?'✓ Correct':'✗ Review')+'</h3><p><span class="tag">'+q.a+'</span> <b>'+q.q+'</b></p><p>你的答案：'+q.o[r.selected]+'<br>正確答案：'+q.o[q.c]+'</p><div class="feedback"><b>English explanation</b>\n'+q.en+'\n\n<b>中文詳解</b>\n'+q.zh+'</div>';$("review").append(d)});$("resultCard").classList.remove("hidden");$("deliveryCard").classList.remove("hidden");save(score,weak);$("resultCard").scrollIntoView({behavior:"smooth"})};
function snapshot(){const score=results.filter(x=>x.ok).length;return{site:"樂樂 Exam Booster",version:"MVP V1",date:new Date().toISOString(),student:$("student").value.trim()||"樂樂",email:$("email").value.trim(),exam_name:$("examName").value.trim(),exam_date:$("examDate").value,score,total:current.length,accuracy:current.length?Math.round(score/current.length*100):0,items:results.map((r,i)=>({no:i+1,area:r.q.a,question:r.q.q,chosen:r.q.o[r.selected],answer:r.q.o[r.q.c],correct:r.ok,explanation_en:r.q.en,explanation_zh:r.q.zh}))}}
function save(score,weak){const key="lele-exam-booster-history-v1",arr=JSON.parse(localStorage.getItem(key)||"[]");arr.unshift({date:new Date().toISOString(),exam:$("examName").value.trim(),score,total:current.length,weak});localStorage.setItem(key,JSON.stringify(arr.slice(0,12)));showHistory()}
function showHistory(){const arr=JSON.parse(localStorage.getItem("lele-exam-booster-history-v1")||"[]");$("history").innerHTML=arr.length?arr.map(x=>'<p>'+new Date(x.date).toLocaleString()+'｜'+(x.exam||"未命名考試")+'｜'+x.score+'/'+x.total+'｜優先：'+x.weak+'</p>').join(""):"尚無紀錄。"}
function report(){const d=snapshot();return "樂樂 Exam Booster\n學員："+d.student+"\nEmail："+d.email+"\n考試："+d.exam_name+"\n考試日期："+d.exam_date+"\n分數："+d.score+"/"+d.total+"（"+d.accuracy+"%）\n\n"+d.items.map(x=>x.no+". ["+x.area+"] "+x.question+"\n你的答案："+x.chosen+"\n正解："+x.answer+"｜"+(x.correct?"正確":"錯誤")).join("\n\n")}
$("download").onclick=()=>{const b=new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="lele-exam-booster-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$("deliveryStatus").textContent="已下載 JSON 備份。"};
$("print").onclick=()=>window.print();
$("coach").onclick=()=>{const d=snapshot(),subject="樂樂 Exam Booster｜"+d.student+"｜"+d.score+"/"+d.total;window.open("https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su="+encodeURIComponent(subject)+"&body="+encodeURIComponent(report()),"_blank","noopener,noreferrer");$("deliveryStatus").textContent="已嘗試開啟 Gmail 草稿，請確認後手動傳送。"};
showHistory();
</script>
</body></html>
