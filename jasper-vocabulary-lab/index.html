<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jasper Vocabulary Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f6f5;color:#193a42;font:18px/1.6 system-ui,"Noto Sans TC",sans-serif}header{background:#174b54;color:white;padding:20px}main,.wrap{max-width:900px;margin:auto}main{padding:15px}.card{background:white;border:1px solid #ccdcdf;border-radius:15px;padding:20px;margin:16px 0}button,.btn{border:0;border-radius:9px;padding:11px 14px;background:#126777;color:white;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none}button.secondary,.btn.secondary{background:#e0eff0;color:#174b54}.actions{display:flex;flex-wrap:wrap;gap:10px}.muted{color:#586d72}.hidden{display:none}input,select{font:inherit;padding:10px;width:100%;border:1px solid #a7b9c1;border-radius:8px}label{display:block;font-weight:bold;margin:10px 0 5px}.word{font-size:32px;font-weight:bold}#options label{padding:9px;border:1px solid #d4e0e4;border-radius:8px;font-weight:normal}input[type=radio]{width:auto}#feedback{white-space:pre-wrap;background:#edf7f6;padding:12px;border-radius:8px}@media(max-width:600px){.card{padding:14px}button{width:100%}}@media print{header .actions,.actions{display:none}}</style></head><body><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Jasper%20Vocabulary%20Lab%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank" rel="noopener">聯絡站長</a></div><h1>Jasper Vocabulary Lab</h1><p>單字與拼字訓練｜20 個原創例句｜V1 測試版</p></div></header><main><section class="card"><h2>學習與測驗</h2><p class="muted">每輪隨機抽取 10 個單字。完成後顯示逐題答案、例句與學習建議。</p><div class="actions"><button id="study">單字學習</button><button id="quizBtn">開始 10 題測驗</button><button id="restart" class="secondary">重新開始</button></div><p id="status" role="status" aria-live="polite">請選擇學習或測驗。</p></section><section id="studyCard" class="card hidden"><h2>字卡</h2><div id="wordCard"></div><div class="actions"><button id="prev" class="secondary">上一個</button><button id="next">下一個</button></div></section><section id="quizCard" class="card hidden"><h2 id="progress">第 1 題</h2><p class="word" id="question"></p><div id="options"></div><button id="answer">確認答案</button><p id="feedback" role="status" aria-live="polite"></p><button id="continue" class="hidden">下一題</button></section><section id="resultCard" class="card hidden"><h2>學習成果</h2><p id="result"></p><div id="review"></div><label for="learner">姓名</label><input id="learner" value="Jasper"><label for="learnerEmail">Email（選填）</label><input id="learnerEmail" type="email"><div class="actions" style="margin-top:12px"><button id="coach">寄給 Gary 教練（Gmail 草稿）</button><button id="copy" class="secondary">複製報告</button><button id="download" class="secondary">下載 JSON</button><button id="print" class="secondary">列印 PDF</button></div><p class="muted">Gmail 草稿不代表已寄出，請手動按「傳送」。本測驗不會自動上傳資料。</p><p id="sendStatus" role="status" aria-live="polite"></p></section></main><script>
const words=[["achieve","達成","She hopes to achieve her goal."],["adapt","適應","We adapt to new situations."],["benefit","益處","Reading has many benefits."],["compare","比較","Compare the two answers."],["consider","考慮","Please consider another option."],["develop","發展","Students develop new skills."],["efficient","有效率的","This method is efficient."],["evidence","證據","Find evidence in the text."],["improve","改善","Practice can improve accuracy."],["include","包含","The list includes ten words."],["maintain","維持","Maintain a daily routine."],["method","方法","Choose a useful method."],["opportunity","機會","This is a good opportunity."],["predict","預測","Can you predict the result?"],["prepare","準備","Prepare for tomorrow's test."],["process","過程","Learning is a gradual process."],["require","需要","The task requires attention."],["resource","資源","The library offers resources."],["specific","具體的","Give a specific example."],["strategy","策略","Use a reading strategy."]];const $=id=>document.getElementById(id);let deck=[],pos=0,score=0,history=[],locked=false,mode="none";function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function hide(){["studyCard","quizCard","resultCard"].forEach(x=>$(x).classList.add("hidden"))}function reset(){deck=[];pos=0;score=0;history=[];locked=false;mode="none";hide();$("status").textContent="請選擇學習或測驗。"}$("restart").onclick=reset;$("study").onclick=()=>{reset();mode="study";deck=words;hide();$("studyCard").classList.remove("hidden");showWord()};function showWord(){$("wordCard").textContent=(pos+1)+"/"+deck.length+"｜"+deck[pos][0]+"｜"+deck[pos][1]+"｜"+deck[pos][2]};$("prev").onclick=()=>{pos=(pos+deck.length-1)%deck.length;showWord()};$("next").onclick=()=>{pos=(pos+1)%deck.length;showWord()};$("quizBtn").onclick=()=>{reset();mode="quiz";deck=shuffle([...words]).slice(0,10);$("quizCard").classList.remove("hidden");renderQ()};function renderQ(){locked=false;$("answer").disabled=false;$("answer").classList.remove("hidden");$("continue").classList.add("hidden");$("feedback").textContent="";const w=deck[pos];$("progress").textContent="第 "+(pos+1)+" / "+deck.length+" 題";$("question").textContent=w[0]+" 的中文意思是？";let opts=shuffle([w[1],...shuffle(words.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[1])]);$("options").replaceChildren();opts.forEach(t=>{const label=document.createElement("label"),radio=document.createElement("input");radio.type="radio";radio.name="choice";radio.value=t;label.append(radio,document.createTextNode(" "+t));$("options").append(label)})};$("answer").onclick=()=>{if(locked)return;const checked=document.querySelector('input[name="choice"]:checked');if(!checked){$("feedback").textContent="請先選一個答案。";return}locked=true;const w=deck[pos],correct=checked.value===w[1];if(correct)score++;history.push({word:w[0],chosen:checked.value,correct:w[1],ok:correct,example:w[2]});$("feedback").textContent=(correct?"正確":"答錯")+"｜正解："+w[1]+"\n例句："+w[2];$("answer").disabled=true;$("continue").textContent=pos===deck.length-1?"查看成績":"下一題";$("continue").classList.remove("hidden")};$("continue").onclick=()=>{if(!locked)return;if(++pos<deck.length)renderQ();else finish()};function finish(){hide();$("resultCard").classList.remove("hidden");$("result").textContent="本次得分："+score+"/"+deck.length+"；建議："+(score>=9?"可以挑戰新單字":score>=6?"優先重練答錯單字":"先複習字卡後再測");$("review").replaceChildren();history.forEach((x,i)=>{const p=document.createElement("p");p.textContent=(i+1)+". "+x.word+"｜"+(x.ok?"正確":"錯誤")+"｜你的答案："+x.chosen+"｜正解："+x.correct+"｜"+x.example;$("review").append(p)});$("status").textContent="完成測驗，請下載備份或寄給教練。"}function report(){return "Jasper Vocabulary Lab\n學員："+$("learner").value.trim()+"\nEmail："+$("learnerEmail").value.trim()+"\n分數："+score+"/"+deck.length+"\n"+history.map((x,i)=>(i+1)+". "+x.word+"｜"+x.chosen+"｜正解："+x.correct+"｜"+(x.ok?"正確":"錯誤")+"｜"+x.example).join("\n")}function backup(){return {version:1,date:new Date().toISOString(),name:$("learner").value,email:$("learnerEmail").value,score,total:deck.length,items:history}}$("coach").onclick=()=>{if(!history.length)return;const subject="Jasper Vocabulary Lab｜"+$("learner").value.trim()+"｜"+score+"/"+deck.length;const link="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su="+encodeURIComponent(subject)+"&body="+encodeURIComponent(report());window.open(link,"_blank","noopener,noreferrer");$("sendStatus").textContent="已嘗試開啟 Gmail，請確認後手動傳送。"};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(report());$("sendStatus").textContent="已複製完整報告。"}catch(e){$("sendStatus").textContent="複製失敗，請用 JSON 備份。"}};$("download").onclick=()=>{const b=new Blob([JSON.stringify(backup(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="jasper-vocabulary-"+new Date().toISOString().slice(0,10)+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("print").onclick=()=>window.print();reset();
</script></body></html>
