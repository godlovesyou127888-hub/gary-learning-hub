<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sylvia IELTS｜Writing 作業寄送</title>
<style>
:root{--p:#5b5bd6;--p2:#7c3aed;--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--line:#e5e7eb;--ok:#067647;--warn:#b54708}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
.wrap{max-width:860px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:24px;margin:10px 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h1{margin:0 0 6px}.muted{color:var(--muted)}input,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}textarea{min-height:260px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.secondary{background:#fff;color:var(--p);border:1px solid #c7c9ff}.success{background:#ecfdf3;color:var(--ok);border:1px solid #abefc6}
.status{padding:12px;border-radius:10px;background:#f5f3ff;margin-top:12px}.hidden{display:none}.error{background:#fff7ed;color:var(--warn)}
</style></head><body>
<main class="wrap">
<section class="hero"><h1>Sylvia IELTS｜Writing 作業寄送</h1><p>IELTS 專用流程：先安全保存，再寄 Email，最後回 IELTS Command Center。</p></section>

<section class="card" id="sendCard">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
<a class="btn secondary" href="/sylvia-ielts-30day/">← 回 Writing Sprint</a>
<a class="btn secondary" href="/sylvia-ielts-command-center/">IELTS Command Center</a>
</div>

<form id="ieltsForm">
<div class="grid">
<label>姓名<input id="nameField" required></label>
<label>Email<input id="emailField" type="email" required></label>
</div>
<label style="display:block;margin-top:12px">Writing 作業內容
<textarea id="messageField" required></textarea></label>
<p><button id="submitBtn" class="btn primary" type="submit">送出 Writing 作業給 Gary</button></p>
</form>

<div id="deliveryStatusBox" class="status">正在載入 IELTS Writing 作業資料…</div>

<form id="emailForm" class="hidden" action="https://formsubmit.co/43c5627bc898e872509ffd1b6aa8d728" method="POST" target="emailSink">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" id="subjectField" name="_subject">
<input type="hidden" id="submissionField" name="submission_id">
<input type="hidden" id="sourceField" name="source_page">
<input type="hidden" name="form_type" value="Sylvia IELTS Writing Submission">
<input type="hidden" id="emailName" name="name">
<input type="hidden" id="emailEmail" name="email">
<textarea id="emailMessage" name="test_message" class="hidden"></textarea>
</form>
<iframe name="emailSink" id="emailSink" class="hidden"></iframe>
</section>

<section class="card hidden" id="completeCard">
<h2>✅ Writing 作業已送出</h2>
<p id="completeSummary"></p>
<div class="status success">
<b>主要保存：</b>已寫入 IELTS 資料庫。<br>
<b>Email：</b><span id="emailState">已送往 Email 通道，實際收件以 Gmail 驗證為準。</span>
</div>
<p style="margin-top:16px"><a class="btn primary" href="/sylvia-ielts-command-center/">回 Sylvia IELTS 首頁</a></p>
<p><button id="retryEmailBtn" class="btn secondary" type="button">重新寄送 Email</button> <a class="btn secondary" href="/sylvia-ielts-30day/">回 Writing Sprint</a></p>
</section>
</main>

<script>
const API='https://tpass-results-api.onrender.com';
let data=null,submitted=false,emailSubmitted=false;
const deliveryStatusBox=document.getElementById('deliveryStatusBox');
try{data=JSON.parse(localStorage.getItem('sylvia_ielts_pending_delivery')||'null')}catch{}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

if(!data){
  deliveryStatusBox.classList.add('error');
  deliveryStatusBox.innerHTML='❌ 找不到待寄送的 IELTS Writing 作業。請回 Writing Sprint 重新按「一鍵送出給 Gary」。';
  submitBtn.disabled=true;
}else{
  const age=data._saved_at?Math.max(0,Math.round((Date.now()-new Date(data._saved_at).getTime())/60000)):null;
  nameField.value=data.student_name||'Sylvia';
  emailField.value=data.student_email||data.email||'';
  messageField.value=data.preformatted_message||'';
  deliveryStatusBox.innerHTML='✅ 已載入 IELTS Writing 作業'
    +(data.submission_id?'<br><b>Submission ID：</b>'+esc(data.submission_id):'')
    +(age!=null?'<br><b>資料建立：</b>'+age+' 分鐘前':'')
    +'<br>送出後會停留在本站完成畫面，並提供「回 Sylvia IELTS 首頁」按鈕。';
  if(age!=null&&age>120){
    submitBtn.disabled=true;
    submitBtn.textContent='資料已超過 120 分鐘，請重新產生';
  }
}

async function storePrimary(timeoutMs=8000){
  const payload={
    submission_id:data.submission_id,
    student_name:nameField.value.trim(),
    student_email:emailField.value.trim(),
    task_type:data.task_type||'',
    day_number:data.day_number||null,
    question:data.question||'',
    essay:data.essay||'',
    word_count:data.word_count||null,
    minutes:data.minutes||null,
    self_checks:Array.isArray(data.self_checks)?data.self_checks:[],
    self_concern:data.self_concern||'',
    source_page:data.source_page||''
  };
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  let res;
  try{
    res=await fetch(API+'/api/ielts-writing-submissions',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
      signal:controller.signal
    });
  }finally{clearTimeout(timer)}
  const out=await res.json().catch(()=>({}));
  if(!res.ok||!out.ok)throw new Error(out.error||('HTTP '+res.status));
  return out;
}

function sendEmailSecondary(){
  emailSubmitted=true;
  emailState.textContent='正在送往 FormSubmit Email 通道…';
  subjectField.value='[Sylvia IELTS][Writing]['+(data.task_type||'Assignment')+'] '+(data.submission_id||'');
  submissionField.value=data.submission_id||'';
  sourceField.value=data.source_page||location.href;
  emailName.value=nameField.value.trim();
  emailEmail.value=emailField.value.trim();
  emailMessage.value=messageField.value.trim();
  emailForm.submit();
}

emailSink.addEventListener('load',async()=>{
  if(!submitted||!emailSubmitted||!data)return;
  emailState.textContent='FormSubmit 已回應；實際收件仍以 Gary Gmail 為準。';
  try{
    await fetch(API+'/api/ielts-writing-submissions/'+encodeURIComponent(data.submission_id)+'/email-status',{
      method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'submitted_to_formsubmit'})
    });
  }catch{}
});

retryEmailBtn.addEventListener('click',()=>{
  if(!data)return;
  retryEmailBtn.disabled=true;
  retryEmailBtn.textContent='重新寄送中…';
  sendEmailSecondary();
  setTimeout(()=>{retryEmailBtn.disabled=false;retryEmailBtn.textContent='重新寄送 Email';},1800);
});

ieltsForm.addEventListener('submit',e=>{
  e.preventDefault();
  if(submitted||!data)return;
  submitted=true;
  submitBtn.disabled=true;
  submitBtn.textContent='正在送出…';

  const outboxRecord={
    ...data,
    student_name:nameField.value.trim(),
    student_email:emailField.value.trim(),
    preformatted_message:messageField.value.trim(),
    queued_at:new Date().toISOString(),
    database_status:'pending',
    email_status:'submitted_to_formsubmit'
  };
  localStorage.setItem('sylvia_ielts_outbox_'+data.submission_id,JSON.stringify(outboxRecord));
  localStorage.setItem('sylvia_ielts_last_submission',JSON.stringify({
    submission_id:data.submission_id,
    queued_at:outboxRecord.queued_at,
    database_status:'pending',
    email_status:'submitted_to_formsubmit'
  }));

  deliveryStatusBox.className='status';
  deliveryStatusBox.innerHTML='Email 正在送出；資料庫同步會在背景進行，不會阻塞本次送出。';

  sendEmailSecondary();

  setTimeout(()=>{
    sendCard.classList.add('hidden');
    completeCard.classList.remove('hidden');
    completeSummary.innerHTML='<b>Submission ID：</b>'+esc(data.submission_id||'—')+
      '<br><b>學生：</b>'+esc(nameField.value.trim())+
      '<br><b>Task：</b>'+esc(data.task_type||'Writing');
  },500);

  storePrimary(8000).then(stored=>{
    const latest=JSON.parse(localStorage.getItem('sylvia_ielts_last_submission')||'{}');
    localStorage.setItem('sylvia_ielts_last_submission',JSON.stringify({...latest,stored_at:stored.stored_at,database_status:'stored'}));
    localStorage.removeItem('sylvia_ielts_outbox_'+data.submission_id);
    if(document.getElementById('completeCard')&&!completeCard.classList.contains('hidden')){
      const box=completeCard.querySelector('.status.success');
      if(box)box.innerHTML='<b>主要保存：</b>已寫入 IELTS 資料庫。<br><b>Email：</b><span id="emailState">'+emailState.textContent+'</span>';
    }
  }).catch(err=>{
    const latest=JSON.parse(localStorage.getItem('sylvia_ielts_last_submission')||'{}');
    localStorage.setItem('sylvia_ielts_last_submission',JSON.stringify({...latest,database_status:'queued_for_retry',database_error:String(err.message||err)}));
    const box=completeCard.querySelector('.status.success');
    if(box)box.innerHTML='<b>主要保存：</b>已保存在本機待補同步；不影響本次 Email 送出。<br><b>Email：</b><span id="emailState">'+emailState.textContent+'</span>';
  });
});

async function retryQueuedSubmission(){
  if(!data||!data.submission_id)return;
  const key='sylvia_ielts_outbox_'+data.submission_id;
  const queued=localStorage.getItem(key);
  if(!queued)return;
  try{
    await storePrimary(5000);
    localStorage.removeItem(key);
  }catch{}
}
retryQueuedSubmission();
</script>
</body></html>
