<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sylvia IELTS｜Writing 作業寄送</title>
<style>
:root{--p:#5b5bd6;--p2:#7c3aed;--bg:#f6f7fb;--text:#1f2937;--muted:#667085;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
.wrap{max-width:860px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:24px;margin:10px 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h1{margin:0 0 6px}.muted{color:var(--muted)}input,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}textarea{min-height:260px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.secondary{background:#fff;color:var(--p);border:1px solid #c7c9ff}.status{padding:12px;border-radius:10px;background:#f5f3ff;margin-top:12px}
</style></head><body>
<main class="wrap">
<section class="hero"><h1>Sylvia IELTS｜Writing 作業寄送</h1><p>IELTS 專用流程：本機先備份，再以原生表單直接寄給 Gary。</p></section>
<section class="card">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
<a class="btn secondary" href="/sylvia-ielts-30day/">← 回 Writing Sprint</a>
<a class="btn secondary" href="/sylvia-ielts-command-center/">IELTS Command Center</a>
</div>

<form id="ieltsForm" action="https://script.google.com/macros/s/AKfycbwenIqOvRJDaFiR6V0uert6-EPkcj9uVELDM5IWUga4_-3BPSVfF1VuLtyktgHDhDzx/exec" method="POST" target="_blank">
<input type="hidden" id="submissionField" name="submission_id">
<input type="hidden" id="taskTypeField" name="task_type">
<input type="hidden" id="questionField" name="question">
<input type="hidden" name="form_type" value="Sylvia IELTS Writing Submission">

<div class="grid">
<label>姓名<input id="nameField" name="student_name" required></label>
<label>Email<input id="emailField" name="student_email" type="email" required></label>
</div>
<label style="display:block;margin-top:12px">Writing 作業內容
<textarea id="messageField" name="essay" required></textarea></label>

<p><button id="submitBtn" class="btn primary" type="submit">送出 Writing 作業給 Gary</button></p>
</form>
<div id="deliveryStatusBox" class="status">正在載入 IELTS Writing 作業資料…</div>
  <div id="afterSubmitActions" style="display:none;margin-top:14px">
    <a class="btn primary" href="/sylvia-ielts-command-center/">回 Sylvia IELTS 首頁</a>
    <button id="retryBtn" class="btn secondary" type="button">再次寄送</button>
  </div>
</section>
</main>

<script>
const byId=id=>document.getElementById(id);
const deliveryStatusBox=byId('deliveryStatusBox');
const submitBtn=byId('submitBtn');
const nameField=byId('nameField');
const emailField=byId('emailField');
const messageField=byId('messageField');
const submissionField=byId('submissionField');
const taskTypeField=byId('taskTypeField');
const questionField=byId('questionField');
const ieltsForm=byId('ieltsForm');
const afterSubmitActions=byId('afterSubmitActions');
const retryBtn=byId('retryBtn');

let data=null;
try{data=JSON.parse(localStorage.getItem('sylvia_ielts_pending_delivery')||'null')}catch{}

if(!data){
  deliveryStatusBox.innerHTML='❌ 找不到待寄送作業。請回 Writing Sprint 重新按「一鍵送出給 Gary」。';
  submitBtn.disabled=true;
}else{
  nameField.value=data.student_name||'Sylvia';
  emailField.value=data.student_email||data.email||'';
  messageField.value=data.preformatted_message||data.essay||'';
    submissionField.value=data.submission_id||'';
  taskTypeField.value=data.task_type||'IELTS Writing';
  questionField.value=data.question||'';
    deliveryStatusBox.innerHTML='✅ 已載入作業'
    +(data.submission_id?'<br><b>Submission ID：</b>'+data.submission_id:'')
    +'<br>按下送出後，將直接交給 Google Apps Script；完成後回到 IELTS 專用完成頁。';
}

ieltsForm.addEventListener('submit',()=>{
  if(!data)return;
  const backup={
    ...data,
    student_name:nameField.value.trim(),
    student_email:emailField.value.trim(),
    preformatted_message:messageField.value.trim(),
    submitted_at:new Date().toISOString(),
    delivery_status:'submitted_unconfirmed'
  };
  localStorage.setItem('sylvia_ielts_last_submission',JSON.stringify(backup));
  localStorage.setItem('sylvia_ielts_backup_'+(data.submission_id||Date.now()),JSON.stringify(backup));
  submitBtn.disabled=true;
  submitBtn.textContent='已開啟 Google Apps Script 寄送頁';
  deliveryStatusBox.textContent='已向 Google Apps Script 提交；尚未確認收件。請在新分頁核對 Submission ID、成功畫面，並以 Gary Gmail 的實際收件為準。';
  afterSubmitActions.style.display='flex';
  afterSubmitActions.style.gap='8px';
  afterSubmitActions.style.flexWrap='wrap';
});

retryBtn.addEventListener('click',()=>{
  submitBtn.disabled=false;
  submitBtn.textContent='送出 Writing 作業給 Gary';
  afterSubmitActions.style.display='none';
  deliveryStatusBox.innerHTML='可再次送出；本機備份仍保留。';
});
</script>
</body></html>
