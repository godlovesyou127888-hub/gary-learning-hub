<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把錯題從「錯了」轉成錯因分類與下一步處方。"><title>Gary AI 錯題分析器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#6d5868;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#6d5868;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20AI%20%E9%8C%AF%E9%A1%8C%E5%88%86%E6%9E%90%E5%99%A8%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary AI 錯題分析器</h1><p>把錯題從「錯了」轉成錯因分類與下一步處方。</p></div></header><main><section class="card"><h2>輸入錯題</h2><label>題目<textarea id="q">He don't like math.</textarea></label><div class="grid"><label>學生答案<input id="s" value="don't"></label><label>正確答案<input id="a" value="doesn't"></label></div><label>學生自述原因<textarea id="reason" placeholder="例如：我以為 he 也可以用 don't"></textarea></label><button id="analyze">分析錯因</button><p class="muted">MVP 依關鍵詞與教學規則分類，不是外部 AI 判讀。</p></section><section class="card"><h2>診斷結果</h2><div id="out" class="output"></div></section></main><script>const $=x=>document.getElementById(x);$("analyze").onclick=()=>{const q=($("q").value+" "+$("s").value+" "+$("reason").value).toLowerCase();let type="規則混淆",rx="先重建規則，再做 3 題同型題。";if(q.includes("don't")||q.includes("doesn't")||q.includes("he ")||q.includes("she ")) {type="第三人稱單數規則";rx="先練 he/she/it + does/doesn't，再做肯定句→否定句→問句轉換。"}else if(q.includes("meaning")||q.includes("word")){type="字義辨識";rx="用例句與搭配重學，不只背中文。"}else if(q.includes("because")||q.includes("evidence")){type="證據定位";rx="每題先圈證據句，再選答案。"}$("out").textContent="【主要錯因】\n"+type+"\n\n【診斷】\n學生答案「"+$("s").value+"」與正解「"+$("a").value+"」之間，顯示目前需要先補核心判斷規則，而不是增加更多題量。\n\n【處方】\n"+rx+"\n\n【完成線】\n同類題連續 3 題正確後，再進下一類。"};</script></body></html>
