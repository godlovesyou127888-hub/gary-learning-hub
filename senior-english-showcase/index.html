<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="作品與錄音展示：學習成果文字、英文句子、瀏覽器錄音與音檔下載。"><title>樂齡英文成果發表站</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#6d5b72;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#88708f;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E8%8B%B1%E6%96%87%E6%88%90%E6%9E%9C%E7%99%BC%E8%A1%A8%E7%AB%99%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡英文成果發表站</h1><p>成果發表｜把「我學過」變成「我做得到、我說得出來」。</p></div></header><main>
<section class="card"><h2>建立我的成果卡</h2><label>姓名<input id="name"></label><label>我最想分享的英文句子<input id="sentence"></label><label>中文意思<input id="zh"></label><label>我的學習心得<textarea id="reflection"></textarea></label><button id="save">加入成果牆</button></section>
<section class="card"><h2>錄一段英文</h2><div class="actions"><button id="record">開始錄音</button><button id="stop" class="secondary" disabled>停止錄音</button><a id="audioDownload" class="btn hidden">下載錄音</a></div><audio id="audio" controls class="hidden"></audio><p class="muted">錄音只在目前瀏覽器工作階段處理；按下載後可自行保存音檔。</p></section>
<section class="card"><h2>我的成果牆</h2><div id="wall"></div><div class="actions"><button id="download">下載成果 JSON</button><button onclick="print()" class="secondary">列印／PDF</button></div></section>
<script>
const $=x=>document.getElementById(x);let works=JSON.parse(localStorage.getItem("senior-showcase-v1")||"[]"),rec,chunks=[];
function render(){ $("wall").innerHTML=works.length?works.map(w=>'<div class="phrase"><b>'+w.name+'</b><div class="sentence">'+w.sentence+'</div><div class="zh">'+w.zh+'</div><p>'+w.reflection+'</p></div>').join(""):"尚無作品。"}
$("save").onclick=()=>{works.unshift({date:new Date().toISOString(),name:$("name").value||"學員",sentence:$("sentence").value,zh:$("zh").value,reflection:$("reflection").value});localStorage.setItem("senior-showcase-v1",JSON.stringify(works.slice(0,30)));render()};
$("record").onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType}),u=URL.createObjectURL(blob);$("audio").src=u;$("audio").classList.remove("hidden");$("audioDownload").href=u;$("audioDownload").download="senior-english-recording.webm";$("audioDownload").classList.remove("hidden");stream.getTracks().forEach(t=>t.stop())};rec.start();$("record").disabled=true;$("stop").disabled=false}catch(e){alert("無法使用麥克風，請確認瀏覽器權限。")}};
$("stop").onclick=()=>{if(rec&&rec.state==="recording")rec.stop();$("record").disabled=false;$("stop").disabled=true};$("download").onclick=()=>{const b=new Blob([JSON.stringify(works,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="senior-english-showcase.json";a.click();URL.revokeObjectURL(u)};render();
</script></main></body></html>
