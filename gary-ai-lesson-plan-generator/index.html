<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="快速產生可教、可調整、可驗證的教案架構。"><title>Gary AI 教案生成器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#516d50;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#516d50;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20AI%20%E6%95%99%E6%A1%88%E7%94%9F%E6%88%90%E5%99%A8%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary AI 教案生成器</h1><p>快速產生可教、可調整、可驗證的教案架構。</p></div></header><main><section class="card"><h2>教案設定</h2><div class="grid"><label>主題<input id="topic" value="Restaurant English"></label><label>對象<input id="audience" value="樂齡初學者"></label><label>時間（分鐘）<input id="minutes" type="number" value="90"></label><label>目標<input id="goal" value="能完成基本點餐"></label></div><button id="generate">生成教案</button></section><section class="card"><h2>教案草稿</h2><div id="out" class="output"></div><div class="actions"><button id="copy">複製</button><button onclick="print()" class="secondary">列印／PDF</button></div></section></main><script>const $=x=>document.getElementById(x);function gen(){const t=$("topic").value,a=$("audience").value,m=+$("minutes").value,g=$("goal").value;const warm=Math.round(m*.1),input=Math.round(m*.25),prac=Math.round(m*.35),task=Math.round(m*.2),exit=m-warm-input-prac-task;$("out").textContent="【主題】"+t+"\n【對象】"+a+"\n【學習目標】"+g+"\n\n1. 暖身 "+warm+" 分鐘\n喚起既有經驗＋口語進場。\n\n2. 輸入 "+input+" 分鐘\n示範 3–5 個核心句型，先聽懂再跟讀。\n\n3. 引導練習 "+prac+" 分鐘\n配對／替換／情境選擇，立即回饋。\n\n4. 任務實作 "+task+" 分鐘\n完成一個真實情境任務。\n\n5. Exit Ticket "+exit+" 分鐘\n每人說出或寫出一個可獨立完成的成果。\n\n【評量】\n以「是否能獨立完成目標」為主，不以一次記住所有內容為完成線。"}$("generate").onclick=gen;$("copy").onclick=()=>navigator.clipboard.writeText($("out").textContent);gen();</script></body></html>
