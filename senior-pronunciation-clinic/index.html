<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="音標與發音訓練：常見母音、子音、最小對立音、重音與跟讀。"><title>樂齡英文發音診所</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#416a5b;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#568878;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E8%8B%B1%E6%96%87%E7%99%BC%E9%9F%B3%E8%A8%BA%E6%89%80%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡英文發音診所</h1><p>發音訓練｜先聽出差異，再慢慢說清楚。</p></div></header><main>
<section class="card"><h2>今日發音訓練</h2><select id="lesson"></select><div id="content"></div></section>
<section class="card"><h2>自我檢查</h2><p>每一組先聽 3 次，再自己說 3 次。</p><div id="checks"></div><button id="finish">記錄今天完成</button><p id="status"></p></section>
<section class="card"><h2>最近紀錄</h2><div id="history"></div></section>
<script>
const lessons=[
["/iː/ vs /ɪ/",[["sheep","ship"],["leave","live"],["seat","sit"]],"長音 /iː/ 拉長；短音 /ɪ/ 比較短、比較鬆。"],
["/æ/ vs /ɛ/",[["bad","bed"],["man","men"],["sad","said"]],"/æ/ 嘴巴張得更大；/ɛ/ 比較接近中文「ㄟ」的前半。"],
["/r/ vs /l/",[["right","light"],["road","load"],["rice","lice"]],"/r/ 舌尖不要碰上顎；/l/ 舌尖碰上齒齦。"],
["/θ/ vs /s/",[["think","sink"],["three","see"],["thumb","sum"]],"/θ/ 舌尖輕放上下齒間送氣。"],
["Word Stress",[["TAble","aBOUT"],["DOCtor","hoTEL"],["WINdow","reLAX"]],"英文多音節字有重音；重音節要更清楚、更長、更有力。"]
];const $=x=>document.getElementById(x);function speak(t,r=.6){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}
$("lesson").innerHTML=lessons.map((x,i)=>'<option value='+i+'>'+x[0]+'</option>').join("");function render(){const l=lessons[+$("lesson").value];$("content").innerHTML='<p>'+l[2]+'</p>'+l[1].map((p,i)=>'<div class="phrase"><div class="sentence">'+p[0]+' / '+p[1]+'</div><div class="actions"><button onclick="speak(\''+p[0]+'\')">聽 '+p[0]+'</button><button class="secondary" onclick="speak(\''+p[1]+'\')">聽 '+p[1]+'</button></div></div>').join("");$("checks").innerHTML=l[1].map((p,i)=>'<label><input type=checkbox id=c'+i+'> 我能聽出並說出 '+p[0]+' / '+p[1]+'</label><br>').join("")}
$("lesson").onchange=render;$("finish").onclick=()=>{const l=lessons[+$("lesson").value],done=l[1].filter((p,i)=>$("c"+i).checked).length;let h=JSON.parse(localStorage.getItem("senior-pronunciation-history-v1")||"[]");h.unshift({date:new Date().toISOString(),lesson:l[0],done,total:l[1].length});localStorage.setItem("senior-pronunciation-history-v1",JSON.stringify(h.slice(0,20)));$("status").textContent="已記錄："+done+"/"+l[1].length;show()};function show(){const h=JSON.parse(localStorage.getItem("senior-pronunciation-history-v1")||"[]");$("history").innerHTML=h.length?h.map(x=>'<p>'+new Date(x.date).toLocaleString()+'｜'+x.lesson+'｜'+x.done+'/'+x.total+'</p>').join(""):"尚無紀錄。"}render();show();
</script></main></body></html>
