<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="樂齡機場英文：報到、托運、安檢、登機、入境、領行李六段機場流程，大字中英對照、慢速播放、流程小測與學習紀錄。">
<title>樂齡機場英文</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#20374a;font:21px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#355f7d;color:#fff;padding:24px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:12px;padding:13px 18px;background:#4b7fa3;color:white;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e6f0f6!important;color:#355f7d!important}.card{background:white;border:1px solid #dbe8f0;border-radius:18px;padding:22px;margin:18px 0}.eyebrow{font-size:14px;font-weight:900;letter-spacing:.08em;color:#71899a}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.steps button{background:#edf5fa;color:#355f7d}.steps button.active{background:#4b7fa3;color:white}.phrase{border:2px solid #dfeaf1;border-radius:16px;padding:18px;margin:14px 0}.sentence{font-size:38px;font-weight:900;line-height:1.25;margin:12px 0}.zh{font-size:27px;font-weight:800;color:#4c687b}.use{background:#eef6fb;padding:14px;border-radius:12px}.flow{padding:12px;border-left:5px solid #6d97b2;background:#f0f7fb;border-radius:10px}.quiz label{display:block;border:1px solid #dbe7ee;border-radius:10px;padding:10px;margin:8px 0}.hidden{display:none}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric div{background:#f9fcfe;border:1px solid #dfe9ef;border-radius:12px;padding:14px;text-align:center}.metric b{display:block;font-size:28px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:16px;color:#687783}.history p{padding:8px 0;border-bottom:1px solid #e2ebf0}input[type=text],input[type=email]{width:100%;padding:12px;border:1px solid #bfd0dc;border-radius:10px;font:inherit}@media(max-width:700px){body{font-size:20px}.sentence{font-size:34px}.zh{font-size:25px}.steps{grid-template-columns:1fr 1fr}.metric{grid-template-columns:1fr}.btn,button{width:100%}.card{padding:16px}}@media print{header .actions,.actions,.steps,button{display:none!important}body{background:white}.card{border:0}}
</style>
</head>
<body><nav aria-label="樂齡學習網站導覽" style="background:#e8f5ec;color:#163e30;border-bottom:2px solid #b7d7c2;padding:12px 16px;font:700 19px/1.6 system-ui,'Noto Sans TC',sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a href="/senior-learning-center/" style="display:inline-block;background:#246b4f;color:#fff;padding:10px 16px;min-height:50px;border-radius:10px;text-decoration:none">← 返回樂齡學習總站</a><a href="/" style="display:inline-block;background:#fff;color:#245c46;border:2px solid #9fcbb1;padding:8px 14px;min-height:50px;border-radius:10px;text-decoration:none">Gary Learning Hub</a></nav>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E6%A9%9F%E5%A0%B4%E8%8B%B1%E6%96%87%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank" rel="noopener">聯絡站長</a></div><h1>樂齡機場英文</h1><p>從報到一路到領行李｜跟著流程學，不必一次記一大堆。</p></div></header>
<main>
<section class="card"><p class="eyebrow">01 · AIRPORT FLOW</p><h2>六段機場流程</h2><div id="steps" class="steps"></div></section>

<section class="card"><p class="eyebrow">02 · LEARN</p><h2 id="stepTitle"></h2><div id="flowNote" class="flow"></div><div id="phrases"></div></section>

<section class="card"><p class="eyebrow">03 · QUICK CHECK</p><h2>本段流程小測</h2><div id="quiz" class="quiz"></div><button id="submit">完成 4 題小測</button><p id="quizStatus"></p></section>

<section id="resultCard" class="card hidden"><p class="eyebrow">04 · RESULT</p><h2>本段完成</h2><div class="metric"><div><b id="score">0/4</b>答對</div><div><b id="accuracy">0%</b>正確率</div><div><b id="count">1</b>累積完成次數</div></div><div id="review"></div></section>

<section id="deliveryCard" class="card hidden"><p class="eyebrow">05 · SAVE & COACH</p><h2>保存成果</h2><label>姓名<input id="student" type="text" value="Gary 樂齡學員"></label><label>Email（選填）<input id="email" type="email"></label><div class="actions" style="margin-top:14px"><button id="download">下載 JSON</button><button id="print" class="secondary">列印／另存 PDF</button><button id="coach">寄給 Gary 教練（Gmail 草稿）</button></div><p class="muted">建議每次只練一段流程，能說出關鍵句再進下一段。</p><p id="deliveryStatus"></p></section>

<section class="card"><p class="eyebrow">06 · HISTORY</p><h2>最近完成紀錄</h2><div id="history" class="history">尚無紀錄。</div></section>
</main>
<script>
const stages=[
{name:"1 報到 Check-in",note:"先找航空公司櫃檯，準備護照與訂位資料。",items:[
{s:"Where is the check-in counter?",z:"報到櫃檯在哪裡？",u:"找航空公司櫃檯。"},
{s:"Here is my passport.",z:"這是我的護照。",u:"辦理報到時。"},
{s:"I have a reservation.",z:"我有訂位。",u:"確認訂位資料。"},
{s:"Can I have an aisle seat?",z:"可以給我走道座位嗎？",u:"選座位時。"}]},
{name:"2 托運 Baggage",note:"確認行李重量、托運件數與是否直掛目的地。",items:[
{s:"I have one bag to check.",z:"我有一件行李要托運。",u:"說明托運件數。"},
{s:"Is my luggage overweight?",z:"我的行李超重嗎？",u:"確認重量。"},
{s:"Is this bag checked through to my destination?",z:"這件行李會直接送到目的地嗎？",u:"轉機時確認直掛。"},
{s:"Where do I pick up my luggage?",z:"我要在哪裡領行李？",u:"確認領取位置。"}]},
{name:"3 安檢 Security",note:"依指示取出液體、筆電與金屬物品。",items:[
{s:"Do I need to take off my shoes?",z:"我需要脫鞋嗎？",u:"安檢前確認規定。"},
{s:"Should I take out my laptop?",z:"我需要把筆電拿出來嗎？",u:"過安檢時。"},
{s:"Is this liquid allowed?",z:"這個液體可以帶嗎？",u:"確認液體規定。"},
{s:"Where should I put my bag?",z:"我的包包要放哪裡？",u:"放入安檢籃時。"}]},
{name:"4 登機 Boarding",note:"確認登機門、登機時間與是否開始登機。",items:[
{s:"Where is Gate 12?",z:"12 號登機門在哪裡？",u:"找登機門。"},
{s:"What time does boarding start?",z:"幾點開始登機？",u:"確認登機時間。"},
{s:"Is this the line for boarding?",z:"這是登機的隊伍嗎？",u:"確認排隊位置。"},
{s:"Has boarding started?",z:"已經開始登機了嗎？",u:"確認是否可以登機。"}]},
{name:"5 入境 Immigration",note:"準備護照，回答旅行目的與停留時間。",items:[
{s:"I am here for tourism.",z:"我是來旅遊的。",u:"說明旅行目的。"},
{s:"I will stay for five days.",z:"我會停留五天。",u:"回答停留時間。"},
{s:"I am staying at this hotel.",z:"我住在這間飯店。",u:"說明住宿地點。"},
{s:"Here is my return ticket.",z:"這是我的回程機票。",u:"需要提供回程資訊時。"}]},
{name:"6 領行李 Baggage Claim",note:"看行李轉盤號碼，若遺失就立刻找行李服務櫃檯。",items:[
{s:"Which carousel is for my flight?",z:"我的航班在哪個行李轉盤？",u:"找行李轉盤。"},
{s:"My luggage is missing.",z:"我的行李不見了。",u:"行李未出現。"},
{s:"This is my baggage claim tag.",z:"這是我的行李條。",u:"申報遺失行李。"},
{s:"Where is the baggage service desk?",z:"行李服務櫃檯在哪裡？",u:"尋求協助。"}]}
];
const $=id=>document.getElementById(id);let stageIndex=0,current=stages[0],results=[];
function speak(text,rate=.62){if(!("speechSynthesis" in window)){alert("此裝置不支援語音播放。");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;speechSynthesis.speak(u)}
function renderSteps(){ $("steps").replaceChildren(); stages.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s.name;b.className=i===stageIndex?"active":"";b.onclick=()=>{stageIndex=i;render()};$("steps").append(b)});}
function render(){
 current=stages[stageIndex];results=[];renderSteps();$("stepTitle").textContent=current.name;$("flowNote").textContent=current.note;$("phrases").replaceChildren();
 current.items.forEach((x,i)=>{const d=document.createElement("div");d.className="phrase";d.innerHTML='<div class="sentence">'+x.s+'</div><div class="zh">'+x.z+'</div><div class="use"><b>使用時機</b><br>'+x.u+'</div><div class="actions" style="margin-top:12px"><button data-slow="'+i+'">慢速聽</button><button class="secondary" data-normal="'+i+'">正常速度</button></div>';$("phrases").append(d)});
 document.querySelectorAll("[data-slow]").forEach(b=>b.onclick=()=>speak(current.items[Number(b.dataset.slow)].s,.55));
 document.querySelectorAll("[data-normal]").forEach(b=>b.onclick=()=>speak(current.items[Number(b.dataset.normal)].s,.85));
 buildQuiz();$("resultCard").classList.add("hidden");$("deliveryCard").classList.add("hidden");$("quizStatus").textContent="";
}
function buildQuiz(){
 $("quiz").replaceChildren();
 current.items.forEach((x,i)=>{const others=current.items.filter((_,j)=>j!==i).map(y=>y.z);const opts=[x.z,...others].sort(()=>Math.random()-.5);const d=document.createElement("div");d.innerHTML='<p><b>Q'+(i+1)+'. '+x.s+'</b></p>'+opts.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+encodeURIComponent(o)+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>').join("");$("quiz").append(d)});
}
$("submit").onclick=()=>{
 const missing=current.items.filter((x,i)=>!document.querySelector('input[name="q'+i+'"]:checked')).length;if(missing){$("quizStatus").textContent="還有 "+missing+" 題未作答。";return}
 let score=0;results=current.items.map((x,i)=>{const chosen=decodeURIComponent(document.querySelector('input[name="q'+i+'"]:checked').value),ok=chosen===x.z;if(ok)score++;return{x,chosen,ok}});
 $("score").textContent=score+"/4";$("accuracy").textContent=(score*25)+"%";
 const arr=JSON.parse(localStorage.getItem("senior-airport-english-history-v1")||"[]");arr.unshift({date:new Date().toISOString(),stage:current.name,score});localStorage.setItem("senior-airport-english-history-v1",JSON.stringify(arr.slice(0,30)));$("count").textContent=arr.length;
 $("review").innerHTML=results.map(r=>'<p class="'+(r.ok?'good':'bad')+'"><b>'+(r.ok?'✓':'✗')+' '+r.x.s+'</b><br>'+r.x.z+'<br>你的答案：'+r.chosen+'</p>').join("");
 $("resultCard").classList.remove("hidden");$("deliveryCard").classList.remove("hidden");showHistory();$("resultCard").scrollIntoView({behavior:"smooth"});
};
function snapshot(){const score=results.filter(x=>x.ok).length;return{site:"樂齡機場英文",version:"MVP V1",date:new Date().toISOString(),student:$("student").value.trim()||"Gary 樂齡學員",email:$("email").value.trim(),stage:current.name,score,total:4,phrases:current.items,answers:results.map(r=>({sentence:r.x.s,chosen:r.chosen,answer:r.x.z,correct:r.ok}))}}
function report(){const d=snapshot();return "樂齡機場英文\n學員："+d.student+"\n流程："+d.stage+"\n分數："+d.score+"/4\n\n重點句：\n"+d.phrases.map((x,i)=>(i+1)+". "+x.s+"｜"+x.z).join("\n")}
function showHistory(){const arr=JSON.parse(localStorage.getItem("senior-airport-english-history-v1")||"[]");$("history").innerHTML=arr.length?arr.slice(0,12).map(x=>'<p>'+new Date(x.date).toLocaleString()+'｜'+x.stage+'｜'+x.score+'/4</p>').join(""):"尚無紀錄。"}
$("download").onclick=()=>{const b=new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="senior-airport-english-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$("deliveryStatus").textContent="已下載學習紀錄。"};
$("print").onclick=()=>window.print();
$("coach").onclick=()=>{const d=snapshot(),subject="樂齡機場英文｜"+d.student+"｜"+d.stage+"｜"+d.score+"/4";window.open("https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su="+encodeURIComponent(subject)+"&body="+encodeURIComponent(report()),"_blank","noopener,noreferrer");$("deliveryStatus").textContent="已嘗試開啟 Gmail 草稿，請確認後手動傳送。"};
render();showHistory();
</script>
</body></html>
