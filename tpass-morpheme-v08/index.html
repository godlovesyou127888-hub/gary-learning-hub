<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPASS 詞素診斷 V0.8</title><style>
:root{--bg:#f6f4ee;--card:#fffdf8;--text:#314247;--muted:#687b80;--line:#dce7e2;--accent:#6f9993;--accent2:#8fb1ab}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);font-size:19px;line-height:1.75}header{background:linear-gradient(135deg,#5f7f7b,#789d98);color:#fff;padding:36px 18px}.wrap{max-width:1050px;margin:auto}.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 24px rgba(74,103,100,.06)}.btn{padding:13px 17px;border-radius:12px;border:0;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.secondary{background:#fffdf8;color:#3d5653;border:2px solid #cdded8}.q{padding:18px 0;border-bottom:1px solid var(--line)}.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:800}.field input,.field select{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font:inherit}.hidden{display:none}.score{font-size:34px;font-weight:900}.muted{color:#526a6f}.foot{font-size:14px;color:#64748b}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><div style="background:#314247;color:#fff;padding:10px 16px;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif"><div style="max-width:1100px;margin:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><strong>T-PASS TOEIC Command Center｜Step 1 診斷／Step 4 Foundation｜詞素訓練</strong><a href="/tpass-toeic-command-center/" style="color:#fff;background:#6f9993;padding:7px 10px;border-radius:9px;text-decoration:none;font-weight:700">← 回 Command Center</a><a href="/toeic-weakness-radar/" style="color:#314247;background:#fffdf8;padding:7px 10px;border-radius:9px;text-decoration:none;font-weight:700">Step 1 下一步：Weakness Radar →</a><a href="/tpass-toeic-command-center/#step4" style="color:#314247;background:#fffdf8;padding:7px 10px;border-radius:9px;text-decoration:none;font-weight:700">Step 4 完成後：回自適應訓練 →</a></div></div><header><div class="wrap"><h1>TPASS｜詞素診斷與練習 V0.8</h1><p>18 題診斷 → 成績摘要 → 學生收件＋教練同步收件</p><p><a class="btn secondary" href="/">← Gary Learning Hub</a></p></div></header><main class="wrap">
<section class="panel"><h2>基本資料</h2><div class="grid"><div class="field"><label>姓名</label><input id="studentNameInput"></div><div class="field"><label>Email</label><input id="studentEmailInput" type="email"></div><div class="field"><label>目標分數</label><input id="targetScoreInput" type="number" min="10" max="990" placeholder="例如 800"></div><div class="field"><label>每天可投入分钟</label><select id="dailyMinutesInput"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div></div><p class="muted">請勿查字典或使用 AI。此為自编診斷，不是官方 TOEIC 測驗。</p></section>
<form id="quiz"></form>
<section class="panel"><button class="btn primary" type="button" onclick="grade()">完成診斷</button></section>
<section id="resultPanel" class="panel hidden"><h2>診斷摘要</h2><div id="summary"></div><p><button class="btn secondary" type="button" onclick="window.print()">列印／储存 PDF</button></p>
<form action="https://formsubmit.co/godlovesyou127888@gmail.com" method="POST" onsubmit="return prep()">
<input type="hidden" name="_subject" value="TPASS Morpheme Diagnostic V0.8｜Student Result"><input type="hidden" name="_template" value="table"><input type="hidden" name="_autoresponse" value="已收到你的 TPASS 詞素診斷結果。這封信是你的結果副本，請保留作為後续學習参考。"><input type="hidden" name="_next" value="https://gary-learning-hub.onrender.com/tpass-morpheme-v08/">
<input type="hidden" name="student_name" id="sn"><input type="hidden" name="email" id="se"><input type="hidden" name="target_score" id="st"><input type="hidden" name="daily_minutes" id="sm"><input type="hidden" name="total_score" id="ss"><input type="hidden" name="group_scores" id="sg"><input type="hidden" name="question_responses" id="sqr"><input type="hidden" name="question_responses_json" id="sqrj"><input type="hidden" name="submitted_at" id="sd">
<button class="btn primary" type="submit">寄給我並同步給教練｜Email Me & Coach</button></form><p class="foot">第一次啟用 FormSubmit 時，教練收件信箱可能需要完成一次確認。</p></section>
</main><script>
const Q=[
["C1","reusable（可重複使用的）哪個拆解最合理？",["re-＋use＋-able","reuse＋-ful","每個字母各有意思","英文都不能拆解","不知道"],0],
["C2","The supplier confirmed the ___ of the replacement parts.",["available","availability","availably","avail","不知道"],1],
["C3","遇到生字並認出字根後，下一步是？",["直接認定整字意思","提出可能意思，再用上下文確認","只看字根","跳過整句","不知道"],1],
["A1","The technician will recheck the equipment. recheck 是？",["停止檢查","再次檢查","提前運送","更換設備","不知道"],1],
["A2","The item is currently unavailable. unavailable 是？",["無法取得","可重複使用","便宜","重新設計","不知道"],0],
["A3","employ 表示僱用，employer 指？",["被僱用者","僱用他人的人或組織","面試","工作場所","不知道"],1],
["A4","Please ___ your reservation by Friday.",["confirmation","confirmed","confirm","confirming","不知道"],2],
["A5","inspect 和 inspection 共同涉及？",["搬運","說話","書寫","查看或檢查","不知道"],3],
["B1","The ___ of the new branch is scheduled for Monday.",["open","opening","openly","opened","不知道"],1],
["B2","We need a ___ supplier who delivers on time.",["reliability","reliably","reliable","rely","不知道"],2],
["B3","The assistant responded ___ to the customer's request.",["quickly","quick","quickness","quicker","不知道"],0],
["B4","The two reports contain inconsistent figures. 數字如何？",["保密","已更新","精確","不一致","不知道"],3],
["B5","produce、production、productive 共同涉及？",["搬運","製造或產出","查看","書寫","不知道"],1],
["D1","trans- 表示跨越。transcontinental rail service 是？",["單站內","地下","橫跨大陸","只運貨櫃","不知道"],2],
["D2","All employees must attend the ___ safety training.",["mandatory","mandate","mandatorily","mandates","不知道"],0],
["D3","The packaging is biodegradable. biodegradable 是？",["防水","可折疊","耐高溫","可被生物分解","不知道"],3],
["D4","遇到 important，看到 port 應？",["必定與搬運有關","確認字義與上下文，不只看相同字母","解釋成搬進來","解釋成可運送","不知道"],1],
["D5","The new procedure will help us ___ processing errors.",["reduction","reducing","reduce","reduced","不知道"],2]
];
const quiz=document.getElementById("quiz");
const studentNameInput=document.getElementById("studentNameInput");
const studentEmailInput=document.getElementById("studentEmailInput");
const targetScoreInput=document.getElementById("targetScoreInput");
const dailyMinutesInput=document.getElementById("dailyMinutesInput");
const resultPanel=document.getElementById("resultPanel");
const summaryBox=document.getElementById("summary");
const sn=document.getElementById("sn"),se=document.getElementById("se"),st=document.getElementById("st"),sm=document.getElementById("sm"),ss=document.getElementById("ss"),sg=document.getElementById("sg"),sqr=document.getElementById("sqr"),sqrj=document.getElementById("sqrj"),sd=document.getElementById("sd");

Q.forEach((q,i)=>{
 const d=document.createElement("section");
 d.className="panel q";
 d.innerHTML=`<b>${q[0]}. ${q[1]}</b>${q[2].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join("")}`;
 quiz.appendChild(d);
});

let last=null;

function grade(){
 if(!studentNameInput.value.trim()){
   alert("請先填寫姓名。");
   studentNameInput.focus();
   return;
 }
 if(!studentEmailInput.value || !studentEmailInput.checkValidity()){
   alert("請填寫有效 Email。");
   studentEmailInput.focus();
   return;
 }
 let total=0,g={C:[0,0],A:[0,0],B:[0,0],D:[0,0]},responses=[];
 for(let i=0;i<Q.length;i++){
   const a=document.querySelector(`input[name="q${i}"]:checked`);
   if(!a){
     alert("請完成全部 18 題。第 "+(i+1)+" 題尚未作答。");
     document.querySelector(`input[name="q${i}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});
     return;
   }
   const chosen=Number(a.value),ok=chosen===Q[i][3],k=Q[i][0][0];
   g[k][1]++;
   if(ok){total++;g[k][0]++;}
   responses.push({question_id:Q[i][0],skill_tag:k,question:Q[i][1],student_answer_index:chosen,student_answer:Q[i][2][chosen],correct_answer_index:Q[i][3],correct_answer:Q[i][2][Q[i][3]],is_correct:ok});
 }
 last={total,g,responses};
 summaryBox.innerHTML=`<p><span class="score">${total}/18</span></p><p>C：${g.C[0]}/${g.C[1]}　A：${g.A[0]}/${g.A[1]}　B：${g.B[0]}/${g.B[1]}　D：${g.D[0]}/${g.D[1]}</p><p class="muted">建議優先複習正確率最低的題組，再回看錯題與詞素拆解邏輯。</p>`;
 resultPanel.classList.remove("hidden");
 resultPanel.scrollIntoView({behavior:"smooth",block:"start"});
 localStorage.setItem("tpass_morpheme_v08_result",JSON.stringify({name:studentNameInput.value.trim(),email:studentEmailInput.value,total,g,responses,date:new Date().toISOString()}));
}

function prep(){
 if(!last){alert("請先完成診斷。");return false}
 sn.value=studentNameInput.value.trim();
 se.value=studentEmailInput.value.trim();
 st.value=targetScoreInput.value;
 sm.value=dailyMinutesInput.value;
 ss.value=last.total+"/18";
 sg.value=Object.entries(last.g).map(([k,v])=>k+":"+v[0]+"/"+v[1]).join(" | ");
 sqr.value=last.responses.map(x=>x.question_id+"｜學生："+x.student_answer+"｜正解："+x.correct_answer+"｜"+(x.is_correct?"O":"X")).join("\n");
 sqrj.value=JSON.stringify(last.responses);
 sd.value=new Date().toISOString();
 return true;
}
</script></body></html>
