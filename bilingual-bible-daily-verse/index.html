<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="每日中英經文、關鍵字與簡短反思。"><title>雙語聖經每日一句</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#5a6644;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#5a6644;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E9%9B%99%E8%AA%9E%E8%81%96%E7%B6%93%E6%AF%8F%E6%97%A5%E4%B8%80%E5%8F%A5%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>雙語聖經每日一句</h1><p>每日中英經文、關鍵字與簡短反思。</p></div></header><main><section class="card"><span class="tag" id="ref"></span><h2 id="zh" style="font-size:30px"></h2><p id="en" style="font-size:25px"></p><div class="actions"><button id="speak">慢速聽英文</button><button id="next" class="secondary">下一節</button></div></section><section class="card"><h2>今日重點</h2><div id="note" class="output"></div></section><section class="card"><h2>我的一句回應</h2><textarea id="reflection" placeholder="今天這節經文提醒我……"></textarea><button id="save">保存今日反思</button><div id="history"></div><p class="muted">英文採 KJV 公版經文；中文採和合本傳統譯文短節選。</p></section></main><script>const verses=[
["Psalm 23:1","耶和華是我的牧者，我必不致缺乏。","The LORD is my shepherd; I shall not want.","shepherd 牧者｜重點：信靠與供應。"],
["Proverbs 3:5","你要專心仰賴耶和華，不可倚靠自己的聰明。","Trust in the LORD with all thine heart; and lean not unto thine own understanding.","trust 信靠｜重點：不是只靠自己的判斷。"],
["Philippians 4:13","我靠著那加給我力量的，凡事都能做。","I can do all things through Christ which strengtheneth me.","strength 力量｜重點：力量來源不只在自己。"],
["Psalm 119:105","你的話是我腳前的燈，是我路上的光。","Thy word is a lamp unto my feet, and a light unto my path.","lamp 燈｜path 道路｜重點：神的話提供方向。"],
["Matthew 5:9","使人和睦的人有福了！因為他們必稱為神的兒子。","Blessed are the peacemakers: for they shall be called the children of God.","peacemaker 使人和睦的人｜重點：主動建立和平。"],
["1 Thessalonians 5:18","凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。","In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","give thanks 感恩｜重點：在各種處境操練感恩。"],
["Joshua 1:9","你當剛強壯膽！不要懼怕，也不要驚惶。","Be strong and of a good courage; be not afraid, neither be thou dismayed.","courage 勇氣｜重點：面對未知仍選擇勇敢。"]
];const $=x=>document.getElementById(x);let i=Math.floor(Date.now()/86400000)%verses.length;function render(){const v=verses[i];$("ref").textContent=v[0];$("zh").textContent=v[1];$("en").textContent=v[2];$("note").textContent=v[3]}$("next").onclick=()=>{i=(i+1)%verses.length;render()};$("speak").onclick=()=>{const u=new SpeechSynthesisUtterance(verses[i][2]);u.lang="en-US";u.rate=.65;speechSynthesis.cancel();speechSynthesis.speak(u)};$("save").onclick=()=>{let h=JSON.parse(localStorage.getItem("bilingual-bible-reflections-v1")||"[]");h.unshift({date:new Date().toISOString(),ref:verses[i][0],reflection:$("reflection").value});localStorage.setItem("bilingual-bible-reflections-v1",JSON.stringify(h.slice(0,30)));show()};function show(){const h=JSON.parse(localStorage.getItem("bilingual-bible-reflections-v1")||"[]");$("history").innerHTML=h.length?h.slice(0,10).map(x=>'<p>'+new Date(x.date).toLocaleDateString()+'｜'+x.ref+'｜'+x.reflection+'</p>').join(""):"尚無反思紀錄。"}render();show();</script></body></html>
