<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="學員進度追蹤 MVP：彙整同一瀏覽器中的樂齡英語學習紀錄。"><title>樂齡英文教師版後台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#3f5360;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#536e7d;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><nav aria-label="樂齡學習網站導覽" style="background:#e8f5ec;color:#163e30;border-bottom:2px solid #b7d7c2;padding:12px 16px;font:700 19px/1.6 system-ui,'Noto Sans TC',sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a href="/senior-learning-center/" style="display:inline-block;background:#246b4f;color:#fff;padding:10px 16px;min-height:50px;border-radius:10px;text-decoration:none">← 返回樂齡學習總站</a><a href="/" style="display:inline-block;background:#fff;color:#245c46;border:2px solid #9fcbb1;padding:8px 14px;min-height:50px;border-radius:10px;text-decoration:none">Gary Learning Hub</a></nav><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E8%8B%B1%E6%96%87%E6%95%99%E5%B8%AB%E7%89%88%E5%BE%8C%E5%8F%B0%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡英文教師版後台</h1><p>教師版後台 MVP｜彙整同一裝置、同一瀏覽器內已保存的學習紀錄。</p></div></header><main>
<section class="card"><h2>學習站紀錄總覽</h2><div id="summary" class="metric"></div><p class="muted">目前為本機版：只讀取此瀏覽器同一網域的 localStorage，不是跨裝置雲端後台。</p></section>
<section class="card"><h2>最近活動</h2><div id="activity"></div><div class="actions"><button id="refresh">重新整理</button><button id="download" class="secondary">下載總覽 JSON</button></div></section>
<script>
const keys=[
["每日5字","gary-senior-5words-history-v1"],["每日一句","gary-senior-daily-sentence-history-v1"],["旅遊生存","senior-survival-english-history-v1"],["機場","senior-airport-english-history-v1"],["飯店","senior-hotel-english-history-v1"],["餐廳","senior-restaurant-english-history-v1"],["購物","senior-shopping-english-history-v1"],["醫療","senior-medical-history-v1"],["交通","senior-transport-history-v1"],["電話","senior-phone-history-v1"],["發音","senior-pronunciation-history-v1"],["記憶","senior-memory-history-v1"],["AI陪練","senior-ai-practice-history-v1"]
];const $=x=>document.getElementById(x);let snapshot=[];
function load(){snapshot=keys.map(([name,key])=>{let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||"[]")}catch{}return{name,key,count:rows.length,latest:rows[0]||null,rows}});$("summary").innerHTML=snapshot.map(x=>'<div><b>'+x.count+'</b>'+x.name+'</div>').join("");const acts=snapshot.flatMap(x=>x.rows.map(r=>({...r,site:x.name}))).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,30);$("activity").innerHTML=acts.length?acts.map(a=>'<p>'+new Date(a.date).toLocaleString()+'｜'+a.site+'｜'+JSON.stringify(a).replace(/[{}"]/g," ")+'</p>').join(""):"此瀏覽器尚無可讀取的學習紀錄。"}
$("refresh").onclick=load;$("download").onclick=()=>{const b=new Blob([JSON.stringify(snapshot,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="senior-teacher-dashboard.json";a.click();URL.revokeObjectURL(u)};load();
</script></main></body></html>
