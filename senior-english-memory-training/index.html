<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="重複與提取練習：看、遮、想、說、再測。"><title>樂齡英文記憶訓練</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#617043;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#7b8c57;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E8%8B%B1%E6%96%87%E8%A8%98%E6%86%B6%E8%A8%93%E7%B7%B4%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡英文記憶訓練</h1><p>記憶訓練｜不是一直重看，而是練習自己想起來。</p></div></header><main>
<section class="card"><h2>今天 5 個字</h2><div id="cards"></div><div class="actions"><button id="hide">遮住中文，開始回想</button><button id="reveal" class="secondary">顯示答案</button></div></section>
<section class="card"><h2>提取小測</h2><div id="quiz" class="quiz"></div><button id="submit">完成提取</button><p id="status"></p></section>
<section class="card"><h2>間隔複習建議</h2><p>今天 → 明天 → 3 天後 → 7 天後。每次先回想，再看答案。</p><div id="history"></div></section>
<script>
const sets=[[["family","家庭"],["water","水"],["friend","朋友"],["station","車站"],["doctor","醫生"]],[["hotel","飯店"],["ticket","票"],["breakfast","早餐"],["help","幫助"],["medicine","藥"]],[["left","左邊"],["right","右邊"],["room","房間"],["bill","帳單"],["bus","公車"]]];let idx=Math.floor(Date.now()/86400000)%sets.length,items=sets[idx];const $=x=>document.getElementById(x);
function render(show=true){$("cards").innerHTML=items.map(x=>'<div class="phrase"><div class="sentence">'+x[0]+'</div><div class="zh">'+(show?x[1]:"？？？")+'</div></div>').join("");$("quiz").innerHTML=items.map((x,i)=>'<label>'+x[0]+' 的中文：<input id=a'+i+' placeholder="請自己回想後輸入"></label>').join("")}
$("hide").onclick=()=>render(false);$("reveal").onclick=()=>render(true);$("submit").onclick=()=>{let s=0;items.forEach((x,i)=>{if($("a"+i).value.trim()===x[1])s++});let h=JSON.parse(localStorage.getItem("senior-memory-history-v1")||"[]");h.unshift({date:new Date().toISOString(),set:idx,score:s});localStorage.setItem("senior-memory-history-v1",JSON.stringify(h.slice(0,20)));$("status").textContent="本次提取："+s+"/5。錯的字明天優先再測。";show()};function show(){const h=JSON.parse(localStorage.getItem("senior-memory-history-v1")||"[]");$("history").innerHTML=h.length?h.map(x=>'<p>'+new Date(x.date).toLocaleString()+'｜'+x.score+'/5</p>').join(""):"尚無紀錄。"}render();show();
</script></main></body></html>
