<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="看診基本英文：掛號、症狀、疼痛、用藥、緊急求助。"><title>樂齡醫療英文</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#6a4f62;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#88677d;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><nav aria-label="樂齡學習網站導覽" style="background:#e8f5ec;color:#163e30;border-bottom:2px solid #b7d7c2;padding:12px 16px;font:700 19px/1.6 system-ui,'Noto Sans TC',sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a href="/senior-learning-center/" style="display:inline-block;background:#246b4f;color:#fff;padding:10px 16px;min-height:50px;border-radius:10px;text-decoration:none">← 返回樂齡學習總站</a><a href="/" style="display:inline-block;background:#fff;color:#245c46;border:2px solid #9fcbb1;padding:8px 14px;min-height:50px;border-radius:10px;text-decoration:none">Gary Learning Hub</a></nav><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E9%86%AB%E7%99%82%E8%8B%B1%E6%96%87%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡醫療英文</h1><p>看診基本英文｜先把最需要說清楚的身體資訊說出來。</p></div></header><main>
<section class="card"><h2>五大看診情境</h2><div id="tabs" class="actions"></div></section>
<section class="card"><h2 id="title"></h2><div id="items"></div></section>
<section class="card"><h2>情境小測</h2><div id="quiz" class="quiz"></div><button id="submit">完成小測</button><p id="status"></p></section>
<section id="result" class="card hidden"><div class="metric"><div><b id="score"></b>答對</div><div><b id="accuracy"></b>正確率</div><div><b id="count"></b>累積完成</div></div><div id="review"></div><div class="actions"><button id="download">下載 JSON</button><button onclick="print()" class="secondary">列印／PDF</button></div></section>
<script>
const data=[
["掛號 Registration",[["I need to see a doctor.","我需要看醫生。"],["I have an appointment.","我有預約。"],["Where should I register?","我要在哪裡掛號？"],["Here is my health information.","這是我的健康資料。"]]],
["症狀 Symptoms",[["I have a fever.","我發燒。"],["I have a cough.","我咳嗽。"],["I feel dizzy.","我覺得頭暈。"],["I feel short of breath.","我覺得呼吸不順。"]]],
["疼痛 Pain",[["I have pain here.","我這裡會痛。"],["It hurts when I walk.","我走路時會痛。"],["The pain started yesterday.","疼痛昨天開始。"],["The pain is getting worse.","疼痛越來越嚴重。"]]],
["用藥 Medicine",[["I take this medicine every day.","我每天吃這個藥。"],["How often should I take this?","這個多久吃一次？"],["Should I take it with food?","這個要跟食物一起吃嗎？"],["I am allergic to this medicine.","我對這個藥過敏。"]]],
["緊急 Emergency",[["Please call an ambulance.","請叫救護車。"],["I need help now.","我現在需要幫忙。"],["I cannot breathe well.","我呼吸很困難。"],["Where is the emergency room?","急診室在哪裡？"]]]
];let idx=0,res=[];
const $=x=>document.getElementById(x);function speak(t,r=.6){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}
function render(){const [name,items]=data[idx];$("tabs").innerHTML=data.map((d,i)=>'<button class="'+(i===idx?'':'secondary')+'" onclick="idx='+i+';render()">'+d[0]+'</button>').join("");$("title").textContent=name;$("items").innerHTML=items.map((x,i)=>'<div class="phrase"><div class="sentence">'+x[0]+'</div><div class="zh">'+x[1]+'</div><div class="actions"><button onclick="speak(\''+x[0].replace(/'/g,"\\'")+'\',.55)">慢速聽</button><button class="secondary" onclick="speak(\''+x[0].replace(/'/g,"\\'")+'\',.85)">正常速度</button></div></div>').join("");$("quiz").innerHTML=items.map((x,i)=>{const opts=[...items.map(y=>y[1])].sort(()=>Math.random()-.5);return '<p><b>Q'+(i+1)+'. '+x[0]+'</b></p>'+opts.map(o=>'<label><input type="radio" name="q'+i+'" value="'+encodeURIComponent(o)+'"> '+o+'</label>').join("")}).join("");$("result").classList.add("hidden")}
$("submit").onclick=()=>{const items=data[idx][1];if(items.some((x,i)=>!document.querySelector('[name=q'+i+']:checked'))){$("status").textContent="還有題目未作答。";return}res=items.map((x,i)=>{const c=decodeURIComponent(document.querySelector('[name=q'+i+']:checked').value);return{sentence:x[0],answer:x[1],chosen:c,ok:c===x[1]}});const s=res.filter(x=>x.ok).length;let h=JSON.parse(localStorage.getItem("senior-medical-history-v1")||"[]");h.unshift({date:new Date().toISOString(),scene:data[idx][0],score:s});localStorage.setItem("senior-medical-history-v1",JSON.stringify(h.slice(0,20)));$("score").textContent=s+"/4";$("accuracy").textContent=s*25+"%";$("count").textContent=h.length;$("review").innerHTML=res.map(x=>'<p class="'+(x.ok?'good':'bad')+'">'+(x.ok?'✓ ':'✗ ')+x.sentence+'｜'+x.answer+'</p>').join("");$("result").classList.remove("hidden")};
$("download").onclick=()=>{const b=new Blob([JSON.stringify({site:"樂齡醫療英文",scene:data[idx][0],date:new Date().toISOString(),results:res},null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="senior-medical-english.json";a.click();URL.revokeObjectURL(u)};render();
</script></main></body></html>
