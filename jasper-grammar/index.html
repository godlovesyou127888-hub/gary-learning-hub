<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jasper 文法診斷練習站</title><style>body{font:16px system-ui,'Noto Sans TC';background:#f1f5f9;color:#183047;margin:0}main{max-width:820px;margin:auto;padding:18px}header{background:#164879;color:white;padding:24px;border-radius:16px}section{background:white;padding:20px;margin:16px 0;border-radius:14px}button{background:#1463a5;color:white;border:0;border-radius:8px;padding:11px 16px;margin:5px;cursor:pointer}input{padding:10px;font-size:16px;max-width:95%}.q{padding:15px 0;border-bottom:1px solid #ddd}.q label{display:block;padding:5px}small{color:#52667a}.ok{color:green}.bad{color:#b42318}</style><main><header><h1>Jasper 英文文法診斷練習站</h1><p>每回亂數：10 題選擇＋10 題填空｜自動訂正｜成績紀錄</p></header><section><label>學員姓名 <input id="student" value="Jasper"></label><button onclick="start()">開始新測驗</button><button onclick="historyView()">歷史成績</button><p><small>成績儲存於本裝置瀏覽器。寄送報告會開啟郵件程式，需自行按「寄送」。</small></p></section><section id="quiz"></section><section id="results"></section><script>const MC=[["Shelly has lived in Orlando ___ more than 10 years.","for","since|for|when|until","for 接一段時間。"],["You have little to eat at night, ___?","do you","have you|haven't you|don't you|do you","little 表否定，附加問句用肯定。"],["You have cleaned your room, ___?","haven't you","haven't you|have you|do you|don't you","現在完成式肯定句，附加問句用 haven't。"],["___ you finished your homework yet?","Have","Have|Did|Do|Are","yet 常搭配現在完成式疑問句。"],["There will be a big party, ___?","won't there","isn't there|is there|will there|won't there","There will be 的附加問句為 won't there。"],["Ken and Joy will come tonight, won't they? — ___","Yes, they will","Yes, they won't|No, they didn't|Yes, they will|No, they will","肯定回答用 Yes, they will。"],["___ have you stayed in Korea? — Since I was seven.","How long","How old|How long|When|Where","詢問持續時間用 How long。"],["It has been five years since he ___ to Japan.","moved","moves|moved|has moved|had moved","since 後接過去發生的動作。"],["She ___ to her grandmother's house. She is not here now.","has gone","has gone|had gone|went|goes","has gone to 表示去了尚未回來。"],["___ did you have this problem?","When","How long|What time|How often|When","did 搭配過去時間點的問句。"],["Cindy ___ to Taichung many times.","has been","has been|had been|has gone|goes","has been to 表示曾去過。"],["Have you ___ Indian food before?","tried","been tried|to try|tried|try","have 後接過去分詞 tried。"],["There is nothing special in this box, ___?","is there","isn't there|is there|are there|do there","nothing 為否定意義。"],["I have had a serious car accident ___.","before","never|ever|after|before","before 可表示過去曾有經驗。"],["Chris ___ in Miami 6 years ago.","lived","has been living|has lived|live|lived","ago 搭配過去簡單式。"],["They have discussed this topic ___ this morning.","since","when|to|since|for","since 後接起始時間點。"],["There is a girl crying on the street, ___?","isn't there","is there|isn't there|has there|hasn't there","There is 肯定句，附加問句為 isn't there。"],["I haven't finished my homework ___.","yet","just|never|already|yet","否定完成式句尾常用 yet。"],["I ___ hard for the test last night.","studied","study|studied|has studied|have studied","last night 搭配過去式。"],["They hardly eat in the restaurant, ___?","do they","are they|aren't they|do they|don't they","hardly 具有否定意義。"],["Connie ___ the bus to school yesterday.","took","took|takes|has taken|taking","yesterday 搭配過去式。"],["Ashley ___ cut her long hair, didn't she?","had to","has to|hasn't|had to|hasn't had","didn't she 對應過去式 had to。"],["He ___ for 30 minutes.","has run","is running|runned|has ran|has run","run 的過去分詞仍為 run。"],["The teacher has given students the assignment ___.","recently","yet|recently|never|before","recently 可與現在完成式搭配。"],["Oscar never goes to bed early, ___?","does he","doesn't he|does he|isn't he|is he","never 具有否定意義，問句用肯定。"],["She has ___ seen the famous actress on the street.","already","already|before|after|yet","already 放在助動詞與過去分詞之間。"],["Gina doesn't like strawberries, does she? — ___","Yes, she does","Yes, she doesn't|Yes, she does|No, she does|Yes, she did","肯定事實回答 Yes, she does。"],["The doctor ___ my dad to quit smoking several times.","has told","is telling|has telling|have been told|has told","several times 可用現在完成式。"],["She has ___ tried the new fruit tea.","never","once|before|never|yet","never 放在 has 與 tried 之間。"],["I've lived in Taipei since I ___ ten.","was","was|were|am|has been","since 後接過去式 was。"],["The kid is reading the book, ___?","isn't she","does she|doesn't she|is she|isn't she","現在進行式肯定句用 isn't she。"],["It has been an hour ___ we called to report the fire.","since","when|since|though|for","since 接過去起始事件。"],["Marcus can't find his smartphone, can he? — ___","No, he can't","Yes, he can't|Yes, he doesn't|No, he can't|No, he can","否定回答為 No, he can't。"],["I ___ a sandwich an hour ago.","ate","eaten|ate|eat|has eaten","ago 搭配過去式 ate。"]],FI=[["Debra was using her laptop thirty minutes ago, ___?","wasn't she","過去進行式肯定句附加問句用 wasn't she。"],["They have waited in the restaurant ___ 3:30 p.m.","since","時間點用 since。"],["There is little they can do for her, ___?","is there","little 帶否定意義。"],["Tina lost her keys last night, ___?","didn't she","過去式肯定句用 didn't she。"],["He has practiced the dance ___ this Thursday.","since","起始時間點用 since。"],["Mary ___ Canada already, so she's not here now.","has gone to","尚未回來用 has gone to。"],["There will be many people here, ___?","won't there","There will be 的反意疑問句。"],["It has rained at least ___ a week.","for","一段時間用 for。"],["None would survive, ___?","would they","none 帶否定意義。"],["Olivia ___ South Korea once.","has been to","曾去過用 has been to。"],["I have lived here ___ 2020.","since","年份是時間點。"],["She has studied English ___ three years.","for","三年是一段時間。"],["He ___ finished his homework yet.","hasn't","yet 與否定現在完成式。"],["We have ___ eaten lunch.","already","already 常在 have 與過去分詞之間。"],["She ___ to school yesterday.","went","yesterday 搭配過去式 went。"],["There is a cat in the room, ___?","isn't there","肯定 there is 句型的附加問句。"],["You don't like tea, ___?","do you","否定句搭配肯定附加問句。"],["He has ___ to Japan twice.","been","去過又回來用 been。"],["I ___ a movie last night.","watched","last night 使用過去式。"],["How ___ have you known her?","long","詢問持續多久用 How long。"],["They have lived here ___ 2019.","since","2019 為起始時間。"],["She has ___ finished her work.","just","just 表剛剛。"],["He ___ his keys two hours ago.","lost","ago 使用過去式。"],["There were many students, ___?","weren't there","過去式 there were 的附加問句。"]];let chosen=[],startTime=0;function sample(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n)}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function start(){chosen=[...sample(MC,10).map(x=>({type:'mc',q:x[0],ans:x[1],opts:x[2].split('|').sort(()=>Math.random()-.5),why:x[3]})),...sample(FI,10).map(x=>({type:'fi',q:x[0],ans:x[1],why:x[2]}))];startTime=Date.now();document.getElementById('results').innerHTML='';document.getElementById('quiz').innerHTML='<h2>本回合 20 題</h2>'+chosen.map((x,i)=>'<div class="q"><b>'+(i+1)+'. '+esc(x.q)+'</b>'+(x.type==='mc'?x.opts.map(o=>'<label><input type="radio" name="q'+i+'" value="'+esc(o)+'"> '+esc(o)+'</label>').join(''):'<p><input id="q'+i+'" placeholder="請輸入英文答案"></p>')+'</div>').join('')+'<button onclick="grade()">交卷並查看詳解</button>';document.getElementById('quiz').scrollIntoView()}function norm(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').trim()}function grade(){let score=0,report=[];chosen.forEach((x,i)=>{let e=x.type==='mc'?document.querySelector('input[name=q'+i+']:checked'):document.getElementById('q'+i);let v=e?e.value:'';let ok=norm(v)===norm(x.ans);if(ok)score+=5;report.push({i:i+1,q:x.q,answer:v||'(未作答)',correct:x.ans,ok,why:x.why})});let record={student:document.getElementById('student').value.trim()||'Jasper',date:new Date().toLocaleString('zh-TW'),score,report};let history=JSON.parse(localStorage.getItem('jasperHistory')||'[]');history.unshift(record);localStorage.setItem('jasperHistory',JSON.stringify(history.slice(0,100)));window.latest=record;document.getElementById('results').innerHTML='<h2>本次成績：'+score+'/100</h2><button onclick="email()">寄給 Gary 教練</button><button onclick="historyView()">歷史紀錄</button>'+report.map(r=>'<div class="q"><b class="'+(r.ok?'ok':'bad')+'">'+(r.ok?'正確':'錯誤')+'｜'+r.i+'. '+esc(r.q)+'</b><p>你的答案：'+esc(r.answer)+'<br>正確答案：'+esc(r.correct)+'<br>中文詳解：'+esc(r.why)+'</p></div>').join('');document.getElementById('quiz').innerHTML='';document.getElementById('results').scrollIntoView()}function email(){if(!window.latest){alert('請先完成測驗');return}let r=window.latest;let body=r.student+'｜'+r.date+'｜'+r.score+'/100\n\n'+r.report.map(x=>x.i+'. '+x.q+'\n作答：'+x.answer+'；正解：'+x.correct+'；'+(x.ok?'正確':'錯誤')+'\n'+x.why).join('\n\n');location.href='mailto:godlovesyou127888@gmail.com?subject='+encodeURIComponent('Jasper 文法測驗成績 '+r.score+'/100')+'&body='+encodeURIComponent(body)}function historyView(){let h=JSON.parse(localStorage.getItem('jasperHistory')||'[]');document.getElementById('results').innerHTML='<h2>歷史成績（本裝置）</h2>'+(h.length?h.map(x=>'<p>'+esc(x.date)+'｜'+esc(x.student)+'｜<b>'+x.score+'/100</b></p>').join(''):'尚無紀錄');document.getElementById('results').scrollIntoView()}</script></main></html>
