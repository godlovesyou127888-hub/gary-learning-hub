<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AI情境對話陪練 MVP：本機規則引擎，旅遊與生活對話、慢速播放與回應提示。"><title>樂齡AI英文陪練</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#3e6070;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#527e91;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><nav aria-label="樂齡學習網站導覽" style="background:#e8f5ec;color:#163e30;border-bottom:2px solid #b7d7c2;padding:12px 16px;font:700 19px/1.6 system-ui,'Noto Sans TC',sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a href="/senior-learning-center/" style="display:inline-block;background:#246b4f;color:#fff;padding:10px 16px;min-height:50px;border-radius:10px;text-decoration:none">← 返回樂齡學習總站</a><a href="/" style="display:inline-block;background:#fff;color:#245c46;border:2px solid #9fcbb1;padding:8px 14px;min-height:50px;border-radius:10px;text-decoration:none">Gary Learning Hub</a></nav><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1AI%E8%8B%B1%E6%96%87%E9%99%AA%E7%B7%B4%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡AI英文陪練</h1><p>AI 情境陪練 MVP｜先用本機規則引擎練敢開口，不需登入、不上傳對話。</p></div></header><main>
<section class="card"><h2>選擇情境</h2><select id="scene"><option>餐廳</option><option>飯店</option><option>機場</option><option>購物</option><option>日常問候</option></select><button id="start">開始對話</button></section>
<section class="card"><h2>Conversation</h2><div id="chat"></div><label>你的英文回應<input id="input" placeholder="例如：I would like some water."></label><div class="actions"><button id="send">送出回應</button><button id="listen" class="secondary">聽對方慢速說</button></div><p class="muted">這個 MVP 使用本機關鍵字規則產生回應，不是外部大型語言模型。</p></section>
<section class="card"><h2>最近練習</h2><div id="history"></div></section>
<script>
const $=x=>document.getElementById(x);let turns=[],lastBot="";
const openers={餐廳:"Hello. Are you ready to order?",飯店:"Welcome. Do you have a reservation?",機場:"May I see your passport, please?",購物:"Hello. Can I help you?",日常問候:"Hello! How are you today?"};
function botFor(s,t){t=t.toLowerCase();if(s==="餐廳"){if(t.includes("water"))return "Certainly. Would you like anything else?";if(t.includes("like")||t.includes("order"))return "Great choice. Anything to drink?";return "Please tell me what you would like."}if(s==="飯店"){if(t.includes("reservation"))return "Thank you. May I have your name?";if(t.includes("key"))return "Certainly. Here is your room key.";return "How can I help you with your stay?"}if(s==="機場"){if(t.includes("passport"))return "Thank you. Do you have any bags to check?";if(t.includes("gate"))return "Your gate is shown on your boarding pass.";return "Please tell me what you need at the airport."}if(s==="購物"){if(t.includes("price")||t.includes("much"))return "It is twenty dollars.";if(t.includes("size"))return "Yes, we have a larger size.";return "What are you looking for?"}return t.includes("fine")||t.includes("good")?"I'm glad to hear that. What are you doing today?":"Nice to talk with you. Please tell me more."}
function add(role,text){turns.push({role,text});$("chat").innerHTML=turns.map(x=>'<div class="phrase"><b>'+x.role+'</b><br>'+x.text+'</div>').join("");}
$("start").onclick=()=>{turns=[];lastBot=openers[$("scene").value];add("AI Coach",lastBot)};$("send").onclick=()=>{const t=$("input").value.trim();if(!t)return;add("You",t);lastBot=botFor($("scene").value,t);add("AI Coach",lastBot);$("input").value="";let h=JSON.parse(localStorage.getItem("senior-ai-practice-history-v1")||"[]");h.unshift({date:new Date().toISOString(),scene:$("scene").value,turns:turns.length});localStorage.setItem("senior-ai-practice-history-v1",JSON.stringify(h.slice(0,20)));show()};$("listen").onclick=()=>{if(!lastBot)return;const u=new SpeechSynthesisUtterance(lastBot);u.lang="en-US";u.rate=.6;speechSynthesis.cancel();speechSynthesis.speak(u)};function show(){const h=JSON.parse(localStorage.getItem("senior-ai-practice-history-v1")||"[]");$("history").innerHTML=h.length?h.map(x=>'<p>'+new Date(x.date).toLocaleString()+'｜'+x.scene+'｜'+x.turns+' turns</p>').join(""):"尚無紀錄。"}show();
</script></main></body></html>
