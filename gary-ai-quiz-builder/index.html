<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="快速建立可作答、可自動計分的線上測驗 MVP。"><title>Gary AI Quiz Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#4a6481;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#4a6481;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20AI%20Quiz%20Builder%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary AI Quiz Builder</h1><p>快速建立可作答、可自動計分的線上測驗 MVP。</p></div></header><main><section class="card"><h2>測驗設定</h2><label>測驗名稱<input id="title" value="English Quick Quiz"></label><button id="build">建立 10 題測驗</button></section><section id="quizCard" class="card hidden"><h2 id="quizTitle"></h2><div id="quiz"></div><button id="submit">交卷</button></section><section id="result" class="card hidden"><h2>結果</h2><div id="score" class="output"></div><button id="download">下載 JSON</button></section></main><script>const $=x=>document.getElementById(x),bank=[["She ___ to school every day.",["go","goes","went","going"],1],["What does 'prepare' mean?",["準備","比較","忘記","離開"],0],["There ___ two books.",["is","are","am","be"],1],["How much ___ this?",["is","are","do","does"],0],["Can you ___ me?",["help","helps","helped","helping"],0],["I ___ TV last night.",["watch","watched","watches","watching"],1],["What does 'ticket' mean?",["票","飯店","醫生","車站"],0],["Where ___ the bathroom?",["is","are","do","does"],0],["He ___ like coffee.",["don't","doesn't","isn't","aren't"],1],["Please ___ slowly.",["speak","speaks","spoke","speaking"],0]];let res={};$("build").onclick=()=>{$("quizTitle").textContent=$("title").value;$("quiz").innerHTML=bank.map((q,i)=>'<div><p><b>Q'+(i+1)+'. '+q[0]+'</b></p>'+q[1].map((o,j)=>'<label><input type=radio name=q'+i+' value='+j+'> '+o+'</label>').join("")+'</div>').join("");$("quizCard").classList.remove("hidden")};$("submit").onclick=()=>{let s=0,ans=[];bank.forEach((q,i)=>{const el=document.querySelector('[name=q'+i+']:checked'),v=el?+el.value:null,ok=v===q[2];if(ok)s++;ans.push({question:q[0],chosen:v,answer:q[2],correct:ok})});res={title:$("title").value,date:new Date().toISOString(),score:s,total:bank.length,answers:ans};$("score").textContent="分數："+s+"/"+bank.length+"｜正確率："+Math.round(s/bank.length*100)+"%";$("result").classList.remove("hidden")};$("download").onclick=()=>{const b=new Blob([JSON.stringify(res,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="quiz-result.json";a.click();URL.revokeObjectURL(u)};</script></body></html>
