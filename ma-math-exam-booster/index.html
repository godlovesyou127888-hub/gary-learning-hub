<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="MA Math Exam Booster：數學考前衝刺，整合數學英文詞彙、計算、方程式、幾何與文字題，快速找出最後弱點。">
<title>MA Math Exam Booster</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#28313f;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#455267;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#5d6d86;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e8ecf2!important;color:#455267!important}.card{background:#fff;border:1px solid #e0e5eb;border-radius:16px;padding:20px;margin:16px 0}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.08em;color:#7b8798}.hidden{display:none}.q{padding:16px 0;border-top:1px solid #e8ecf1}.q:first-child{border-top:0}.q label{display:block;padding:8px 10px;border:1px solid #dfe4ea;border-radius:9px;margin:7px 0;font-weight:400}.q input{width:auto;margin-right:8px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9edf3;color:#455267;font-size:13px;font-weight:800;margin:2px}.feedback{white-space:pre-line;background:#f0f3f7;padding:12px;border-radius:9px;margin-top:10px}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric div{background:#fafbfc;border:1px solid #e2e6eb;border-radius:12px;padding:14px;text-align:center}.metric b{display:block;font-size:25px}.good{color:#047857}.bad{color:#b42318}.priority{padding:12px;border-left:5px solid #6e7d95;background:#f1f4f8;border-radius:10px}input[type=text],input[type=email],input[type=date]{width:100%;padding:10px;border:1px solid #c5ccd6;border-radius:9px;font:inherit}.muted{color:#6e7580;font-size:14px}@media(max-width:700px){.metric{grid-template-columns:1fr 1fr}.card{padding:14px}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}
</style>
</head>
<body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=MA%20Math%20Exam%20Booster%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank" rel="noopener">聯絡站長</a></div><h1>MA Math Exam Booster</h1><p>數學考前衝刺｜把最後時間用在最值得補的弱點，不再平均重做全部題目。</p></div></header>
<main>
<section class="card"><p class="eyebrow">01 · SETUP</p><h2>設定考試</h2><label>考試名稱<input id="examName" type="text" placeholder="例如：數學期中考"></label><label>考試日期<input id="examDate" type="date"></label><div class="actions" style="margin-top:14px"><button id="start">開始 20 題衝刺診斷</button><button id="retry" class="secondary">只重練錯題</button></div><p id="startStatus">先設定考試，再開始。</p></section>

<section id="quizCard" class="card hidden"><p class="eyebrow">02 · BOOST</p><h2>20 題數學考前混合題</h2><div id="quiz"></div><button id="submit">交卷並產生衝刺重點</button><p id="submitStatus"></p></section>

<section id="resultCard" class="card hidden"><p class="eyebrow">03 · FINAL REVIEW</p><h2>本次考前診斷</h2><div class="metric"><div><b id="score">0/20</b>分數</div><div><b id="accuracy">0%</b>正確率</div><div><b id="weakType">—</b>最弱類型</div><div><b id="wrongN">0</b>錯題</div></div><div id="priorityPlan" class="priority"></div><div id="typeSummary"></div><div id="review"></div></section>

<section id="deliveryCard" class="card hidden"><p class="eyebrow">04 · SAVE & COACH</p><h2>保存／交付</h2><label>姓名<input id="student" type="text" value="MA"></label><label>Email（選填）<input id="email" type="email"></label><div class="actions" style="margin-top:14px"><button id="download">下載 JSON</button><button id="print" class="secondary">列印／另存 PDF</button><button id="coach">寄給 Gary 教練（Gmail 草稿）</button></div><p class="muted">建議順序：先重做錯題 → 補最弱類型 → 再做一回新題確認穩定。</p><p id="deliveryStatus"></p></section>

<section class="card"><p class="eyebrow">05 · HISTORY</p><h2>最近考前紀錄</h2><div id="history">尚無紀錄。</div></section>
</main>
<script>
const bank=[
{t:"Vocabulary",q:"What does 'quotient' mean?",o:["商","和","差","面積"],a:0,en:"Quotient is the result of division.",zh:"quotient 是除法的結果，也就是「商」。"},
{t:"Vocabulary",q:"What does 'perimeter' mean?",o:["周長","面積","體積","角度"],a:0,en:"Perimeter is the total distance around a shape.",zh:"perimeter 是圖形外圍一圈的總長度。"},
{t:"Vocabulary",q:"What does 'remaining' mean in a word problem?",o:["剩下的","增加的","全部的","平均的"],a:0,en:"Remaining means what is left.",zh:"remaining 表示「剩下的」。"},
{t:"Vocabulary",q:"What is a 'numerator'?",o:["分子","分母","整數","小數"],a:0,en:"The numerator is the top number in a fraction.",zh:"numerator 是分數上方的分子。"},

{t:"Calculation",q:"What is 18 + 27?",o:["45","35","55","44"],a:0,en:"18 + 27 = 45.",zh:"18 + 27 = 45。"},
{t:"Calculation",q:"What is 72 ÷ 8?",o:["9","8","7","6"],a:0,en:"72 divided by 8 equals 9.",zh:"72 ÷ 8 = 9。"},
{t:"Calculation",q:"What is 15 × 6?",o:["90","80","75","96"],a:0,en:"15 × 6 = 90.",zh:"15 × 6 = 90。"},
{t:"Calculation",q:"What is 63 - 29?",o:["34","32","36","44"],a:0,en:"63 - 29 = 34.",zh:"63 - 29 = 34。"},

{t:"Equation",q:"Solve: x + 7 = 19",o:["12","11","13","10"],a:0,en:"Subtract 7 from both sides: x = 12.",zh:"兩邊都減 7，所以 x = 12。"},
{t:"Equation",q:"Solve: 3x = 21",o:["7","6","8","9"],a:0,en:"Divide both sides by 3: x = 7.",zh:"兩邊都除以 3，所以 x = 7。"},
{t:"Equation",q:"Solve: x - 5 = 14",o:["19","9","18","20"],a:0,en:"Add 5 to both sides: x = 19.",zh:"兩邊都加 5，所以 x = 19。"},
{t:"Equation",q:"Solve: 2x + 4 = 16",o:["6","5","8","10"],a:0,en:"Subtract 4, then divide by 2: x = 6.",zh:"先減 4 得 12，再除以 2，x = 6。"},

{t:"Geometry",q:"A rectangle is 5 cm long and 3 cm wide. What is its area?",o:["15 cm²","16 cm²","8 cm²","10 cm²"],a:0,en:"Area = length × width = 5 × 3 = 15.",zh:"長方形面積 = 長 × 寬 = 15 平方公分。"},
{t:"Geometry",q:"A square has side length 4 cm. What is its perimeter?",o:["16 cm","8 cm","12 cm","20 cm"],a:0,en:"Perimeter = 4 × side = 16 cm.",zh:"正方形周長 = 4 × 邊長 = 16 公分。"},
{t:"Geometry",q:"How many degrees are in a right angle?",o:["90°","45°","180°","360°"],a:0,en:"A right angle measures 90 degrees.",zh:"直角是 90 度。"},
{t:"Geometry",q:"Which pair of lines never meet?",o:["Parallel lines","Perpendicular lines","Intersecting lines","Curved lines"],a:0,en:"Parallel lines stay the same distance apart and never meet.",zh:"平行線保持等距且不相交。"},

{t:"Word Problem",q:"There are 4 bags with 6 apples in each bag. How many apples are there in total?",o:["24","10","20","28"],a:0,en:"4 groups of 6 means 4 × 6 = 24.",zh:"每袋 6 顆、共 4 袋，所以 4 × 6 = 24。"},
{t:"Word Problem",q:"MA has 35 stickers and gives away 12. How many remain?",o:["23","47","22","25"],a:0,en:"35 - 12 = 23.",zh:"剩下多少要用減法，35 - 12 = 23。"},
{t:"Word Problem",q:"A book costs NT$120. How much do 3 books cost?",o:["NT$360","NT$240","NT$123","NT$300"],a:0,en:"3 × 120 = 360.",zh:"3 本書，每本 120 元，所以 3 × 120 = 360 元。"},
{t:"Word Problem",q:"A class has 28 students. They form groups of 4. How many groups are there?",o:["7","6","8","24"],a:0,en:"28 ÷ 4 = 7.",zh:"每 4 人一組，所以 28 ÷ 4 = 7 組。"},
{t:"Word Problem",q:"Mia has 18 pencils. Leo has 11. How many more pencils does Mia have?",o:["7","29","6","8"],a:0,en:"How many more asks for the difference: 18 - 11 = 7.",zh:"how many more 是問差多少，所以 18 - 11 = 7。"},
{t:"Fraction",q:"Which fraction is equivalent to 1/2?",o:["2/4","1/3","3/5","4/5"],a:0,en:"2/4 simplifies to 1/2.",zh:"2/4 約分後等於 1/2。"},
{t:"Fraction",q:"Which is greater?",o:["3/4","2/4","They are equal","Cannot tell"],a:0,en:"3/4 is greater than 2/4.",zh:"分母相同時比較分子，3/4 大於 2/4。"},
{t:"Fraction",q:"What is 1/4 + 2/4?",o:["3/4","3/8","1/2","2/8"],a:0,en:"Same denominator: add numerators, 1 + 2 = 3.",zh:"同分母分數相加，分子相加，所以是 3/4。"}
];
const $=id=>document.getElementById(id);let current=[],results=[],wrong=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){return shuffle(bank).slice(0,20)}
function render(items){current=items;results=[];$("quiz").replaceChildren();items.forEach((q,i)=>{const d=document.createElement("div");d.className="q";let h='<span class="tag">'+q.t+'</span><p><b>Q'+(i+1)+'. '+q.q+'</b></p>';q.o.forEach((x,j)=>h+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+x+'</label>');d.innerHTML=h;$("quiz").append(d)});$("quizCard").classList.remove("hidden");$("resultCard").classList.add("hidden");$("deliveryCard").classList.add("hidden");$("submitStatus").textContent=""}
$("start").onclick=()=>{render(build());$("startStatus").textContent="已建立 20 題數學考前診斷。"};
$("retry").onclick=()=>{if(!wrong.length){$("startStatus").textContent="目前沒有上一回錯題可重練。";return}render(wrong.map(x=>x.q));$("startStatus").textContent="已載入上一回錯題。"};
$("submit").onclick=()=>{const missing=current.filter((q,i)=>!document.querySelector('input[name="q'+i+'"]:checked')).length;if(missing){$("submitStatus").textContent="還有 "+missing+" 題未作答。";return}let score=0;const by={};results=current.map((q,i)=>{if(!by[q.t])by[q.t]={c:0,t:0};by[q.t].t++;const selected=Number(document.querySelector('input[name="q'+i+'"]:checked').value),ok=selected===q.a;if(ok){score++;by[q.t].c++}return{q,selected,ok}});wrong=results.filter(x=>!x.ok);const weak=Object.keys(by).sort((a,b)=>(by[a].c/by[a].t)-(by[b].c/by[b].t))[0]||"無明顯弱點";$("score").textContent=score+"/"+current.length;$("accuracy").textContent=Math.round(score/current.length*100)+"%";$("weakType").textContent=weak;$("wrongN").textContent=wrong.length;const plan=score/current.length>=.9?"最後衝刺：只重做錯題與最弱類型，避免全面重讀。":score/current.length>=.75?"最後衝刺：先補 "+weak+"，再重做所有錯題，最後做一回新題確認。":"最後衝刺：先穩定 "+weak+" 的基本概念，再回頭處理綜合題；暫時不要再增加新題型。";$("priorityPlan").innerHTML="<b>"+plan+"</b>";$("typeSummary").innerHTML='<h3>各類表現</h3>'+Object.entries(by).map(([t,x])=>'<span class="tag">'+t+' '+x.c+'/'+x.t+'</span>').join("");$("review").replaceChildren();results.forEach((r,i)=>{const q=r.q,d=document.createElement("div");d.className="q";d.innerHTML='<h3 class="'+(r.ok?'good':'bad')+'">Q'+(i+1)+' '+(r.ok?'✓ Correct':'✗ Review')+'</h3><p><span class="tag">'+q.t+'</span> <b>'+q.q+'</b></p><p>你的答案：'+q.o[r.selected]+'<br>正確答案：'+q.o[q.a]+'</p><div class="feedback"><b>English explanation</b>\n'+q.en+'\n\n<b>中文詳解</b>\n'+q.zh+'</div>';$("review").append(d)});$("resultCard").classList.remove("hidden");$("deliveryCard").classList.remove("hidden");save(score,weak);$("resultCard").scrollIntoView({behavior:"smooth"})};
function snapshot(){const score=results.filter(x=>x.ok).length;return{site:"MA Math Exam Booster",version:"MVP V1",date:new Date().toISOString(),student:$("student").value.trim()||"MA",email:$("email").value.trim(),exam_name:$("examName").value.trim(),exam_date:$("examDate").value,score,total:current.length,accuracy:current.length?Math.round(score/current.length*100):0,items:results.map((r,i)=>({no:i+1,type:r.q.t,question:r.q.q,chosen:r.q.o[r.selected],answer:r.q.o[r.q.a],correct:r.ok,explanation_en:r.q.en,explanation_zh:r.q.zh}))}}
function save(score,weak){const key="ma-math-exam-booster-v1",arr=JSON.parse(localStorage.getItem(key)||"[]");arr.unshift({date:new Date().toISOString(),exam:$("examName").value.trim(),score,total:current.length,weak});localStorage.setItem(key,JSON.stringify(arr.slice(0,12)));showHistory()}
function showHistory(){const arr=JSON.parse(localStorage.getItem("ma-math-exam-booster-v1")||"[]");$("history").innerHTML=arr.length?arr.map(x=>'<p>'+new Date(x.date).toLocaleString()+'｜'+(x.exam||"未命名考試")+'｜'+x.score+'/'+x.total+'｜優先：'+x.weak+'</p>').join(""):"尚無紀錄。"}
function report(){const d=snapshot();return "MA Math Exam Booster\n學員："+d.student+"\nEmail："+d.email+"\n考試："+d.exam_name+"\n考試日期："+d.exam_date+"\n分數："+d.score+"/"+d.total+"（"+d.accuracy+"%）\n\n"+d.items.map(x=>x.no+". ["+x.type+"] "+x.question+"\n你的答案："+x.chosen+"\n正解："+x.answer+"｜"+(x.correct?"正確":"錯誤")).join("\n\n")}
$("download").onclick=()=>{const b=new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="ma-math-exam-booster-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$("deliveryStatus").textContent="已下載 JSON 備份。"};
$("print").onclick=()=>window.print();
$("coach").onclick=()=>{const d=snapshot(),subject="MA Math Exam Booster｜"+d.student+"｜"+d.score+"/"+d.total;window.open("https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su="+encodeURIComponent(subject)+"&body="+encodeURIComponent(report()),"_blank","noopener,noreferrer");$("deliveryStatus").textContent="已嘗試開啟 Gmail 草稿，請確認後手動傳送。"};
showHistory();
</script>
</body></html>
