<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>#51 IELTS Vocabulary & Collocation Lab</title><style>body{margin:0;background:#f2f7f4;color:#234337;font:18px/1.7 system-ui}header{background:#27634f;color:white;padding:26px}main,.wrap{max-width:910px;margin:auto;padding:14px}.card{background:white;border:1px solid #cee0d5;border-radius:15px;padding:20px;margin:18px 0}button,a.btn{display:inline-block;background:#27634f;color:white;border:0;border-radius:9px;padding:12px 16px;margin:5px;font:700 17px system-ui;text-decoration:none;cursor:pointer}.alt{background:#daede2;color:#245541}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid #9cbbac;border-radius:8px}label{display:block;margin:12px 0}.tip{background:#eaf5ee;padding:12px;border-radius:9px}.muted{color:#5a7167}@media print{header,button{display:none}}@media(max-width:600px){h1{font-size:28px}}</style></head><body><header><div class="wrap"><p>Gary Learning Hub · Roadmap #51 · MVP V1 測試版</p><h1>IELTS Vocabulary & Collocation Lab</h1><p>學術搭配詞：辨識 → 應用 → 錯誤診斷 → 間隔複習</p><a class="btn alt" href="/">回首頁</a><a class="btn alt" href="/roadmap/">Roadmap</a></div></header><main><section class="card"><h2>01｜搭配詞診斷</h2><label>主題<select id="topic"><option value="all">混合題</option><option value="education">教育</option><option value="environment">環境</option><option value="society">社會</option></select></label><button id="start">產生十題練習</button><div id="quiz"></div><button id="grade">批改並顯示解析</button><div id="result" role="status"></div></section><section class="card"><h2>02｜寫作應用</h2><p id="challenge" class="tip">完成診斷後選一個搭配詞寫出自己的英文句子。</p><label>你的英文例句<textarea id="sentence" rows="4" placeholder="Use the collocation in a meaningful sentence."></textarea></label><button id="saveSentence">保存應用句</button><p id="sentenceStatus" role="status"></p></section><section class="card"><h2>03｜錯誤庫與複習</h2><p id="summary"></p><div id="history"></div><button id="json">下載完整 JSON</button><button id="csv" class="alt">下載 CSV</button><button id="print" class="alt">列印／PDF</button><button id="reset" class="alt">清除本機紀錄</button><p class="muted">本站為自編練習，非 IELTS 官方考題或 Band 評分。資料只在本機儲存，尚未啟用教練寄送；下載檔需自行驗收。</p></section><section class="card"><h2>04｜Gary 教練校準</h2><p>搭配詞應重視語境、詞性及語意精準度，不建議只背難字。</p><a class="btn" href="/#contact">聯絡站長</a></section></main><script>
"use strict";
const ITEMS=[
["education","conduct research","make research","實施研究｜conduct research","Researchers conduct research to test hypotheses."],
["education","gain knowledge","take knowledge","獲得知識｜gain knowledge","Students gain knowledge through guided practice."],
["education","academic performance","academic performing","學業表現｜academic performance","Sleep can affect academic performance."],
["education","critical thinking","critical thoughting","批判思考｜critical thinking","Schools should encourage critical thinking."],
["environment","reduce emissions","decline emissions","減少排放｜reduce emissions","Public transport may reduce emissions."],
["environment","renewable energy","renewed energy","再生能源｜renewable energy","Renewable energy can diversify power supply."],
["environment","conserve resources","reserve resources","節約資源｜conserve resources","Effective policies help conserve resources."],
["environment","environmental impact","environment impactful","環境影響｜environmental impact","The project has an environmental impact."],
["society","raise awareness","lift awareness","提升意識｜raise awareness","Campaigns can raise awareness about public health."],
["society","social inequality","society unequal","社會不平等｜social inequality","Education can help address social inequality."],
["society","public services","public serving","公共服務｜public services","Reliable public services support communities."],
["society","employment opportunities","employ opportunities","就業機會｜employment opportunities","Training may expand employment opportunities."]
];const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),KEY="ielts_collocation_lab_v1";let state={attempts:[],sentences:[],errors:[]},current=[];try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&typeof x==="object")for(const k of Object.keys(state))if(Array.isArray(x[k]))state[k]=x[k]}catch{}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function start(){let pool=$("topic").value==="all"?ITEMS:ITEMS.filter(x=>x[0]===$("topic").value);current=shuffle(pool).slice(0,Math.min(10,pool.length));$("quiz").innerHTML=current.map((x,i)=>'<fieldset><legend>Q'+(i+1)+'｜選擇自然搭配詞</legend>'+shuffle([x[1],x[2]]).map(o=>'<label><input type="radio" name="q'+i+'" value="'+esc(o)+'"> '+esc(o)+'</label>').join("")+'</fieldset>').join("");$("result").textContent="請完成所有題目後批改。"}$("start").onclick=start;start();$("grade").onclick=()=>{if(!current.length)return;const answers=[];for(let i=0;i<current.length;i++){const e=document.querySelector('input[name=q'+i+']:checked');if(!e){$("result").textContent="請完成第 "+(i+1)+" 題。";return}answers.push(e.value)}let score=0,wrong=[];current.forEach((x,i)=>{if(answers[i]===x[1])score++;else wrong.push({term:x[1],chosen:answers[i],explanation:x[3],example:x[4],review_after:new Date(Date.now()+86400000).toISOString()})});state.attempts.unshift({id:"COL-"+Date.now(),date:new Date().toISOString(),topic:$("topic").value,score,total:current.length,answers:current.map((x,i)=>({correct:x[1],chosen:answers[i],explanation:x[3]}))});state.errors.unshift(...wrong);try{save()}catch{$("result").textContent="無法保存，請檢查瀏覽器儲存空間。";return}$("result").innerHTML='<p>正確 '+score+'/'+current.length+' 題；錯誤 '+wrong.length+' 題。</p>'+current.map((x,i)=>'<p>Q'+(i+1)+' '+(answers[i]===x[1]?'正確':'需訂正')+'｜'+esc(x[3])+'｜'+esc(x[4])+'</p>').join("");$("challenge").textContent="用 "+current[0][1]+" 寫一個符合真實語境的英文句子。";render()};
$("saveSentence").onclick=()=>{const s=$("sentence").value.trim();if(!/[a-z]/i.test(s)||s.split(/\s+/).length<5){$("sentenceStatus").textContent="請寫至少五個英文單字的句子。";return}state.sentences.unshift({id:"S-"+Date.now(),date:new Date().toISOString(),sentence:s});try{save();$("sentenceStatus").textContent="已保存；例句是否自然仍需人工判斷。";render()}catch{$("sentenceStatus").textContent="本機儲存失敗。"}};function render(){$("summary").textContent="練習 "+state.attempts.length+" 次｜例句 "+state.sentences.length+" 句｜待複習錯誤 "+state.errors.length+" 題";$("history").innerHTML=state.errors.slice(0,15).map(x=>'<div class="tip" style="margin:8px 0"><b>'+esc(x.term)+'</b>｜'+esc(x.explanation)+'<p>建議複習：'+esc(x.review_after.slice(0,10))+'</p></div>').join("")}render();
function download(data,name,mime){let u=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)}$("json").onclick=()=>download(JSON.stringify({type:"IELTS Vocabulary & Collocation Lab",exported_at:new Date().toISOString(),...state},null,2),"ielts-collocation-records.json","application/json;charset=utf-8");$("csv").onclick=()=>{const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"',rows=[["type","date","content"],...state.sentences.map(x=>["sentence",x.date,x.sentence]),...state.errors.map(x=>["error",x.review_after,x.term])];download("\uFEFF"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"ielts-collocation-records.csv","text/csv;charset=utf-8")};$("print").onclick=()=>window.print();$("reset").onclick=()=>{if(!confirm("清除本機所有紀錄？請先備份。"))return;state={attempts:[],sentences:[],errors:[]};localStorage.removeItem(KEY);render()};
</script></body></html>
