<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把模糊的評分標準轉成可觀察、可評量的 Rubric。"><title>Gary AI Rubric Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#66557c;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#66557c;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20AI%20Rubric%20Builder%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary AI Rubric Builder</h1><p>把模糊的評分標準轉成可觀察、可評量的 Rubric。</p></div></header><main><section class="card"><h2>Rubric 設定</h2><div class="grid"><label>任務<input id="task" value="英文口語情境演練"></label><label>等級<select id="levels"><option>3</option><option selected>4</option></select></label></div><label>評量面向<input id="criteria" value="內容正確,表達清楚,流暢度,情境完成度"></label><button id="generate">生成 Rubric</button></section><section class="card"><h2>Rubric</h2><div id="out" class="output"></div><button onclick="print()">列印／PDF</button></section></main><script>const $=x=>document.getElementById(x);$("generate").onclick=()=>{const cs=$("criteria").value.split(",").map(x=>x.trim()).filter(Boolean),lv=+$("levels").value,names=lv===4?["4 卓越","3 達標","2 發展中","1 需支持"]:["3 達標","2 發展中","1 需支持"];let s="任務："+$("task").value+"\n\n";cs.forEach(c=>{s+="【"+c+"】\n";names.forEach((n,i)=>s+=n+"："+(i===0?"能獨立、正確且穩定完成。":i===1?"大致正確，少量提示後可完成。":i===2?"部分完成，仍有明顯錯誤或需要多次提示。":"尚未能穩定完成，需要重新示範與分段支持。")+"\n");s+="\n"});$("out").textContent=s};$("generate").click();</script></body></html>
