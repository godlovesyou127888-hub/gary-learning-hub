<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多益｜T-PASS 核心診斷</title><script src="../core.js"></script><style id="s"></style></head><body><main class="wrap">
<section class="hero"><h1>多益｜T-PASS 核心診斷</h1><p>先找真正弱點，再決定下一步。12 題核心診斷。</p></section>
<section class="card"><div class="actions"><a class="btn outline" href="../">← 回多益首頁</a><a class="btn outline" href="../form-test/" target="_blank">表單測試</a></div></section>
<section class="card"><h2>① 基本資料</h2><div class="row"><input id="name" type="text" placeholder="姓名"><input id="email" type="email" placeholder="Email"><input id="current" type="text" inputmode="numeric" placeholder="目前 TOEIC 分數"><input id="target" type="text" inputmode="numeric" placeholder="目標分數"></div><div class="helper">表單可先單獨測試：<a href="../form-test/" target="_blank">開啟 FormSubmit 測試頁</a></div></section>
<section id="quiz" class="card"></section>
<section class="card"><h2>② 完成後保存與送出</h2><div class="actions"><button id="grade" type="button">① 完成 T-PASS 診斷</button><button id="pdf" class="secondary">下載／儲存 PDF</button><button id="dl" class="secondary">下載完整 JSON</button><button class="outline" onclick="reportProblem('T-PASS 核心診斷')">問題回報</button></div><div id="result"></div><div id="status" class="status pending">尚未送出</div>
<div id="deliveryOptions" style="display:none;margin-top:12px">
  <div class="helper"><b>寄送前提醒：</b>請先下載 PDF 或 JSON，確保結果已備份。</div>
  <div class="actions">
    <a class="btn" id="deliveryBridgeBtn" href="../form-test/?mode=assessment">A｜使用網站表單寄送</a>
    <button class="btn secondary" type="button" id="studentShareBtn">B｜使用學生 Email 寄送</button>
  </div>
</div><div class="helper"><b>下一步：</b>完成並確認 FormSubmit 成功後，進入 Part 5 文法診斷。</div><a class="btn secondary" href="../part5/">下一步：Part 5</a></section>
</main><script>
s.textContent=baseStyles();
const nameEl=document.getElementById("name");
const emailEl=document.getElementById("email");
const currentEl=document.getElementById("current");
const targetEl=document.getElementById("target");
const gradeBtn=document.getElementById("grade");
const pdfBtn=document.getElementById("pdf");
const dlBtn=document.getElementById("dl");
const resultEl=document.getElementById("result");
const statusEl=document.getElementById("status");
const quizEl=document.getElementById("quiz");
const Q=[
["TN-1","The report was submitted ___ time.",["in","on","at","from"],1,"Grammar"],
["TN-2","The company is looking for a highly ___ candidate.",["qualify","qualified","qualification","qualifyingly"],1,"Grammar"],
["TN-3","reusable 最接近哪一個意思？",["可重複使用的","不可使用的","重新付款的","非常昂貴的"],0,"Vocabulary"],
["TN-4","availability 最接近？",["可獲得性","責任","設備","建議"],0,"Vocabulary"],
["TN-5","Email: 'Please confirm attendance by noon.' 要求你做什麼？",["取消會議","中午前確認出席","下午付款","寄紙本"],1,"Reading"],
["TN-6","Notice: 'The lobby entrance is temporarily closed.' 代表？",["大廳入口暫時關閉","整棟大樓永久關閉","停車場開放","會議取消"],0,"Reading"],
["TN-7","If a speaker says 'fifteen', which number is correct?",["50","15","5","55"],1,"Listening"],
["TN-8","If you hear 'before Friday', when is the deadline?",["Friday 之後","Friday 之前","只有 Friday","下個月"],1,"Listening"],
["TN-9","Which is the noun?",["efficient","efficiently","efficiency","more efficient"],2,"Grammar"],
["TN-10","Which word best means '檢查'?",["inspect","expect","respect","suspect"],0,"Vocabulary"],
["TN-11","A memo says 'Employees must wear badges at all times.' 主旨？",["員工可選擇是否戴識別證","員工必須一直佩戴識別證","只有主管要戴","訪客不用登記"],1,"Reading"],
["TN-12","If you hear 'platform six', what detail should you catch?",["人物","地點號碼","價格","原因"],1,"Listening"]
];
quizEl.innerHTML='<h2>T-PASS｜12 題</h2>'+Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+q[1]+'</b>'+q[2].map((x,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"><span>'+x+'</span></label>').join('')+'</div>').join('');
function prepNativeDelivery(payload){
  savePendingDelivery(payload);
  const box=document.getElementById("deliveryOptions");
  if(box)box.style.display="block";
  statusEl.textContent="✅ 診斷完成並已保存在本機。請先下載 PDF 或 JSON，再選擇寄送方式。";
  statusEl.className="status ok";
}
async function shareWithStudentEmail(){
  const payload=loadPendingDelivery();
  if(!payload){alert("找不到診斷結果，請先完成診斷。");return}
  const text=buildMailMessage(payload)+"\n\n完整結果已另存 PDF／JSON。";
  try{
    if(navigator.share){
      await navigator.share({title:"T-PASS 診斷結果",text});
    }else{
      await navigator.clipboard.writeText(text);
      alert("結果內容已複製。請開啟學生自己的 Email，貼上後寄出。");
    }
  }catch(e){}
}

let last=null;
gradeBtn.onclick=()=>{if(!nameEl.value.trim()||!emailEl.value.trim()){alert("請先填姓名與 Email。");return}
const ans=Q.map((q,i)=>document.querySelector('input[name=q'+i+']:checked'));if(ans.some(x=>!x)){alert("請先完成全部 12 題。");return}
const details=Q.map((q,i)=>({question_id:q[0],question:q[1],student_answer:q[2][+ans[i].value],correct_answer:q[2][q[3]],is_correct:+ans[i].value===q[3],dimension:q[4]}));
const dims={};Q.forEach(q=>dims[q[4]]={correct:0,total:0});details.forEach(x=>{dims[x.dimension].total++;if(x.is_correct)dims[x.dimension].correct++});
const ranked=Object.entries(dims).map(([k,v])=>({dimension:k,pct:Math.round(v.correct/v.total*100),...v})).sort((a,b)=>a.pct-b.pct);const score=details.filter(x=>x.is_correct).length;
last={submission_id:uid("TPASS"),submitted_at:new Date().toISOString(),assessment_type:"多益 T-PASS 核心診斷",source_page:location.href,student_name:nameEl.value.trim(),email:emailEl.value.trim(),current_score:currentEl.value.trim(),target_score:targetEl.value.trim(),total_score:score+"/12",accuracy:Math.round(score/12*100)+"%",primary_weakness:ranked[0].dimension,secondary_weakness:ranked[1].dimension,summary:{dimension_scores:ranked},responses_json:details};
saveLocal("tpass_next_diagnostic_last",last);resultEl.innerHTML="<h2>結果："+score+"/12</h2><p>優先訓練："+ranked[0].dimension+"</p><p>第二弱項："+ranked[1].dimension+"</p>";prepNativeDelivery(last)};
pdfBtn.onclick=()=>openPdfReport(last||loadLocal("tpass_next_diagnostic_last"));
dlBtn.onclick=()=>downloadJSON("多益-TPASS-"+Date.now()+".json",last||loadLocal("tpass_next_diagnostic_last")||{note:"尚未完成診斷"});
document.getElementById("studentShareBtn").onclick=shareWithStudentEmail;

window.addEventListener("error",e=>{
  statusEl.textContent="⚠️ 程式錯誤："+(e.message||"unknown")+"。請截圖回報。";
  statusEl.className="status fail";
});
</script></body></html>
