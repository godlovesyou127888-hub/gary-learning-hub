<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多益｜Listening 聽力診斷</title><script src="../core.js"></script><style id="s"></style></head><body><main class="wrap">
<section class="hero"><h1>多益｜Listening 聽力診斷</h1><p>10 題、大按鈕播放、記錄播放次數。先測聲音，再開始作答。</p></section>
<section class="card"><div class="actions"><a class="btn outline" href="../">← 回多益首頁</a><a class="btn outline" href="../form-test/" target="_blank">表單測試</a></div></section>
<section class="card"><h2>① 先測試聲音</h2><button id="soundTest" class="audioBtn">▶ 播放測試音</button><label>播放速度<select id="speed" style="font-size:18px;padding:10px;border-radius:10px;margin-left:8px"><option value="0.75">慢速 0.75×</option><option value="0.82" selected>標準慢速 0.82×</option><option value="0.95">接近正常 0.95×</option></select></label><div id="soundStatus" class="helper">若沒有聲音，請先把手機靜音關閉、音量調高；仍無聲音時建議用 Safari 開啟。</div><div class="row"><input id="name" type="text" placeholder="姓名"><input id="email" type="email" placeholder="Email"></div><div class="helper">表單可先單獨測試：<a href="../form-test/" target="_blank">開啟 FormSubmit 測試頁</a></div></section>
<section id="quiz" class="card"></section>
<section class="card"><h2>② 完成後保存與送出</h2><div class="actions"><button id="grade" type="button">① 完成聽力診斷</button><button id="pdf" class="secondary">下載／儲存 PDF</button><button id="dl" class="secondary">下載完整 JSON</button><button class="outline" onclick="reportProblem('Listening')">問題回報</button></div><div id="result"></div><div id="status" class="status pending">尚未送出</div>
<div id="deliveryOptions" style="display:none;margin-top:12px">
  <div class="helper"><b>寄送前提醒：</b>請先下載 PDF 或 JSON，確保結果已備份。</div>
  <div class="actions">
    <a class="btn" id="deliveryBridgeBtn" href="../form-test/?mode=assessment">A｜使用網站表單寄送</a>
    <button class="btn secondary" type="button" id="studentShareBtn">B｜使用學生 Email 寄送</button>
  </div>
</div><div class="helper"><b>下一步：</b>三項診斷完成後，回首頁進行 Gary 教練解讀與 90-Day Planner。</div><a class="btn secondary" href="../">回流程首頁</a></section>
</main><script>
s.textContent=baseStyles();
const nameEl=document.getElementById("name");
const emailEl=document.getElementById("email");
const gradeBtn=document.getElementById("grade");
const pdfBtn=document.getElementById("pdf");
const dlBtn=document.getElementById("dl");
const resultEl=document.getElementById("result");
const statusEl=document.getElementById("status");
const quizEl=document.getElementById("quiz");
const soundTestBtn=document.getElementById("soundTest");
const soundStatusEl=document.getElementById("soundStatus");
const speedEl=document.getElementById("speed");
const Q=[
["LN-1","The meeting has been moved to three thirty.",["2:30","3:30","3:13","4:30"],1,"Time"],
["LN-2","Please leave the package at the front desk.",["front desk","warehouse","parking lot","meeting room"],0,"Key Detail"],
["LN-3","The train will depart from platform six.",["4","5","6","7"],2,"Number"],
["LN-4","Our office will be closed on Monday.",["Sunday","Monday","Tuesday","Friday"],1,"Day"],
["LN-5","Could you send me the revised invoice?",["invoice","schedule","contract","brochure"],0,"Object"],
["LN-6","The presentation starts after lunch.",["before lunch","after lunch","at breakfast","this evening"],1,"Sequence"],
["LN-7","Please call the supplier before noon.",["customer","supplier","manager","driver"],1,"Role"],
["LN-8","We need twenty-five copies for the workshop.",["15","20","25","50"],2,"Number"],
["LN-9","The elevator near the lobby is out of service.",["lobby","cafeteria","garage","roof"],0,"Location"],
["LN-10","Her flight was delayed because of heavy rain.",["traffic","snow","rain","maintenance"],2,"Cause"]
];
const plays=Array(Q.length).fill(0);
function speakText(text,idx=null){
  if(!("speechSynthesis" in window)){soundStatusEl.textContent="此瀏覽器不支援語音播放，請改用 Safari。";soundStatusEl.className="status fail";return}
  try{
    if(idx!==null)plays[idx]++;
    speechSynthesis.cancel();speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=Number(speedEl.value||0.82);u.pitch=1;
    const voices=speechSynthesis.getVoices();const v=voices.find(x=>/en-US/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;
    u.onstart=()=>{soundStatusEl.textContent="🔊 正在播放";soundStatusEl.className="status ok"};
    u.onend=()=>{soundStatusEl.textContent="✅ 播放完成";soundStatusEl.className="status ok"};
    u.onerror=()=>{soundStatusEl.textContent="⚠️ 播放失敗。請用 Safari 開啟或重新整理後再試。";soundStatusEl.className="status fail"};
    setTimeout(()=>speechSynthesis.speak(u),80);
  }catch(e){soundStatusEl.textContent="⚠️ 播放失敗："+e.message;soundStatusEl.className="status fail"}
}
soundTestBtn.onclick=()=>speakText("This is the T-PASS listening sound test.");
document.addEventListener("touchstart",()=>{try{speechSynthesis.resume()}catch(e){}},{once:true});
quizEl.innerHTML='<h2>Listening｜10 題</h2>'+Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. Listening</b><button class="audioBtn" type="button" onclick="speakText(Q['+i+'][1],'+i+')">▶ 播放題目</button>'+q[2].map((x,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"><span>'+x+'</span></label>').join('')+'</div>').join('');
function prepNativeDelivery(payload){
  savePendingDelivery(payload);
  const box=document.getElementById("deliveryOptions");
  if(box)box.style.display="block";
  statusEl.textContent="✅ 診斷完成並已保存在本機。請先下載 PDF 或 JSON，再選擇寄送方式。";
  statusEl.className="status ok";
}
async function shareWithStudentEmail(){
  const payload=loadPendingDelivery();
  if(!payload){alert("找不到診斷結果，請先完成診斷。");return}
  const text=buildMailMessage(payload)+"\n\n完整結果已另存 PDF／JSON。";
  try{
    if(navigator.share){
      await navigator.share({title:"T-PASS 診斷結果",text});
    }else{
      await navigator.clipboard.writeText(text);
      alert("結果內容已複製。請開啟學生自己的 Email，貼上後寄出。");
    }
  }catch(e){}
}

let last=null;
gradeBtn.onclick=()=>{if(!nameEl.value.trim()||!emailEl.value.trim()){alert("請先填姓名與 Email。");return}
const ans=Q.map((q,i)=>document.querySelector('input[name=q'+i+']:checked'));if(ans.some(x=>!x)){alert("請先完成全部 10 題。");return}
const details=Q.map((q,i)=>({question_id:q[0],student_answer:q[2][+ans[i].value],correct_answer:q[2][q[3]],is_correct:+ans[i].value===q[3],dimension:q[4],plays:plays[i],accent:"en-US",speed:Number(speedEl.value||0.82)}));
const score=details.filter(x=>x.is_correct).length;const errs={};details.filter(x=>!x.is_correct).forEach(x=>errs[x.dimension]=(errs[x.dimension]||0)+1);const ranked=Object.entries(errs).sort((a,b)=>b[1]-a[1]);
const primary=ranked[0]?.[0]||"無明顯弱點";const secondary=ranked[1]?.[0]||"";
last={submission_id:uid("LST"),submitted_at:new Date().toISOString(),assessment_type:"多益 Listening 聽力診斷",source_page:location.href,student_name:nameEl.value.trim(),email:emailEl.value.trim(),total_score:score+"/10",accuracy:Math.round(score*10)+"%",primary_weakness:primary,secondary_weakness:secondary,summary:"Listening 聽力診斷",responses_json:details};
saveLocal("tpass_next_listening_last",last);resultEl.innerHTML="<h2>結果："+score+"/10</h2><p>正確率："+last.accuracy+"</p><p>主要弱點："+primary+"</p>";prepNativeDelivery(last)};
pdfBtn.onclick=()=>openPdfReport(last||loadLocal("tpass_next_listening_last"));
dlBtn.onclick=()=>downloadJSON("多益-Listening-"+Date.now()+".json",last||loadLocal("tpass_next_listening_last")||{note:"尚未完成診斷"});
document.getElementById("studentShareBtn").onclick=shareWithStudentEmail;

window.addEventListener("error",e=>{
  statusEl.textContent="⚠️ 程式錯誤："+(e.message||"unknown")+"。請截圖回報。";
  statusEl.className="status fail";
});
</script></body></html>
