<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-PASS NEXT｜Listening</title><script src="../core.js"></script><style id="s"></style></head><body><main class="wrap"><div class="card"><h1>T-PASS NEXT｜Listening 听力诊断</h1><p class="muted">新版独立站。使用浏览器语音播放 10 题；记录答案与播放次数。</p><div class="row"><input id="name" placeholder="姓名"><input id="email" type="email" placeholder="Email"></div></div><div id="quiz" class="card"></div><div class="card"><button id="grade">完成听力诊断并保存</button><button id="dl" class="secondary">下载完整结果 JSON</button><div id="result"></div><div id="status" class="status pending">尚未送出</div></div></main><script>
s.textContent=baseStyles();
const Q=[
["LN-1","The meeting has been moved to three thirty.",["2:30","3:30","3:13","4:30"],1,"Time"],
["LN-2","Please leave the package at the front desk.",["front desk","warehouse","parking lot","meeting room"],0,"Key Detail"],
["LN-3","The train will depart from platform six.",["4","5","6","7"],2,"Number"],
["LN-4","Our office will be closed on Monday.",["Sunday","Monday","Tuesday","Friday"],1,"Day"],
["LN-5","Could you send me the revised invoice?",["invoice","schedule","contract","brochure"],0,"Object"],
["LN-6","The presentation starts after lunch.",["before lunch","after lunch","at breakfast","this evening"],1,"Sequence"],
["LN-7","Please call the supplier before noon.",["customer","supplier","manager","driver"],1,"Role"],
["LN-8","We need twenty-five copies for the workshop.",["15","20","25","50"],2,"Number"],
["LN-9","The elevator near the lobby is out of service.",["lobby","cafeteria","garage","roof"],0,"Location"],
["LN-10","Her flight was delayed because of heavy rain.",["traffic","snow","rain","maintenance"],2,"Cause"]
];
const plays=Array(Q.length).fill(0);
function speak(i){plays[i]++;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(Q[i][1]);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}
quiz.innerHTML=Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. Listening</b><p><button type="button" onclick="speak('+i+')">▶ 播放题目</button></p>'+q[2].map((x,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+x+'</label>').join('')+'</div>').join('');
let last=null;grade.onclick=async()=>{if(!name.value.trim()||!email.value.trim()){alert("请填写姓名与 Email");return}const ans=Q.map((q,i)=>document.querySelector('input[name=q'+i+']:checked'));if(ans.some(x=>!x)){alert("请完成全部 10 题");return}
const details=Q.map((q,i)=>({question_id:q[0],student_answer:q[2][+ans[i].value],correct_answer:q[2][q[3]],is_correct:+ans[i].value===q[3],dimension:q[4],plays:plays[i],accent:"en-US",speed:.9}));const score=details.filter(x=>x.is_correct).length;const errs={};details.filter(x=>!x.is_correct).forEach(x=>errs[x.dimension]=(errs[x.dimension]||0)+1);const primary=Object.entries(errs).sort((a,b)=>b[1]-a[1])[0]?.[0]||"无明显弱点";
last={submission_id:uid("LST"),submitted_at:new Date().toISOString(),assessment_type:"T-PASS NEXT Listening",source_page:location.href,student_name:name.value.trim(),email:email.value.trim(),total_score:score+"/10",accuracy:Math.round(score*10)+"%",primary_weakness:primary,secondary_weakness:"",summary:"Listening 新版诊断",responses_json:details};result.innerHTML="<h2>"+score+"/10</h2><p>主要弱点："+primary+"</p>";await submitResult(last,status)};
dl.onclick=()=>downloadJSON("tpass-next-listening-"+Date.now()+".json",last||{note:"尚未完成诊断"});
</script></body></html>
