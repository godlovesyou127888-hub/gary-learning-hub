<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-PASS NEXT｜Part 5</title><script src="../core.js"></script><style id="s"></style></head><body><main class="wrap"><div class="card"><h1>T-PASS NEXT｜Part 5 文法诊断</h1><p class="muted">新版独立站。10 题；逐题记录；本机先保存，再尝试线上送出。</p><div class="row"><input id="name" placeholder="姓名"><input id="email" type="email" placeholder="Email"></div></div><div id="quiz" class="card"></div><div class="card"><button id="grade">完成诊断并保存</button><button id="dl" class="secondary">下载完整结果 JSON</button><div id="result"></div><div id="status" class="status pending">尚未送出</div></div></main><script>
s.textContent=baseStyles();
const Q=[
["P5N-1","The manager asked the team to submit the report ___ Friday.",["at","by","from","during"],1,"Preposition"],
["P5N-2","The new policy is expected to improve operational ___.",["efficient","efficiency","efficiently","efficiencies"],1,"Part of Speech"],
["P5N-3","Customers who wish to cancel must provide written ___.",["notify","notification","notifying","notified"],1,"Word Form"],
["P5N-4","The conference room ___ before the guests arrived.",["prepared","was prepared","has preparing","prepares"],1,"Voice"],
["P5N-5","Ms. Lin will contact you as soon as the schedule ___.",["confirms","is confirmed","confirming","confirmation"],1,"Clause"],
["P5N-6","The shipment was delayed ___ severe weather.",["because","because of","although","despite of"],1,"Connector"],
["P5N-7","All applicants must be ___ qualified for the position.",["high","higher","highly","highest"],2,"Adverb"],
["P5N-8","The company plans ___ two additional branches next year.",["open","to open","opening to","opened"],1,"Verb Pattern"],
["P5N-9","Please review the contract ___ before signing it.",["care","careful","carefully","caring"],2,"Part of Speech"],
["P5N-10","Neither the director nor the assistants ___ available yesterday.",["was","were","is","be"],1,"Agreement"]
];
quiz.innerHTML=Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+q[1]+'</b>'+q[2].map((x,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+x+'</label>').join('')+'</div>').join('');
let last=null; const key="tpass_next_part5_draft"; const draft=loadLocal(key)||{}; name.value=draft.name||"";email.value=draft.email||"";
document.addEventListener("change",()=>saveLocal(key,{name:name.value,email:email.value,answers:Q.map((q,i)=>document.querySelector('input[name=q'+i+']:checked')?.value??null)}));
(draft.answers||[]).forEach((v,i)=>{if(v!=null){const el=document.querySelector('input[name=q'+i+'][value="'+v+'"]');if(el)el.checked=true}});
grade.onclick=async()=>{if(!name.value.trim()||!email.value.trim()){alert("请填写姓名与 Email");return}const ans=Q.map((q,i)=>document.querySelector('input[name=q'+i+']:checked'));if(ans.some(x=>!x)){alert("请完成全部 10 题");return}
const details=Q.map((q,i)=>({question_id:q[0],question:q[1],student_answer:q[2][+ans[i].value],correct_answer:q[2][q[3]],is_correct:+ans[i].value===q[3],skill:q[4]}));const score=details.filter(x=>x.is_correct).length;const errs={};details.filter(x=>!x.is_correct).forEach(x=>errs[x.skill]=(errs[x.skill]||0)+1);const primary=Object.entries(errs).sort((a,b)=>b[1]-a[1])[0]?.[0]||"无明显弱点";
last={submission_id:uid("P5"),submitted_at:new Date().toISOString(),assessment_type:"T-PASS NEXT Part 5",source_page:location.href,student_name:name.value.trim(),email:email.value.trim(),total_score:score+"/10",accuracy:Math.round(score*10)+"%",primary_weakness:primary,secondary_weakness:"",summary:"Part 5 新版诊断",responses_json:details};result.innerHTML="<h2>"+score+"/10</h2><p>主要弱点："+primary+"</p>";await submitResult(last,status)};
dl.onclick=()=>{if(!last)last=loadLocal(key);downloadJSON("tpass-next-part5-"+Date.now()+".json",last||{note:"尚未完成诊断"})};
</script></body></html>
