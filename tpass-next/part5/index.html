<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樂齡多益｜Part 5 文法診斷</title><script src="../core.js"></script><style id="s"></style></head><body><main class="wrap">
<section class="hero"><h1>樂齡多益｜Part 5 文法診斷</h1><p>10 題、逐題記錄、先保存再送出。大字版手機介面。</p></section>
<section class="card"><div class="actions"><a class="btn outline" href="../">← 回樂齡多益首頁</a><a class="btn outline" href="../form-test/" target="_blank">表單測試</a></div></section>
<section class="card"><h2>① 填寫基本資料</h2><div class="row"><input id="name" type="text" placeholder="姓名"><input id="email" type="email" placeholder="Email"></div><div class="helper">先做表單測試：<a href="../form-test/" target="_blank">開啟「FormSubmit 單獨測試頁」</a></div></section>
<section id="quiz" class="card"></section>
<section class="card"><h2>② 完成後保存與送出</h2><div class="actions"><button id="grade" type="button">① 完成診斷</button><button id="pdf" class="secondary">下載／儲存 PDF</button><button id="dl" class="secondary">下載完整 JSON</button><button class="outline" onclick="reportProblem('Part 5')">問題回報</button></div><div id="result"></div><div id="status" class="status pending">尚未送出</div><form id="nativeDeliveryForm" action="https://formsubmit.co/43c5627bc898e872509ffd1b6aa8d728" method="POST" target="_blank" style="margin-top:12px">
<input type="hidden" name="_subject" value="[T-PASS NEXT] Assessment Result">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="test_type" value="T-PASS NEXT Formal Assessment">
<label style="display:block;margin-top:10px">姓名
<input name="name" id="nativeName" readonly>
</label>
<label style="display:block;margin-top:10px">Email
<input name="email" id="nativeEmail" type="email" readonly>
</label>
<label style="display:block;margin-top:10px">結果摘要
<textarea name="test_message" id="nativeMessage" readonly style="width:100%;min-height:180px;padding:12px;border:2px solid #cfe0d1;border-radius:12px;font-size:16px"></textarea>
</label>
<button class="btn" type="submit" id="nativeSubmitBtn" disabled>② 寄送結果</button>
</form><div class="helper"><b>下一步：</b>確認送出成功後，進入 Listening 聽力診斷。</div><a class="btn secondary" href="../listening/">下一步：Listening</a></section>
</main><script>
s.textContent=baseStyles();
const nameEl=document.getElementById("name");
const emailEl=document.getElementById("email");
const gradeBtn=document.getElementById("grade");
const pdfBtn=document.getElementById("pdf");
const dlBtn=document.getElementById("dl");
const resultEl=document.getElementById("result");
const statusEl=document.getElementById("status");
const quizEl=document.getElementById("quiz");
const Q=[
["P5N-1","The manager asked the team to submit the report ___ Friday.",["at","by","from","during"],1,"Preposition"],
["P5N-2","The new policy is expected to improve operational ___.",["efficient","efficiency","efficiently","efficiencies"],1,"Part of Speech"],
["P5N-3","Customers who wish to cancel must provide written ___.",["notify","notification","notifying","notified"],1,"Word Form"],
["P5N-4","The conference room ___ before the guests arrived.",["prepared","was prepared","has preparing","prepares"],1,"Voice"],
["P5N-5","Ms. Lin will contact you as soon as the schedule ___.",["confirms","is confirmed","confirming","confirmation"],1,"Clause"],
["P5N-6","The shipment was delayed ___ severe weather.",["because","because of","although","despite of"],1,"Connector"],
["P5N-7","All applicants must be ___ qualified for the position.",["high","higher","highly","highest"],2,"Adverb"],
["P5N-8","The company plans ___ two additional branches next year.",["open","to open","opening to","opened"],1,"Verb Pattern"],
["P5N-9","Please review the contract ___ before signing it.",["care","careful","carefully","caring"],2,"Part of Speech"],
["P5N-10","Neither the director nor the assistants ___ available yesterday.",["was","were","is","be"],1,"Agreement"]
];
quizEl.innerHTML='<h2>Part 5｜10 題</h2>'+Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+q[1]+'</b>'+q[2].map((x,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"><span>'+x+'</span></label>').join('')+'</div>').join('');
function prepNativeDelivery(payload){
    document.getElementById("nativeName").value=payload.student_name||"";
  document.getElementById("nativeEmail").value=payload.email||"";
  document.getElementById("nativeMessage").value=buildMailMessage(payload);
  document.getElementById("nativeSubmitBtn").disabled=false;
  statusEl.textContent="✅ 診斷完成並已保存在本機。請按「② 寄送結果」完成 Email 傳送。";
  statusEl.className="status ok";
}

let last=null;const key="tpass_next_part5_draft";const draft=loadLocal(key)||{};nameEl.value=draft.name||"";emailEl.value=draft.email||"";
(draft.answers||[]).forEach((v,i)=>{if(v!=null){const el=document.querySelector('input[name=q'+i+'][value="'+v+'"]');if(el)el.checked=true}});
document.addEventListener("change",()=>saveLocal(key,{name:nameEl.value,email:emailEl.value,answers:Q.map((q,i)=>document.querySelector('input[name=q'+i+']:checked')?.value??null)}));
gradeBtn.onclick=()=>{if(!nameEl.value.trim()||!emailEl.value.trim()){alert("請先填姓名與 Email。");return}
const ans=Q.map((q,i)=>document.querySelector('input[name=q'+i+']:checked'));if(ans.some(x=>!x)){alert("請先完成全部 10 題。");return}
const details=Q.map((q,i)=>({question_id:q[0],question:q[1],student_answer:q[2][+ans[i].value],correct_answer:q[2][q[3]],is_correct:+ans[i].value===q[3],skill:q[4]}));
const score=details.filter(x=>x.is_correct).length;const errs={};details.filter(x=>!x.is_correct).forEach(x=>errs[x.skill]=(errs[x.skill]||0)+1);
const ranked=Object.entries(errs).sort((a,b)=>b[1]-a[1]);const primary=ranked[0]?.[0]||"無明顯弱點";const secondary=ranked[1]?.[0]||"";
last={submission_id:uid("P5"),submitted_at:new Date().toISOString(),assessment_type:"樂齡多益 Part 5 文法診斷",source_page:location.href,student_name:nameEl.value.trim(),email:emailEl.value.trim(),total_score:score+"/10",accuracy:Math.round(score*10)+"%",primary_weakness:primary,secondary_weakness:secondary,summary:"Part 5 文法診斷",responses_json:details};
saveLocal("tpass_next_part5_last",last);resultEl.innerHTML="<h2>結果："+score+"/10</h2><p>正確率："+last.accuracy+"</p><p>主要弱點："+primary+"</p>";prepNativeDelivery(last)};
pdfBtn.onclick=()=>openPdfReport(last||loadLocal("tpass_next_part5_last"));
dlBtn.onclick=()=>downloadJSON("樂齡多益-Part5-"+Date.now()+".json",last||loadLocal("tpass_next_part5_last")||{note:"尚未完成診斷"});

window.addEventListener("error",e=>{
  statusEl.textContent="⚠️ 程式錯誤："+(e.message||"unknown")+"。請截圖回報。";
  statusEl.className="status fail";
});
</script></body></html>
