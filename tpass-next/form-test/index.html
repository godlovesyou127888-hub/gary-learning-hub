<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>結果寄送｜多益</title><script src="../core.js?v=20261101-bridge-v10"></script><style id="s"></style></head><body><main class="wrap">
<section class="hero"><h1 id="pageTitle">Google Apps Script 單獨測試</h1><p id="pageLead">不做測驗，只確認資料能不能真正送達。</p></section>
<section class="card"><h2 id="stepTitle">只做這一步</h2><p class="muted" id="stepText">填姓名與 Email → 按「送出測試」→ 會開啟 Google Apps Script 新頁面。看到成功頁面才算送達。</p>
<form id="deliveryForm" action="https://script.google.com/macros/s/AKfycbwyb8pphHtOR_oyMu5ICKAYaGZxmWad_3CjX_BchY0PF71tIiuB8KM85utE6Qj27AWK/exec" method="POST" target="_self">
<input type="hidden" name="test_type" id="typeField" value="T-PASS NEXT Google Apps Script Direct POST"><input type="hidden" name="delivery_token" id="tokenField"><input type="hidden" name="submission_id" id="submissionField"><input type="hidden" name="source_page" id="sourceField"><input type="hidden" name="assessment_type" id="assessmentTypeField"><input type="hidden" name="student_name" id="studentNameField"><input type="hidden" name="current_score" id="currentScoreField"><input type="hidden" name="target_score" id="targetScoreField"><input type="hidden" name="total_score" id="totalScoreField"><input type="hidden" name="accuracy" id="accuracyField"><input type="hidden" name="primary_weakness" id="primaryWeaknessField"><input type="hidden" name="secondary_weakness" id="secondaryWeaknessField"><input type="hidden" name="summary" id="summaryField"><input type="hidden" name="responses_json" id="responsesJsonField"><input type="hidden" name="submitted_at" id="submittedAtField">
<div class="row"><input id="nameField" name="name" required placeholder="姓名"><input id="emailField" name="email" type="email" required placeholder="Email"></div>
<label style="display:block;margin-top:12px">送出內容
<textarea id="messageField" name="test_message" required style="width:100%;min-height:220px;padding:12px;border:2px solid #cfe0d1;border-radius:12px;font-size:16px"></textarea>
</label>
<button id="submitBtn" type="submit">送出測試</button></form>
<div class="helper" id="deliveryMeta">尚未載入資料。</div><div class="helper" id="lifecycleBox"><b>寄送狀態：</b>尚未建立。</div><div class="helper" id="helper">送出後請回來告訴我：<b>成功</b>、<b>失敗</b>，或直接貼錯誤畫面。</div>
</section></main><script>
s.textContent=baseStyles();

const p=new URLSearchParams(location.search);
const mode=p.get("mode")||"standalone";
const deliveryToken=p.get("token")||"";
const src=p.get("src")||"";
const isAssessment=mode==="assessment";
const isSylviaIELTS=src==="sylvia-ielts-v2";

function setStandaloneMode(){
  pageTitle.textContent="Google Apps Script 單獨測試";
  pageLead.textContent="不做測驗，只確認資料能不能真正送達。";
  stepTitle.textContent="只做這一步";
  stepText.textContent="填姓名與 Email → 按「送出測試」→ 本頁直接前往 Google Apps Script → 等待寄送完成 → 看到成功頁面。";
  submitBtn.textContent="送出測試";
  typeField.value="T-PASS NEXT Google Apps Script Direct POST";
  assessmentTypeField.value="T-PASS NEXT Google Apps Script Direct POST";
  studentNameField.value=nameField.value||"";
  summaryField.value="如果收到這筆資料，代表 Google Apps Script 寄送通道正常。";
  responsesJsonField.value="[]";
  submittedAtField.value=new Date().toISOString();
  messageField.value="如果收到這筆資料，代表 Google Apps Script 寄送通道正常。";
  deliveryMeta.innerHTML="<b>模式：</b>Google Apps Script 單獨通道測試";
  lifecycleBox.innerHTML="<b>寄送狀態：</b>等待手動送出";
  helper.innerHTML="這個模式只測試 Google Apps Script 通道，不代表任何正式測驗資料已載入。";
}

function safeSourceLink(data){
  try{
    const u=new URL(data?.source_page||"",location.origin);
    if(u.origin===location.origin)return '<a class="btn outline" href="'+u.href+'">← 回原測驗重新產生</a>';
  }catch(e){}
  return '<a class="btn outline" href="/tpass-toeic-command-center/">← 回到 TOEIC Command Center</a>';
}

function setAssessmentMode(){
  const data=deliveryToken?loadTokenizedDelivery(deliveryToken):loadPendingDelivery();

  if(isSylviaIELTS){
    deliveryForm.target="_self";
    
    pageTitle.textContent="Sylvia IELTS｜寄送 Writing 作業";
    pageLead.textContent="完成寄送後會回到 Sylvia IELTS Command Center。";
    stepTitle.textContent="最後一步：寄送 Writing 作業";
    stepText.textContent="確認資料後按「寄送 Writing 作業」。";
    submitBtn.textContent="寄送 Writing 作業";
    typeField.value="Sylvia IELTS Writing via Proven Bridge";
  }else{
    deliveryForm.target="_self";
    
    
    pageTitle.textContent="多益｜寄送診斷結果";
    pageLead.textContent="已載入本次測驗資料；本頁將直接交給 Google Apps Script 處理，不再經過新分頁或 JavaScript 轉送。";
    stepTitle.textContent="最後一步：寄送結果";
    stepText.textContent="確認資料後按「寄送診斷結果」。頁面會直接前往 Google Apps Script；請等待寄送完成並看到成功頁面。";
    submitBtn.textContent="寄送診斷結果";
    typeField.value="T-PASS NEXT Formal Assessment via Proven Bridge";
  }

  if(!data){
    nameField.value="";
    emailField.value="";
    messageField.value="找不到待寄送的測驗資料。請回原測驗頁重新按一次「準備並前往寄送頁」。";
    submitBtn.disabled=true;
    deliveryMeta.innerHTML="<b style='color:#b42318'>❌ 找不到待寄送資料</b><br>可能原因：網址缺少 token、資料已被清除，或不是從原測驗頁進入。";
    lifecycleBox.innerHTML="<b>寄送狀態：</b>資料未載入";
    helper.innerHTML='<a class="btn outline" href="/tpass-toeic-command-center/">← 回到 TOEIC Command Center</a>';
    return;
  }

  const validation=validateDeliveryPayload(data);
  if(!validation.ok){
    messageField.value="資料不完整，請回原測驗頁重新產生寄送資料。";
    submitBtn.disabled=true;
    deliveryMeta.innerHTML="<b style='color:#b42318'>❌ 寄送資料不完整</b><br>缺少欄位："+validation.missing.join("、");
    lifecycleBox.innerHTML="<b>寄送狀態：</b>資料驗證失敗";
    helper.innerHTML=safeSourceLink(data);
    return;
  }
  const age=pendingAgeMinutes(data);
  const stale=age!=null && age>120;

  
  tokenField.value=deliveryToken||data._delivery_token||"";
  submissionField.value=data.submission_id||"";
  sourceField.value=data.source_page||"";
  nameField.value=data.student_name||"";
  emailField.value=data.email||"";
  assessmentTypeField.value=data.assessment_type||"";
  studentNameField.value=data.student_name||"";
  currentScoreField.value=data.current_score||"";
  targetScoreField.value=data.target_score||"";
  totalScoreField.value=data.total_score||"";
  accuracyField.value=data.accuracy||"";
  primaryWeaknessField.value=data.primary_weakness||"";
  secondaryWeaknessField.value=data.secondary_weakness||"";
  summaryField.value=data.summary||buildMailMessage(data);
  responsesJsonField.value=JSON.stringify(Array.isArray(data.responses_json)?data.responses_json:[]);
  submittedAtField.value=data.submitted_at||data._saved_at||new Date().toISOString();
  
  messageField.value=buildMailMessage(data)+(tokenField.value?"\n\nDelivery Token："+tokenField.value:"");

  const st=tokenField.value?getDeliveryStatus(tokenField.value):null;
  const statusText=st?.status==="gmail_verified"
    ?"Gmail 已確認收到"
    :st?.status==="attempted_to_formsubmit"
      ?"已嘗試送往 Google Apps Script（可重試）"
      :"已產生資料";

  lifecycleBox.innerHTML="<b>寄送狀態：</b>"+statusText+
    "<br><span style='font-size:14px'>Gmail 是否收到仍以實際收件為最終驗收。</span>";

  deliveryMeta.innerHTML=
    "<b>資料來源：</b>"+(src||"未標示")+
    "<br><b>測驗：</b>"+(data.assessment_type||"")+
    "<br><b>Submission ID：</b>"+(data.submission_id||"未提供")+
    (tokenField.value?"<br><b>Delivery Token：</b>"+tokenField.value:"")+
    "<br><b>資料時間：</b>"+(data._saved_at||data.submitted_at||"未提供")+
    "<br><b>內容長度：</b>"+messageField.value.length+" 字元";

  if(stale){
    submitBtn.disabled=true;
    submitBtn.textContent="資料超過 120 分鐘，請重新產生";
    deliveryMeta.innerHTML+="<br><b style='color:#b42318'>⚠ 資料已過期，請回原測驗頁重新準備寄送。</b>";
    helper.innerHTML=safeSourceLink(data);
    return;
  }

  if(tokenField.value && wasDeliverySubmitted(tokenField.value)){
    submitBtn.disabled=true;
    submitBtn.textContent="這筆資料已送出";
    helper.innerHTML='這個 Delivery Token 已有送出紀錄。若需重新測驗，請回原測驗頁重新產生一筆新資料。 <a class="btn outline" href="/tpass-toeic-command-center/">回 Command Center</a>';
    return;
  }

  const syncNetworkState=()=>{
    if(!navigator.onLine){
      submitBtn.disabled=true;
      lifecycleBox.innerHTML="<b>寄送狀態：</b>目前離線<br><span style='font-size:14px'>請恢復網路後再送出。</span>";
    }else if(!wasDeliverySubmitted(tokenField.value)){
      submitBtn.disabled=false;
    }
  };
  window.addEventListener("offline",syncNetworkState);
  window.addEventListener("online",syncNetworkState);
  syncNetworkState();

  // Reliability rule: do not intercept, delay, fetch, disable, or redirect this submit.
  // The browser performs one plain native POST directly to Google Apps Script.
  deliveryForm.addEventListener("submit",()=>{
    lifecycleBox.innerHTML="<b>寄送狀態：</b>正在送往 Google Apps Script<br><span style='font-size:14px'>資料會先寫入 Google Sheet，再由 Gmail 原生寄出。</span>";
  });

  helper.innerHTML='按下寄送後，本頁會直接進入 Google Apps Script。請不要關閉頁面；等待寄送完成並看到成功頁面後，再回 Command Center。';
}

nameField.addEventListener("input",()=>{ studentNameField.value=nameField.value||""; });
if(isAssessment){
  setAssessmentMode();
}else{
  setStandaloneMode();
}
</script><script src="/assets/toeic-return.js?v=20261101"></script>
</body></html>
