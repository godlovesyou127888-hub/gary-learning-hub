<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把分數轉成具體、可行動的個人化回饋。"><title>Gary AI Feedback Coach</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#4f735f;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#4f735f;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20AI%20Feedback%20Coach%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary AI Feedback Coach</h1><p>把分數轉成具體、可行動的個人化回饋。</p></div></header><main><section class="card"><h2>輸入表現</h2><div class="grid"><label>學員姓名<input id="name" value="Student"></label><label>分數<input id="score" type="number" value="70"></label></div><label>做得好的地方<textarea id="strength">能理解主要內容</textarea></label><label>主要問題<textarea id="weak">第三人稱單數與過去式不穩定</textarea></label><button id="generate">生成回饋</button></section><section class="card"><h2>回饋草稿</h2><div id="out" class="output"></div><button id="copy">複製</button></section></main><script>const $=x=>document.getElementById(x);function gen(){const n=$("name").value,s=$("score").value,st=$("strength").value,w=$("weak").value;$("out").textContent=n+"，這次的重點不是只看 "+s+" 分，而是確認哪些能力已經穩定、哪些還需要補強。\n\n【目前做得好的】\n"+st+"\n\n【本次最優先修正】\n"+w+"\n\n【下一步】\n先只處理這一個弱點：完成 5 題同類練習，若能連續 4 題以上正確，再進下一項。\n\n【教練提醒】\n不要一次重做全部內容；先把最影響分數的錯誤類型修掉。"}$("generate").onclick=gen;$("copy").onclick=()=>navigator.clipboard.writeText($("out").textContent);gen();</script></body></html>
