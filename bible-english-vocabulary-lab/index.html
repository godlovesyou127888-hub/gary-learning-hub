<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="聖經英文單字｜用經文常見字彙學字義、例句與小測。"><title>Bible English Vocabulary Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafbf7;color:#2f382c;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#526d58;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#526d58;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#edf0e8!important;color:#44503d!important}.card{background:#fff;border:1px solid #e1e6dc;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1ea;color:#4f5d46;font-size:13px;font-weight:800}.hidden{display:none}.output{white-space:pre-wrap;background:#f4f6f1;border-radius:10px;padding:14px}.story{font-size:21px}.verse{font-size:28px;font-weight:900;line-height:1.4}.zh{font-size:23px;font-weight:800}.quiz label{display:block;border:1px solid #dde5d8;border-radius:9px;padding:9px;margin:7px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #c8d2c2;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.muted{color:#667162;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}.verse{font-size:24px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Bible%20English%20Vocabulary%20Lab%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Bible English Vocabulary Lab</h1><p>聖經英文單字｜用經文常見字彙學字義、例句與小測。</p></div></header><main><section class="card"><h2>今日 10 個 Bible Words</h2><div id="words"></div></section>
<section class="card"><h2>Vocabulary Quiz</h2><div id="quiz" class="quiz"></div><button id="submit">交卷</button><p id="status"></p></section>
<section id="result" class="card hidden"><h2>結果</h2><div id="score" class="output"></div><div id="review"></div><button id="download">下載 JSON</button></section></main><script>const bank=[
["faith","信心","Faith can guide our choices."],["grace","恩典","Grace is a gift we do not earn."],["mercy","憐憫","Mercy responds to need with compassion."],["wisdom","智慧","Wisdom helps us choose what is right."],["peace","平安","Peace is more than the absence of conflict."],["love","愛","Love is shown through action."],["hope","盼望","Hope looks beyond the present difficulty."],["truth","真理","Truth shapes how we live."],["light","光","Light helps us see the path."],["shepherd","牧者","A shepherd cares for the sheep."],["courage","勇氣","Courage acts even when fear is present."],["forgive","饒恕","To forgive means not choosing revenge."],["serve","服事","To serve is to help others."],["pray","禱告","We pray to speak with God."],["blessing","祝福","A blessing is a gift of good from God."]
];const $=x=>document.getElementById(x);let current=bank.slice(0,10),res=[];function speak(t){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){current=[...bank].sort(()=>Math.random()-.5).slice(0,10);$("words").innerHTML=current.map((x,i)=>'<div class="card"><span class="tag">'+(i+1)+'</span><div class="verse">'+x[0]+'</div><div class="zh">'+x[1]+'</div><p>'+x[2]+'</p><button onclick="speak(\''+x[0]+'\')">聽發音</button></div>').join("");$("quiz").innerHTML=current.map((x,i)=>{const opts=[x[1],...bank.filter(y=>y[1]!==x[1]).sort(()=>Math.random()-.5).slice(0,3).map(y=>y[1])].sort(()=>Math.random()-.5);return '<p><b>Q'+(i+1)+'. What does “'+x[0]+'” mean?</b></p>'+opts.map(o=>'<label><input type=radio name=q'+i+' value="'+encodeURIComponent(o)+'"> '+o+'</label>').join("")}).join("");$("result").classList.add("hidden")}$("submit").onclick=()=>{if(current.some((x,i)=>!document.querySelector('[name=q'+i+']:checked'))){$("status").textContent="還有題目未作答。";return}res=current.map((x,i)=>{const c=decodeURIComponent(document.querySelector('[name=q'+i+']:checked').value);return{word:x[0],answer:x[1],chosen:c,correct:c===x[1]}});const s=res.filter(x=>x.correct).length;$("score").textContent="分數："+s+"/10｜正確率："+s*10+"%";$("review").innerHTML=res.map(x=>'<p class="'+(x.correct?'good':'bad')+'">'+(x.correct?'✓ ':'✗ ')+x.word+'｜'+x.answer+'</p>').join("");$("result").classList.remove("hidden")};$("download").onclick=()=>{const b=new Blob([JSON.stringify({date:new Date().toISOString(),results:res},null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="bible-vocabulary-result.json";a.click();URL.revokeObjectURL(u)};render();</script></body></html>
