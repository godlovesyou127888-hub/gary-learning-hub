<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="交通情境英文：計程車、公車、地鐵、火車、問路。"><title>樂齡交通英文</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#26352d;font:20px/1.7 system-ui,"Noto Sans TC",sans-serif}header{background:#3e6473;color:#fff;padding:22px 16px}.wrap,main{max-width:960px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:12px 16px;background:#548397;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9efea!important;color:#35503d!important}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ee;color:#35503d;font-size:14px;font-weight:800;margin:2px}.phrase{border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:12px 0}.sentence{font-size:34px;font-weight:900;line-height:1.25}.zh{font-size:25px;font-weight:800}.quiz label{display:block;border:1px solid #dfe7e1;border-radius:9px;padding:9px;margin:7px 0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#f7faf7;border:1px solid #e0e7e1;border-radius:10px;padding:12px;text-align:center}.metric b{display:block;font-size:26px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d1c8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.good{color:#047857}.bad{color:#b42318}.muted{font-size:15px;color:#66736a}@media(max-width:700px){.metric{grid-template-columns:1fr}.btn,button{width:100%}.sentence{font-size:31px}.card{padding:15px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body><nav aria-label="樂齡學習網站導覽" style="background:#e8f5ec;color:#163e30;border-bottom:2px solid #b7d7c2;padding:12px 16px;font:700 19px/1.6 system-ui,'Noto Sans TC',sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a href="/senior-learning-center/" style="display:inline-block;background:#246b4f;color:#fff;padding:10px 16px;min-height:50px;border-radius:10px;text-decoration:none">← 返回樂齡學習總站</a><a href="/" style="display:inline-block;background:#fff;color:#245c46;border:2px solid #9fcbb1;padding:8px 14px;min-height:50px;border-radius:10px;text-decoration:none">Gary Learning Hub</a></nav><header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E6%A8%82%E9%BD%A1%E4%BA%A4%E9%80%9A%E8%8B%B1%E6%96%87%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>樂齡交通英文</h1><p>交通情境英文｜先知道怎麼問，再知道怎麼確認方向。</p></div></header><main>
<section class="card"><h2>五大交通情境</h2><div id="tabs" class="actions"></div></section><section class="card"><h2 id="title"></h2><div id="items"></div></section><section class="card"><h2>4 題小測</h2><div id="quiz" class="quiz"></div><button id="submit">完成小測</button><p id="status"></p></section><section id="result" class="card hidden"><div class="metric"><div><b id="score"></b>答對</div><div><b id="accuracy"></b>正確率</div><div><b id="count"></b>累積完成</div></div><div id="review"></div></section>
<script>
const data=[
["計程車 Taxi",[["Please take me to this address.","請載我到這個地址。"],["How much is the fare?","車資多少？"],["Please stop here.","請在這裡停。"],["Could you use the meter?","可以跳表嗎？"]]],
["公車 Bus",[["Does this bus go downtown?","這班公車到市中心嗎？"],["Where is the bus stop?","公車站在哪裡？"],["Where should I get off?","我應該在哪站下車？"],["How often does the bus come?","公車多久一班？"]]],
["地鐵 Subway",[["Where is the subway station?","地鐵站在哪裡？"],["Which line should I take?","我應該搭哪一條線？"],["Do I need to transfer?","我需要轉車嗎？"],["Which exit should I use?","我應該走哪個出口？"]]],
["火車 Train",[["I would like one ticket, please.","我想買一張票。"],["What time is the next train?","下一班火車幾點？"],["Which platform is it?","在哪個月台？"],["Is this seat reserved?","這個座位有人預訂嗎？"]]],
["問路 Directions",[["How do I get to the station?","我要怎麼到車站？"],["Is it far from here?","離這裡遠嗎？"],["Should I turn left or right?","我應該左轉還是右轉？"],["Can you show me on the map?","可以在地圖上指給我看嗎？"]]]
];let idx=0,res=[];const $=x=>document.getElementById(x);function speak(t,r=.6){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}
function render(){const [n,it]=data[idx];$("tabs").innerHTML=data.map((d,i)=>'<button class="'+(i===idx?'':'secondary')+'" onclick="idx='+i+';render()">'+d[0]+'</button>').join("");$("title").textContent=n;$("items").innerHTML=it.map(x=>'<div class="phrase"><div class="sentence">'+x[0]+'</div><div class="zh">'+x[1]+'</div><button onclick="speak(\''+x[0].replace(/'/g,"\\'")+'\')">慢速聽</button></div>').join("");$("quiz").innerHTML=it.map((x,i)=>{const o=[...it.map(y=>y[1])].sort(()=>Math.random()-.5);return '<p><b>'+x[0]+'</b></p>'+o.map(v=>'<label><input type=radio name=q'+i+' value="'+encodeURIComponent(v)+'"> '+v+'</label>').join("")}).join("");$("result").classList.add("hidden")}
$("submit").onclick=()=>{const it=data[idx][1];if(it.some((x,i)=>!document.querySelector('[name=q'+i+']:checked'))){$("status").textContent="還有題目未作答。";return}res=it.map((x,i)=>{const c=decodeURIComponent(document.querySelector('[name=q'+i+']:checked').value);return{x,ok:c===x[1]}});const s=res.filter(x=>x.ok).length;let h=JSON.parse(localStorage.getItem("senior-transport-history-v1")||"[]");h.unshift({date:new Date().toISOString(),scene:data[idx][0],score:s});localStorage.setItem("senior-transport-history-v1",JSON.stringify(h.slice(0,20)));$("score").textContent=s+"/4";$("accuracy").textContent=s*25+"%";$("count").textContent=h.length;$("review").innerHTML=res.map(r=>'<p class="'+(r.ok?'good':'bad')+'">'+(r.ok?'✓ ':'✗ ')+r.x[0]+'｜'+r.x[1]+'</p>').join("");$("result").classList.remove("hidden")};render();
</script></main></body></html>
