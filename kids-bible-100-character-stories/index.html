<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="故事、討論與品格任務｜用短故事帶出可實踐的聖經品格。"><title>兒童聖經100個品格故事</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafbf7;color:#2f382c;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#7a6648;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#7a6648;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#edf0e8!important;color:#44503d!important}.card{background:#fff;border:1px solid #e1e6dc;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1ea;color:#4f5d46;font-size:13px;font-weight:800}.hidden{display:none}.output{white-space:pre-wrap;background:#f4f6f1;border-radius:10px;padding:14px}.story{font-size:21px}.verse{font-size:28px;font-weight:900;line-height:1.4}.zh{font-size:23px;font-weight:800}.quiz label{display:block;border:1px solid #dde5d8;border-radius:9px;padding:9px;margin:7px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #c8d2c2;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:110px}.muted{color:#667162;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}.verse{font-size:24px}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=%E5%85%92%E7%AB%A5%E8%81%96%E7%B6%93100%E5%80%8B%E5%93%81%E6%A0%BC%E6%95%85%E4%BA%8B%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>兒童聖經100個品格故事</h1><p>故事、討論與品格任務｜用短故事帶出可實踐的聖經品格。</p></div></header><main><section class="card"><h2>選一個品格主題</h2><select id="storySelect"></select></section>
<section class="card"><span class="tag" id="trait"></span><h2 id="title"></h2><div id="story" class="story"></div><p><b>經文：</b><span id="ref"></span></p><div class="actions"><button id="next">下一個故事</button><button id="speak" class="secondary">聽英文重點句</button></div></section>
<section class="card"><h2>一起討論</h2><div id="questions"></div></section>
<section class="card"><h2>今天的品格任務</h2><div id="mission" class="output"></div><label>我的行動<textarea id="reflection" placeholder="今天我準備怎麼做？"></textarea></label><button id="save">保存</button><div id="history"></div></section></main><script>const stories=[
{trait:"勇氣 Courage",title:"大衛面對歌利亞",story:"大衛不是因為自己最高大，而是相信神與他同在。他沒有假裝不害怕，而是在害怕中仍選擇往前。",ref:"1 Samuel 17",en:"Courage means doing what is right even when you are afraid.",qs:["大衛真正依靠的是什麼？","你最近有哪件事需要勇氣？"],mission:"今天主動完成一件你一直想逃避、但知道應該做的事。"},
{trait:"誠實 Honesty",title:"撒該願意改變",story:"撒該遇見耶穌後，不只說自己後悔，也願意補償曾經做錯的事。真正的誠實包括承認與修正。",ref:"Luke 19:1-10",en:"Honesty includes admitting mistakes and making things right.",qs:["撒該怎麼證明自己真的願意改變？","做錯事後，只說對不起夠不夠？"],mission:"今天若發現自己說錯或做錯一件事，主動承認並修正。"},
{trait:"恩慈 Kindness",title:"好撒瑪利亞人",story:"別人都走過去了，撒瑪利亞人卻停下來幫助受傷的人。恩慈不是只有感覺，而是願意付出行動。",ref:"Luke 10:25-37",en:"Kindness is love shown through action.",qs:["撒瑪利亞人做了哪些實際行動？","今天你可以幫助誰？"],mission:"今天主動幫一個人做一件小事，不等對方先開口。"},
{trait:"順服 Obedience",title:"挪亞造方舟",story:"挪亞在還沒看到洪水以前，就照神的吩咐開始預備。順服常常是在還沒有看到結果以前先採取行動。",ref:"Genesis 6-9",en:"Obedience means doing what is right before you see the result.",qs:["挪亞為什麼願意開始造方舟？","什麼時候你最容易拖延該做的事？"],mission:"今天把一件明知道該做、卻一直拖延的事完成第一步。"},
{trait:"饒恕 Forgiveness",title:"約瑟饒恕哥哥",story:"約瑟曾被哥哥們傷害，但後來有能力報復時，卻選擇饒恕並幫助家人。饒恕不是說傷害沒發生，而是不讓傷害繼續控制自己。",ref:"Genesis 45",en:"Forgiveness does not erase the hurt, but it changes what we do next.",qs:["約瑟有沒有權利生氣？","饒恕和假裝沒事有什麼不同？"],mission:"為一個曾讓你難過的人禱告，先把報復的念頭交給神。"},
{trait:"忠心 Faithfulness",title:"但以理持續禱告",story:"即使環境改變、甚至有危險，但以理仍然維持原本敬拜神的習慣。忠心常常不是做大事，而是每天持續做對的事。",ref:"Daniel 6",en:"Faithfulness means continuing to do what is right.",qs:["但以理面對什麼壓力？","你想建立哪一個每天都能持續的好習慣？"],mission:"選一個 5 分鐘就能完成的好習慣，今天開始。"}
];const $=x=>document.getElementById(x);let i=0;function render(){const s=stories[i];$("storySelect").innerHTML=stories.map((x,j)=>'<option value='+j+' '+(j===i?'selected':'')+'>'+x.trait+'｜'+x.title+'</option>').join("");$("trait").textContent=s.trait;$("title").textContent=s.title;$("story").textContent=s.story;$("ref").textContent=s.ref;$("questions").innerHTML=s.qs.map((q,k)=>'<p><b>'+(k+1)+'. '+q+'</b></p>').join("");$("mission").textContent=s.mission}$("storySelect").onchange=()=>{i=+$("storySelect").value;render()};$("next").onclick=()=>{i=(i+1)%stories.length;render()};$("speak").onclick=()=>{const u=new SpeechSynthesisUtterance(stories[i].en);u.lang="en-US";u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)};$("save").onclick=()=>{let h=JSON.parse(localStorage.getItem("kids-bible-character-history-v1")||"[]");h.unshift({date:new Date().toISOString(),trait:stories[i].trait,title:stories[i].title,reflection:$("reflection").value});localStorage.setItem("kids-bible-character-history-v1",JSON.stringify(h.slice(0,30)));show()};function show(){const h=JSON.parse(localStorage.getItem("kids-bible-character-history-v1")||"[]");$("history").innerHTML=h.length?h.slice(0,10).map(x=>'<p>'+new Date(x.date).toLocaleDateString()+'｜'+x.trait+'｜'+x.reflection+'</p>').join(""):"尚無紀錄。"}render();show();</script></body></html>
