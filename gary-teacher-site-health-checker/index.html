<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="網站 QA 與規格檢查：用可勾選清單找出上線前風險。"><title>Gary 教師網站健康檢查器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#25333a;font:18px/1.65 system-ui,"Noto Sans TC",sans-serif}header{background:#53616a;color:#fff;padding:22px 16px}.wrap,main{max-width:980px;margin:auto}main{padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;background:#53616a;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#e9eff1!important;color:#35505b!important}.card{background:#fff;border:1px solid #dfe8eb;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f5;color:#35505b;font-size:13px;font-weight:800}.output{white-space:pre-wrap;background:#f4f7f8;border-radius:10px;padding:14px;min-height:120px}input,select,textarea{width:100%;padding:10px;border:1px solid #c6d3d8;border-radius:9px;font:inherit;margin:5px 0 10px}textarea{min-height:120px}.muted{color:#66777e;font-size:14px}.good{color:#047857}.bad{color:#b42318}@media(max-width:720px){.grid{grid-template-columns:1fr}.btn,button{width:100%}}@media print{header .actions,.actions,button{display:none!important}body{background:white}.card{border:0}}</style></head><body>
<header><div class="wrap"><div class="actions"><a class="btn secondary" href="/">回 Hub</a><a class="btn secondary" href="/roadmap/">回 Roadmap</a><a class="btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=godlovesyou127888@gmail.com&su=Gary%20%E6%95%99%E5%B8%AB%E7%B6%B2%E7%AB%99%E5%81%A5%E5%BA%B7%E6%AA%A2%E6%9F%A5%E5%99%A8%20%E8%81%AF%E7%B5%A1%E7%AB%99%E9%95%B7" target="_blank">聯絡站長</a></div><h1>Gary 教師網站健康檢查器</h1><p>網站 QA 與規格檢查：用可勾選清單找出上線前風險。</p></div></header><main><section class="card"><h2>網站基本資料</h2><label>網站名稱<input id="name" value="My Learning Site"></label><label>網址（紀錄用途）<input id="url" placeholder="https://..."></label></section><section class="card"><h2>QA Checklist</h2><div id="checks"></div><button id="scoreBtn">計算健康分數</button></section><section class="card"><h2>檢查結果</h2><div id="out" class="output"></div><button id="download">下載 QA JSON</button></section></main><script>const items=["首頁能正常開啟","手機版可閱讀","主要按鈕可點","測驗能開始","交卷能計分","錯題或詳解能顯示","JSON/下載功能可用","列印/PDF可用","返回Hub/總站可用","聯絡站長可用","沒有FormSubmit依賴","沒有明顯404連結","表單欄位有標示","沒有把未接API功能寫成已完成","完成一次完整流程後資料不遺失"];const $=x=>document.getElementById(x);$("checks").innerHTML=items.map((x,i)=>'<label><input type=checkbox id=c'+i+'> '+x+'</label><br>').join("");function data(){const done=items.map((x,i)=>({item:x,passed:$("c"+i).checked})),score=Math.round(done.filter(x=>x.passed).length/items.length*100);return{name:$("name").value,url:$("url").value,date:new Date().toISOString(),score,checks:done}}$("scoreBtn").onclick=()=>{const d=data(),fails=d.checks.filter(x=>!x.passed).map(x=>"• "+x.item).join("\n");$("out").textContent="健康分數："+d.score+"/100\n\n尚未通過：\n"+(fails||"全部通過。")};$("download").onclick=()=>{const b=new Blob([JSON.stringify(data(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="site-health-check.json";a.click();URL.revokeObjectURL(u)};</script></body></html>
