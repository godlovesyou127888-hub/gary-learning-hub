<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gary 樂齡英語｜A–Z 入門</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC";margin:0;background:#faf8f1;color:#243b37}header{background:#16665d;color:white;padding:28px 18px}.wrap{max-width:1080px;margin:auto;padding:18px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#16665d;color:white;font-weight:700;text-decoration:none;cursor:pointer}.btn.alt{background:white;color:#16665d;border:2px solid #16665d}.panel{background:white;border:1px solid #d6e3de;border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:white;border:1px solid #cce0d5;border-radius:15px;padding:15px}.letter{font-size:38px;font-weight:800;color:#0f5b56}.ipa{color:#526b75}.word{font-size:22px;font-weight:750}.done{background:#edf9f2}.quizQ{margin:14px 0;padding:14px;border-top:1px solid #ddd}.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px;border-radius:10px;border:1px solid #bbb;background:#fff}.stat{display:inline-block;margin-right:18px}.notice{background:#fff7da;padding:12px;border-left:4px solid #ce9c25;border-radius:8px}</style></head><body><header><div class="wrap"><h1>Gary 樂齡英語｜字母・音標・單字入門</h1><p>A–Z、IPA、生活單字、超短例句、五題小測驗與學習紀錄</p></div></header><main class="wrap"><div class="top"><a class="btn alt" href="/">🏠 回 Gary Learning Hub</a><a class="btn alt" href="#contact">✉️ 聯絡站長</a><button class="btn" onclick="show('learn')">字母學習</button><button class="btn" onclick="show('quiz')">五題測驗</button><button class="btn" onclick="show('records')">學習紀錄</button></div><section id="learn"><div class="panel"><div class="stat">已學會：<b id="learnedCount">0/26</b></div><div class="stat">最佳成績：<b id="best">尚無</b></div><p class="notice">按「聽」可使用裝置英文語音；按「我學會了」會把進度儲存在目前瀏覽器。</p></div><div id="letters" class="grid"></div></section><section id="quiz" hidden><div class="panel"><h2>五題小測驗</h2><div id="questions"></div><button class="btn" onclick="grade()">交卷</button> <button class="btn alt" onclick="makeQuiz()">重新出題</button><div id="result"></div></div></section><section id="records" hidden><div class="panel"><h2>學習紀錄</h2><div id="recordList"></div><button class="btn alt" onclick="clearRecords()">清除本機紀錄</button></div></section><section id="contact" class="panel"><h2>聯絡站長</h2><form action="https://formsubmit.co/godlovesyou127888@gmail.com" method="POST"><input type="hidden" name="_subject" value="Gary 樂齡英語｜學員留言"><p><input name="name" placeholder="姓名" required style="width:100%;padding:12px"></p><p><input type="email" name="email" placeholder="Email" required style="width:100%;padding:12px"></p><p><textarea name="message" placeholder="留言" required style="width:100%;padding:12px;min-height:100px"></textarea></p><button class="btn" type="submit">送出</button></form></section></main><script>const D=[['A','/eɪ/','apple','/ˈæpəl/','蘋果','An apple.'],['B','/biː/','book','/bʊk/','書','My book.'],['C','/siː/','cat','/kæt/','貓','A cat.'],['D','/diː/','dog','/dɔːɡ/','狗','A big dog.'],['E','/iː/','egg','/ɛɡ/','蛋','An egg.'],['F','/ɛf/','fish','/fɪʃ/','魚','A small fish.'],['G','/dʒiː/','gift','/ɡɪft/','禮物','A nice gift.'],['H','/eɪtʃ/','hat','/hæt/','帽子','My red hat.'],['I','/aɪ/','ice','/aɪs/','冰','Cold ice.'],['J','/dʒeɪ/','juice','/dʒuːs/','果汁','Apple juice.'],['K','/keɪ/','key','/kiː/','鑰匙','My key.'],['L','/ɛl/','lamp','/læmp/','檯燈','A bright lamp.'],['M','/ɛm/','milk','/mɪlk/','牛奶','Warm milk.'],['N','/ɛn/','nose','/noʊz/','鼻子','My nose.'],['O','/oʊ/','orange','/ˈɔːrɪndʒ/','橘子','An orange.'],['P','/piː/','pen','/pɛn/','筆','A blue pen.'],['Q','/kjuː/','queen','/kwiːn/','女王','The queen.'],['R','/ɑːr/','rice','/raɪs/','米飯','Hot rice.'],['S','/ɛs/','sun','/sʌn/','太陽','The sun.'],['T','/tiː/','tea','/tiː/','茶','Hot tea.'],['U','/juː/','umbrella','/ʌmˈbrɛlə/','雨傘','My umbrella.'],['V','/viː/','van','/væn/','廂型車','A white van.'],['W','/ˈdʌbəl.juː/','water','/ˈwɔːtɚ/','水','Drink water.'],['X','/ɛks/','box','/bɑːks/','盒子','A big box.'],['Y','/waɪ/','yellow','/ˈjɛloʊ/','黃色','Yellow hat.'],['Z','/ziː/','zoo','/zuː/','動物園','At the zoo.']];const K='gary_senior_az_v2';let s=JSON.parse(localStorage.getItem(K)||'{"learned":[],"scores":[]}'),quiz=[];function save(){localStorage.setItem(K,JSON.stringify(s))}function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){letters.innerHTML=D.map(x=>`<article class="card ${s.learned.includes(x[0])?'done':''}"><div class="letter">${x[0]} <span class="ipa">${x[1]}</span></div><div class="word">${x[2]} <span class="ipa">${x[3]}</span></div><div>${x[4]}</div><p><b>${x[5]}</b></p><button class="btn alt" onclick="speak('${x[2]}')">聽</button> <button class="btn" onclick="toggle('${x[0]}')">${s.learned.includes(x[0])?'✓ 已學會':'我學會了'}</button></article>`).join('');learnedCount.textContent=s.learned.length+'/26';best.textContent=s.scores.length?Math.max(...s.scores)+' 分':'尚無';recordList.innerHTML=s.scores.length?s.scores.map((x,i)=>`<p>第 ${i+1} 次：${x} 分</p>`).join(''):'<p>目前沒有測驗紀錄。</p>'}function toggle(l){s.learned=s.learned.includes(l)?s.learned.filter(x=>x!==l):[...s.learned,l];save();render()}function show(id){for(const x of ['learn','quiz','records'])document.getElementById(x).hidden=x!==id;if(id==='records')render()}function makeQuiz(){quiz=[...D].sort(()=>Math.random()-.5).slice(0,5);questions.innerHTML=quiz.map((x,i)=>{let choices=[x[4],...D.filter(y=>y[4]!==x[4]).sort(()=>Math.random()-.5).slice(0,3).map(y=>y[4])].sort(()=>Math.random()-.5);return `<div class="quizQ"><b>${i+1}. ${x[2]} 是什麼？</b>${choices.map(c=>`<label class="opt"><input type="radio" name="q${i}" value="${c}"> ${c}</label>`).join('')}</div>`}).join('');result.textContent=''}function grade(){let score=0;quiz.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&a.value===x[4])score+=20});s.scores.unshift(score);save();result.innerHTML=`<h3>本次成績：${score} 分</h3>`;render()}function clearRecords(){if(confirm('確定清除本機紀錄？')){s={learned:[],scores:[]};save();render()}}render();makeQuiz();</script></body></html>
